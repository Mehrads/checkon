name: Test

on:
  pull_request:
  push:
    branches-ignore: [main] # main runs these through deploy.yml
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only values; no real secrets are needed because the LLM is scripted in tests.
      FASTAPI_ENV: development
      PROJECT_NAME: Ontario Job Posting Checker
      SECRET_KEY: ci-only-secret-key
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: ci-only-password
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/app
      # The template's password-recovery test needs email settings (it doesn't send anything)
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_TLS: "False"
      EMAILS_FROM_EMAIL: info@example.com
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
        working-directory: frontend
      - run: bun run build
        working-directory: frontend
