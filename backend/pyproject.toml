[project]
name = "app"
version = "0.1.0"
description = "Ontario job posting compliance checker: rule engine, Inspector and Refiner"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
