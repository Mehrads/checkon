[project]
name = "app"
version = "0.1.0"
description = "Ontario job posting compliance checker: rule engine, Inspector and Refiner"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pysbd>=0.3.4",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# pysbd 0.3.4 has unescaped regex strings; the warnings are harmless.
filterwarnings = ["ignore:invalid escape sequence:SyntaxWarning"]
