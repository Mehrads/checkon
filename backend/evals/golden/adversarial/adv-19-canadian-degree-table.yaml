text: |
  Civil Designer (EIT) - Municipal Infrastructure
  Kitchener, ON
  Conestoga Valley Engineering Ltd.

  Conestoga Valley Engineering designs roads, watermains and stormwater systems for municipalities across Waterloo
  Region and Wellington County. We are 170 engineers, technologists and planners.

  The role
  Join our municipal team to design road reconstruction and servicing projects from concept through tender and
  construction.

  Responsibilities
  - Prepare grading, servicing and stormwater designs in Civil 3D
  - Run hydraulic and stormwater calculations under senior review
  - Prepare quantity estimates and tender documents
  - Attend site meetings and review contractor submissions during construction

  | Qualifications | |
  | --- | --- |
  | Degree | Bachelor's degree in Civil Engineering from a Canadian university |
  | Registration | Registered as an Engineer-in-Training (EIT) with Professional Engineers Ontario |
  | Experience | 1 to 3 years of municipal design experience (co-op terms count) |
  | Software | Proficiency in AutoCAD Civil 3D |
  | Communication | Strong written communication |

  Salary: $68,000 to $78,000 per year. Paid PEO fees and a professional development budget.

  This posting is for an existing vacancy.
