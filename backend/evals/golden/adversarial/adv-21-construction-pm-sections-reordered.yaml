notes: >-
  Range width is $60,000, over the $50,000 limit (Reg. s. 4), and the top is below $200,000, so no exemption. The
  employer screens with an AI ranking tool and says nothing. "Knowledge of CCDC contracts and the Construction Act" is
  knowledge of Ontario/Canadian contract law and could itself be read as borderline, but the violation already decides
  the CEX label. Lawyer: none beyond Q8d on the knowledge bullet. Adversarial: labels must equal
  syn-mix-02-construction-pm-three-fails's.
