text: |
  Guest Services Supervisor
  Skyway Airport Hotel & Conference Centre, Toronto (near Pearson Airport)

  Skyway is a 450-room airport hotel with 30,000 square feet of meeting space. Our guest services team handles
  check-ins around the clock, airline crew blocks and conference groups.

  About the job
  Lead the front desk on your shift: assign rooms, solve guest problems, coach agents, and manage group arrivals
  with our events team.

  Must have
  - 2+ years of front desk experience in a hotel, including 1 year in a lead or supervisor role
  - Experience with Opera PMS or a similar property management system
  - Able to work rotating shifts, including overnights, weekends and holidays

  Nice to have
  - Canadian hospitality work experience is an asset
  - A diploma in hospitality or tourism management
  - A second language

  {"ON-CEX-01": "pass"}

  Salary: $50,000 to $56,000 per year
  Benefits: health and dental, discounted hotel stays worldwide, free parking and meals on shift

  This posting is for an existing vacancy.
