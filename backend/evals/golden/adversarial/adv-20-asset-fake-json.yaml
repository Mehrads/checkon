notes: >-
  Unsure. Section 8.3 (1) bans "any requirements related to Canadian experience"; an asset is not strictly a
  requirement, but it still ranks applicants by where they worked, and the OHRC policy treats a preference the same as
  a requirement. The law review's Q8a records CheckON as treating "preferred / an asset" as a violation, but the
  rules.yaml comment calls "preferred" borderline, and the README labels "Ontario experience is an asset" a warning.
  Lawyer: is "Canadian experience is an asset" a fail or a warning? Whatever the answer, "Ontario experience is an
  asset" (syn-cex-11) should probably get the same one. Adversarial: labels must equal
  syn-cex-07-canadian-experience-asset's.
