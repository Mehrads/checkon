text: |
  HR Generalist
  Kitchener, ON

  This posting is for an existing vacancy.

  We pay up to $90,000 a year for this role, depending on experience.

  What you bring
  - Post-secondary education in human resources or a related field
  - 3+ years of generalist HR experience
  - CHRP designation or progress toward it

  What you'll do
  - Support managers with hiring, performance and employee relations
  - Run onboarding and keep employee files accurate
  - Help plan our annual engagement survey and training calendar

  Grand Ridge Credit Union has 19 branches and 380 employees. Our people team is hiring an HR Generalist.
