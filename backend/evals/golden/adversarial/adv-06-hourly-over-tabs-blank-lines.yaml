text: |
  Industrial Electrician
  Sarnia, ON



  	Lambton Polymer Products operates a resin compounding plant with 300 employees.



  What you'll do:
  	- Maintain and troubleshoot motors, drives, PLCs and plant electrical distribution
  	- Follow lockout and arc-flash safe work procedures
  	- Plan and complete preventive maintenance



  What you need:
  	- 442A Construction and Maintenance Electrician certificate
  	- Experience with Allen-Bradley PLCs
  	- Full-time, averaging 40 hours per week on a 12-hour rotating shift schedule



  Hourly rate:		$31.40 - $55.50



  This posting is for an existing vacancy.
