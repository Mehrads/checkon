id: syn-cex-03-must-have-worked-in-canada
slice: synthetic
purpose: >-
  "Applicants must have worked in Canada for at least two years", in prose, in a grocery management posting.
context:
  uses_ai_in_hiring: false
text: |
  Assistant Store Manager - FreshWay Market, Scarborough (Lawrence Ave E)

  FreshWay Market is a family-run grocery chain with 14 stores across the GTA, known for fresh produce, an
  international aisle that goes on forever, and a hot food counter people line up for.

  We're looking for an Assistant Store Manager to help run our Scarborough store with the Store Manager. You'll
  lead the store on your shifts, look after ordering for produce and grocery, schedule a team of around 60, and
  make sure the store is clean, stocked and safe from open to close. You'll also train new department leads and
  deal with customer concerns the floor team can't solve.

  Applicants must have worked in Canada for at least two years, ideally in grocery or food retail, with at least
  one year supervising staff. You should be comfortable with inventory systems and basic sales reports, and able
  to work early mornings, evenings and weekends.

  We pay $50,000 to $57,000 a year, with benefits after three months and a 10% staff discount.

  This posting is for an existing vacancy.
