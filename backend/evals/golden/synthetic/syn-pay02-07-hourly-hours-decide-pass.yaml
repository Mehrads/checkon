  ON-VAC-01: pass
  ON-AI-01: pass
  ON-CEX-01: pass
labelled_by: [claude]
notes: >-
  $25 x 37.5 h x 52 = $48,750 (pass); at the 40-hour default it would be $52,000 (fail). The hours are in the
  posting and in the context. Lawyer (law review Q2): is "an amount equivalent to $50,000 annually" measured at
  the job's own hours?
