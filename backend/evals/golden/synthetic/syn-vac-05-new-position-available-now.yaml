id: syn-vac-05-new-position-available-now
slice: synthetic
purpose: >-
  A newly created position that is "available now", stated near the top: new doesn't mean not existing.
context:
  uses_ai_in_hiring: false
text: |
  Health and Safety Coordinator
  Orillia, ON

  Couchiching Composites makes fibreglass parts for boats and RVs, with 240 employees.

  About the role
  This is a newly created position, and it is available now. You'll be the first dedicated health and safety coordinator at our plant and will report to the Plant Manager.

  What you'll do
  - Run the joint health and safety committee and monthly inspections
  - Investigate incidents and track corrective actions
  - Deliver safety training to new and current employees

  What you bring
  - Certificate or diploma in occupational health and safety
  - 2+ years in a health and safety role, ideally in manufacturing
  - Confidence training and coaching people on the floor

  Salary: $66,000 - $76,000 per year
labels:
  ON-APPL-01: pass
  ON-APPL-02: pass
  ON-PAY-01: pass
  ON-PAY-02: pass
  ON-VAC-01: pass
  ON-AI-01: pass
  ON-CEX-01: pass
labelled_by: [claude]
notes: >-
  The guide defines an existing vacancy as a position "imminently available for a qualified candidate to fill";
  a new position available now is one. Lawyer (Q6c): enough without the words "existing vacancy"? A classifier
  could misread "newly created" as not existing.
