notes: >-
  Unsure. ASPE is a named accounting standard that can be learned and applied anywhere, so we read it as a technical
  skill, unlike "Canadian accounting experience". But the law review records CheckON's classifier reading "Canadian
  GAAP" as borderline (Q8d), and the README labels "knowledge of Canadian tax rules" a warning (syn-cex-12), which has
  the same shape. Lawyer: are experience with Canadian GAAP and knowledge of Canadian tax rules both outside s. 8.3,
  both borderline, or different?
