text: |
  Accounts Payable Clerk
  Windsor, ON

  Riverside Auto Parts supplies stampings and assemblies to vehicle plants, with 450 employees at two Windsor plants. Our finance team of 12 needs an Accounts Payable Clerk.

  You will
  - Match invoices to purchase orders and receiving records
  - Run weekly cheque and EFT payment batches
  - Reconcile vendor statements and resolve discrepancies

  You have
  - 2+ years of accounts payable experience
  - Working knowledge of an ERP system (we use SAP)
  - Strong attention to detail

  Salary: [add pay]

  This posting is for an existing vacancy.
