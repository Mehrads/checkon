id: syn-vac-13-immediate-opening
slice: synthetic
purpose: >-
  "Immediate opening" with a start date, right under the company line, as the only vacancy wording.
context:
  uses_ai_in_hiring: false
text: |
  Heavy Equipment Operator
  Kenora, ON

  Lake of the Woods Contracting does road building and site work across the northwest, with 130 employees.

  Immediate opening: start date October 19, 2026.

  What you'll do
  - Operate excavators, loaders and dozers on road and site projects
  - Do daily equipment checks and report repairs
  - Follow site safety plans and traffic control

  What you need
  - 3+ years operating heavy equipment
  - Valid DZ licence (AZ an asset)
  - Willing to work extended hours in season

  Pay: $32.00 - $38.00 per hour
labels:
  ON-APPL-01: pass
  ON-APPL-02: pass
  ON-PAY-01: pass
  ON-PAY-02: pass
  ON-VAC-01: pass
  ON-AI-01: pass
  ON-CEX-01: pass
labelled_by: [claude]
notes: >-
  Lawyer (Q6b, Q6c): "Immediate opening" with a fixed start date says a position is imminently available, so
  labelled pass; it doesn't use the words "existing vacancy". Width $6 an hour stays under $19,000 even at 60
  hours, so extended hours don't matter.
