labelled_by: [claude]
notes: >-
  Unsure. A U.S. seller meets it without Canadian experience, so it isn't a Canadian experience requirement on its
  face, but it shuts out experience from everywhere outside the continent and reads as a stand-in. The law review
  records the classifier giving borderline for one phrasing and ok for another (Q8c). Lawyer: is "North American
  experience required" a requirement related to Canadian experience (fail), borderline (warning), or fine (pass)?
