id: syn-cex-13-north-american-experience
slice: synthetic
purpose: >-
  "5+ years of North American B2B sales experience required": a place condition wider than Canada. Labelled a
  warning; the lawyer may say fail.
context:
  uses_ai_in_hiring: false
text: |
  Regional Sales Manager - Industrial Packaging
  Concord, ON (field-based, Ontario territory)
  Vellore Packaging Systems Inc.

  Vellore makes stretch film, strapping and packaging equipment for warehouses and food plants. We have 320 employees
  and plants in Concord and Cambridge.

  Role
  Grow our business with manufacturers and distributors across Ontario: find new accounts, run equipment trials,
  negotiate supply agreements and look after a book of about 60 existing customers.

  Requirements
  • 5+ years of North American B2B sales experience required, ideally in packaging, industrial supplies or
    capital equipment
  • A track record of hitting a territory quota
  • Comfortable with Salesforce and building a weekly pipeline report
  • Valid driver's licence; travel within Ontario about 3 days a week

  Compensation
  • Base salary: $90,000 - $110,000
  • Company car, expense account and phone
  • Group benefits and a pension plan with company match

  This posting is for an existing vacancy.
labels:
  ON-APPL-01: pass
