id: syn-ai-07-ats-knockout-no-ai
slice: synthetic
purpose: >-
  The employer doesn't use AI; the posting says the ATS asks knockout questions and sorts applications
  automatically. Not an AI claim, so no warning.
context:
  uses_ai_in_hiring: false
text: |
  Forklift Operator - Nights
  Grand River Cold Storage | Cambridge, ON

  Grand River Cold Storage stores and ships frozen and chilled food for grocers across Southwestern Ontario.
  We are adding an operator to our night crew (Sunday to Thursday, 10:00 pm to 6:30 am).

  What the job is
  Move product between the dock, the racking and the blast freezer using reach trucks and counterbalance
  forklifts. Load and unload trailers, check counts against the paperwork and keep your area clean and safe.

  What you need
  - Valid forklift certification (reach truck experience a plus)
  - 1+ year operating a forklift in a warehouse
  - Comfort working in -25 °C freezer areas for part of each shift (we supply freezer gear)
  - Steel-toe boots

  Pay: $21.00 to $23.50 per hour, plus a $2.00 per hour night premium
  Perks: benefits after 90 days, paid breaks, free parking

  How to apply: submit your application on our careers page. Our applicant tracking system will ask three
  knockout questions (forklift certification, night availability, freezer work) and sort applications
  automatically based on your answers.

  This posting is for an existing vacancy.
