text: |
  Mental Health Counsellor - Adult Services
  Brockville, ON

  Thousand Islands Family Services is a community counselling agency with 85 staff.

  About the team
  Our adult services team of nine counsellors offers short-term counselling and walk-in sessions. This posting is for an existing vacancy on that team, created when a counsellor moved into a supervisory role. We work closely with nearby hospitals and family doctors.

  What you'll do
  - Provide individual and group counselling to adults
  - Complete assessments and safety plans
  - Connect clients with community resources

  What you need
  - Master's degree in social work or counselling psychology
  - Registration with the relevant regulatory college, in good standing
  - 2+ years of counselling experience

  Pay: $72,000 - $84,000 per year
