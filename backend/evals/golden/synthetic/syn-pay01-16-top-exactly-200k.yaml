id: syn-pay01-16-top-exactly-200k
slice: synthetic
purpose: >-
  A range whose top is exactly $200,000: not "more than" $200,000, so disclosure is required (and is given).
context:
  uses_ai_in_hiring: false
text: |
  Director, Clinical Operations
  Mississauga, ON

  Westmark Diagnostics runs 35 medical imaging and lab collection sites with 900 staff. We're hiring a Director of Clinical Operations to lead our western region.

  Responsibilities
  - Lead 12 site managers and the regional quality team
  - Own patient wait times, accreditation readiness and staffing plans
  - Prepare the region's annual operating budget

  Qualifications
  - Degree in health sciences or health administration; master's preferred
  - 8+ years in healthcare operations, including 4 in a multi-site leadership role
  - Strong grasp of quality and patient safety programs

  Salary: $165,000 to $200,000 annually.

  This posting is for an existing vacancy.
labels:
