labelled_by: [claude]
notes: >-
  The 442A Certificate of Qualification and Red Seal are trade certifications (licensing), and work eligibility is
  work authorization, not experience; both are the rule pack's "ok" examples. Lawyer: none on the label. Is
  "legally eligible to work in Canada" ever a problem under the Human Rights Code (citizenship) even though it's
  fine under s. 8.3? That's outside CheckON's scope but worth a line.
