id: syn-ai-10-product-feature-uses-ai
slice: synthetic
purpose: >-
  AI is used to screen; the posting talks about machine learning only as a product feature. Not a disclosure, so
  ON-AI-01 fails.
context:
  uses_ai_in_hiring: true
text: |
  Account Manager, Grocery Retail
  Shelfwise Analytics Inc., Toronto, ON (hybrid)

  Who we are
  Shelfwise helps grocery retailers order the right amount of fresh food. Our platform uses machine learning to
  forecast demand store by store, so our customers waste less and run out less. We work with 30 retail banners
  across Canada and the U.S.

  What you'll do
  You'll look after a portfolio of 10 to 15 grocery customers after they go live: running quarterly business
  reviews, spotting accounts at risk, finding chances to expand into new categories, and bringing customer
  feedback to our product team.

  - Own renewals and expansion for your accounts
  - Build relationships with category managers and supply chain leads
  - Turn forecast accuracy and waste data into a clear story for executives
  - Travel to customer head offices about 4 times a year

  What we're looking for
  - 3 to 5 years in account management or customer success for a B2B software or data product
  - Experience in grocery, CPG or retail supply chain is a strong asset
  - Confident presenting numbers to senior audiences
  - Organized, with a habit of following through

  Compensation: base salary of $70,000 to $85,000. Benefits from day one and a flexible vacation policy.

  This posting is for an existing vacancy.
