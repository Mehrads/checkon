id: syn-mix-04-sdr-open-ended-ai-denial
slice: synthetic
purpose: >-
  Open-ended base pay ("$55,000+", ON-PAY-02 fails) and a "we do not use AI" statement while the employer uses it
  (ON-AI-01 fails). Startup-style writing.
context:
  uses_ai_in_hiring: true
text: |
  Sales Development Representative
  Tallyline - Toronto (King & Spadina), in office 4 days a week

  Tallyline helps restaurants cut food costs with smart inventory counts. 1,800 restaurants, 140 Tallyliners, and
  we just closed our Series B. We need SDRs who love the phone and aren't scared of a "no".

  What you'll do
  → Prospect independent and multi-location restaurant owners by phone, email and LinkedIn
  → Book qualified demos for our account executives (target: 12 a month)
  → Learn our product inside out and tell restaurant owners why it matters
  → Keep HubSpot clean (we mean it)

  What you'll bring
  → 0 to 2 years in sales, hospitality or a customer-facing job
  → Grit, curiosity and a sense of humour
  → Bonus points if you've worked in a restaurant kitchen or front of house

  Comp
  → $55,000+ base plus uncapped commission
  → Health and dental from day one, lunch on Fridays, and a $500 home-office stipend

  We do not use AI in our hiring process. Real humans read every application.

  This posting is for an existing vacancy.
labels:
  ON-APPL-01: pass
  ON-APPL-02: pass
  ON-PAY-01: pass
  ON-PAY-02: fail
  ON-VAC-01: pass
  ON-AI-01: fail
  ON-CEX-01: pass
labelled_by: [claude]
notes: >-
  "$55,000+" gives a minimum but no maximum; CheckON reads open-ended pay as not a range (law review Q1). The
  employer's ATS ranks applicants with an AI fit score, so the "no AI" line is false and nothing discloses the use.
  The commission has no figure (Q4b), but the base pay is stated, so ON-PAY-01 passes on our reading. Lawyer: Q1
  (is "$55,000+" a failing range or acceptable "information about the expected compensation"?) and Q4b.
