notes: >-
  Uncertain; lawyer (Q6a). "May be used to fill current and future vacancies" suggests there may be a current
  vacancy but doesn't say whether this posting is for one. Labelled warning (vague). It could be read as an
  existing-vacancy statement (pass) or as no clear statement (fail). Worth settling, since many hospital and
  municipal postings use this line.
