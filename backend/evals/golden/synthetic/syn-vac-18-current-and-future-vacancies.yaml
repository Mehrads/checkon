id: syn-vac-18-current-and-future-vacancies
slice: synthetic
purpose: >-
  The common public-sector line "This competition may be used to fill current and future vacancies."
context:
  uses_ai_in_hiring: false
text: |
  Medical Laboratory Technologist
  Pembroke, ON

  Upper Valley Health Centre is a community hospital with 1,100 staff across two sites.

  What you'll do
  - Perform tests in chemistry, hematology and transfusion medicine
  - Run quality control and maintain analyzers
  - Report critical results to physicians and nurses

  What you need
  - Medical laboratory science diploma or degree
  - Registration as a medical laboratory technologist in good standing
  - Willing to work rotating shifts, including nights

  Pay: $39.00 - $47.00 per hour
  Posting number: MLT-2026-114

  This competition may be used to fill current and future vacancies.
