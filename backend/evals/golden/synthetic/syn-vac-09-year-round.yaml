notes: >-
  Lawyer (Q6a): like "applications accepted on an ongoing basis" (a rule-pack example labelled vague), it doesn't
  say whether there is a vacancy now. Labelled warning; the stricter reading is fail. The hourly range is $1 wide,
  so the six-day week can't push it near the width limit.
