id: syn-vac-09-year-round
slice: synthetic
purpose: >-
  A rephrasing of "ongoing basis": "Applications for this role are accepted year-round."
context:
  uses_ai_in_hiring: false
text: |
  Greenhouse Production Worker
  Leamington, ON

  Erie Shore Greenhouses grows tomatoes and cucumbers under 90 acres of glass, with 600 employees.

  What you'll do
  - Plant, prune, train and harvest crops
  - Check plants for pests and report problems to your lead
  - Keep rows and walkways clean

  What you need
  - Able to work in warm conditions and stand for long periods
  - Comfortable with repetitive tasks
  - Available for a 6:00 a.m. start, Monday to Saturday

  Pay: $18.75 - $19.75 per hour

  Applications for this role are accepted year-round.
