id: syn-pay01-02-weekly-range
slice: synthetic
purpose: >-
  Pay stated as a weekly range; tips are mentioned alongside the wage but aren't the pay.
context:
  uses_ai_in_hiring: false
text: |
  Sous Chef
  Ottawa, ON (ByWard Market)

  Juniper & Rye is a restaurant group with three locations and 120 staff in Ottawa. We're looking for a sous chef to run the line at our Market location alongside our executive chef.

  Responsibilities:
  • Lead the kitchen on service nights and manage a brigade of eight cooks
  • Order produce and dry goods, and track food cost and waste
  • Train new cooks on recipes, plating and food safety

  Requirements:
  • 3+ years in a high-volume kitchen, including at least one year as a lead or junior sous
  • Food handler certificate
  • Comfortable with evenings and weekends

  Compensation: $1,150 - $1,350 per week, plus staff meals and a share of the kitchen tip pool.

  This posting is for an existing vacancy.
