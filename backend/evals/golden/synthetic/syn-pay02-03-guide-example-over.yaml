  ON-AI-01: pass
  ON-CEX-01: pass
labelled_by: [claude]
notes: >-
  The guide: "$85,000 to $135,000 may be included ... $85,000 to $140,000 cannot". No unit is written, but a
  lawyer's salary in this range is plainly yearly. A licence to practise is a licensing requirement (ON-CEX-01 pass).
