id: syn-vac-04-always-looking-no-statement
slice: synthetic
purpose: >-
  A specific job that ends with "we're always looking for friendly people" and never says whether it is an
  existing vacancy.
context:
  uses_ai_in_hiring: false
text: |
  Front Desk Agent
  Stratford, ON

  The Avon Crest Hotel is a 180-room hotel and conference centre with 140 staff, a short walk from the theatres.

  What you'll do
  - Check guests in and out and handle reservations
  - Answer calls and emails and solve guest problems
  - Work with housekeeping and maintenance to get rooms ready

  What you need
  - 1+ year of front desk or customer service experience
  - Comfort with a property management system
  - Availability for evenings, weekends and holidays

  Pay: $19.00 - $21.00 per hour

  We're a growing team and we're always looking for friendly people to join us!
labels:
  ON-APPL-01: pass
  ON-APPL-02: pass
  ON-PAY-01: pass
  ON-PAY-02: pass
  ON-VAC-01: fail
  ON-AI-01: pass
  ON-CEX-01: pass
labelled_by: [claude]
notes: >-
  The last line is about the employer in general, not about this job's vacancy, so there is no statement
  (fail, not warning). The posting names a specific position with duties and pay, so the "always looking" line
  doesn't make it a general recruitment campaign (ON-APPL-02 pass); a reader could be tempted to call it one.
