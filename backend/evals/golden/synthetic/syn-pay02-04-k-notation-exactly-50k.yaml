text: |
  Senior DevOps Engineer
  Toronto, ON (hybrid)

  Finchley Analytics builds pricing software for grocery retailers. 180 people, offices in Toronto and Halifax; this role works from Toronto.

  What you'll do
  → Run our Kubernetes clusters on AWS and keep them healthy
  → Improve our CI/CD pipelines and cut build times
  → Lead incident reviews and on-call improvements

  What you've done
  → 5+ years in DevOps, SRE or platform engineering
  → Terraform and Kubernetes in production
  → Good habits around security and cost

  Comp: $130K-$180K base + annual bonus

  This posting is for an existing vacancy.
