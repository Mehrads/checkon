text: |
  Warehouse Associate - Day Shift
  Brampton, ON

  Northline Distribution runs a 400,000 sq. ft. fulfilment centre serving retailers across the GTA. We're adding an associate to our inbound team.

  What you'll do
  - Unload trailers and check shipments against packing lists
  - Pick, pack and stage orders for outbound carriers
  - Keep aisles and docks clean and safe

  What you bring
  - Able to lift up to 50 lb throughout a shift
  - Forklift certification is an asset (we also train)
  - Reliable attendance and a safety-first attitude

  Pay: $21.50 - $24.00 per hour

  This posting is for an existing vacancy.
