text: |
  Senior Land Use Planner
  Newmarket, ON

  Ridgeline Planning Partners is a planning and urban design firm with 120 staff, working for developers and municipalities across the GTA.

  Responsibilities
  - Lead official plan and zoning amendment applications
  - Prepare planning justification reports and present at public meetings
  - Mentor junior planners

  Qualifications
  - Degree in urban planning or a related field
  - RPP designation, or eligible within one year
  - 6+ years of land use planning experience

  Salary band (Grade 7)
  Minimum | Midpoint | Maximum
  $82,500 | $107,750 | $133,000

  This posting is for an existing vacancy.
