text: |
  Early Childhood Educator - Preschool Room
  Ottawa, ON (Kanata)

  Little Maples Child Care runs 11 licensed centres in Ottawa with 290 staff. Our Kanata centre is hiring a full-time ECE for the preschool room.

  You will
  - Plan and lead play-based learning for children aged 2.5 to 5
  - Observe and document each child's progress and share it with families
  - Keep the room safe, clean and welcoming

  You have
  - An Early Childhood Education diploma and registration as an RECE in good standing
  - Standard First Aid and CPR Level C
  - A vulnerable sector check, or willingness to obtain one

  Pay: $24.50 - $28.00 per hour

  This job is an existing vacancy.
