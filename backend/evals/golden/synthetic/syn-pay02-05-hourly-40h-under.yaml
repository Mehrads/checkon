  Industrial Millwright
  Woodstock, ON

  Oxford Axle Systems machines and assembles axles for heavy trucks, with 520 employees.

  Responsibilities
  - Install, align and repair conveyors, presses and gearboxes
  - Read prints and fabricate parts when needed
  - Support line changeovers and new equipment installs

  Requirements
  - Industrial Millwright (433A) certificate of qualification
  - 2+ years of plant maintenance experience
  - Able to work rotating 8-hour shifts, 40 hours per week

  Pay: $33.00 - $57.00 per hour, based on certification and experience.

  This posting is for an existing vacancy.
