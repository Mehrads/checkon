id: syn-ai-02-ai-assisted-screening
slice: synthetic
purpose: >-
  A terse disclosure ("Screening for this role is AI-assisted") with AI used, in a short credit-union branch posting.
context:
  uses_ai_in_hiring: true
text: |
  Client Service Representative, Full-Time
  Glebe Branch, Ottawa, ON
  Rideau Community Credit Union

  Help our members with everyday banking at the counter and by phone: deposits, withdrawals, bill payments,
  account openings and simple questions about our products. You'll refer members to our advisors when they
  need more.

  You have:
  - 1+ year of customer service experience, ideally with cash handling
  - Accuracy with numbers and a habit of double-checking
  - A friendly, patient manner with people of all ages
  - Availability for Saturday shifts on a rotation (about 2 a month)

  Pay: $44,000 to $50,000 a year, plus benefits and an RRSP match.
  Hours: 37.5 a week.

  Screening for this role is AI-assisted.

  This posting is for an existing vacancy.

  We welcome applications from people with disabilities. Accommodations are available on request throughout
  the hiring process.
labels:
  ON-APPL-01: pass
  ON-APPL-02: pass
  ON-PAY-01: pass
  ON-PAY-02: pass
  ON-VAC-01: pass
  ON-AI-01: pass
  ON-CEX-01: pass
labelled_by: [claude]
notes: >-
  "AI-assisted" names AI and ties it to screening, so it reads as a disclosure. Lawyer (law review Q7c): is a
  four-word statement that doesn't say AI is used on applicants, only on "screening", enough under s. 8.4 (1)?
