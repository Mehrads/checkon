notes: >-
  The automated screen is an AI ranking tool (context), and "automated system" doesn't disclose AI (law review Q7a).
  The trade certificates and Underground Common Core are licensing and training. Northern Ontario experience is an
  Ontario-tied asset (warning). The production bonus is wages without a figure; the hourly range keeps ON-PAY-01
  clean (Q4b). Lawyer: Q7a, Q8b.
