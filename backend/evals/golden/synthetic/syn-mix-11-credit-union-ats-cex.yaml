id: syn-mix-11-credit-union-ats-cex
slice: synthetic
purpose: >-
  An ATS sentence without AI wording while AI is used (ON-AI-01 fails) and "understanding of Canadian workplace
  norms" (ON-CEX-01 fails), in a credit union contact-centre posting.
context:
  uses_ai_in_hiring: true
text: |
  Customer Service Representative, Contact Centre
  Lakeport Credit Union - North York, Toronto | Full-time

  Job description
  Lakeport Credit Union's contact centre helps members by phone and secure chat. As a Customer Service
  Representative, you'll answer questions about accounts, cards and online banking, solve problems on the first
  contact, and spot chances to connect clients with the right products and advisors.

  Key accountabilities
  - Handle 50 to 70 client interactions a day while meeting quality and service targets
  - Verify client identity and follow privacy and anti-fraud procedures
  - Explain fees, transactions and statements clearly
  - Refer members to specialists for mortgages, investments and lending
  - Document every interaction accurately

  Qualifications
  - 1+ year of customer service experience in a high-volume environment
  - Understanding of Canadian workplace norms and customer expectations
  - Strong listening skills and a calm manner on difficult calls
  - Comfortable working across several systems at once
  - Available for shifts between 7:00 am and 11:00 pm, including weekends

  Compensation and benefits
  Annual salary of $45,000 to $52,000, plus a quarterly incentive of up to 5% of salary, banking perks and a full benefits package.
  Six weeks of paid training.

  About our process
  Applications are reviewed by our applicant tracking system, and qualified applicants will be invited to complete
  an online assessment.

  This posting is for an existing vacancy.
labels:
  ON-APPL-01: pass
  ON-APPL-02: pass
  ON-PAY-01: pass
  ON-PAY-02: pass
  ON-VAC-01: pass
  ON-AI-01: fail
  ON-CEX-01: fail
labelled_by: [claude]
notes: >-
  Lakeport's ATS ranks applicants with an AI model and the online assessment is AI-scored; the posting names only the
  ATS. "Canadian workplace norms" is the rule pack's "Familiarity with the Canadian workplace" violation; "customer
  expectations" alone would be fine. An Ontario credit union is provincially regulated, so the ESA applies (a
  chartered bank would fall under the Canada Labour Code instead). Lawyer: Q7a on the ATS sentence; should CheckON ask
  whether an employer is federally regulated, since Part III.1 doesn't reach banks, airlines or interprovincial
  carriers?
