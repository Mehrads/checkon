notes: >-
  Machine learning is a machine-based system that infers from input to generate recommendations, so it falls in
  the Reg. s. 2 (1) definition and the sentence discloses AI used to select. Lawyer: is naming "machine learning"
  without the words "artificial intelligence" a statement "disclosing the use of the artificial intelligence"?
