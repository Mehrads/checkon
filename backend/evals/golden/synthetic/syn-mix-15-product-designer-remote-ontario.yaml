id: syn-mix-15-product-designer-remote-ontario
slice: synthetic
purpose: >-
  A remote-in-Ontario tech posting with a $60,000-wide range (ON-PAY-02 fails) and AI mentioned only as product work
  while AI screens applicants (ON-AI-01 fails).
context:
  uses_ai_in_hiring: true
text: |
  Senior Product Designer
  Fernhill Health (Remote - Ontario)

  Fernhill Health builds the software that 300 family health teams use to book appointments, message patients and
  manage referrals. We're a team of 160, fully remote across Ontario, and we meet in person in Toronto once a
  quarter.

  The role
  You'll lead design for our patient messaging product, which we're rebuilding around AI-drafted replies that
  clinicians review before sending. You'll work with a product manager, a tech lead and six engineers, and you'll
  talk to clinicians and patients every week.

  What you'll do
  - Own the end-to-end experience for patient messaging, from research to shipped product
  - Design and test AI-assisted features that clinicians can trust, check and correct
  - Run usability sessions with clinicians, front-desk staff and patients
  - Raise the bar for accessibility (WCAG 2.2 AA) across the product
  - Contribute to our design system in Figma

  What you bring
  - 6+ years of product design experience, with shipped work in complex B2B or healthcare products
  - Experience designing AI-powered features and the trust and safety questions they raise
  - Strong interaction design and prototyping skills, and a portfolio that shows your process
  - Clear writing, and comfort presenting to clinicians and executives

  Location: remote; you must live and work in Ontario.

  Salary: $110,000 - $170,000, plus stock options and a $2,000 home-office budget.

  This posting is for an existing vacancy.
