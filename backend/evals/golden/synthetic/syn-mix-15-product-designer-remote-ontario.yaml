notes: >-
  $60,000 wide, top below $200,000. A remote role that must be performed in Ontario is work in Ontario, so the rules
  apply. Every AI sentence is about the product or a skill; the employer's ATS AI-ranks applicants, so a disclosure
  is missing. Lawyer: none beyond Q1-type width questions; confirm a remote role restricted to Ontario residents is
  not excluded by Reg. s. 2 (1) (d).
