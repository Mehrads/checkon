  Customer Service Representative
  Oshawa, ON

  Durham Home Energy installs and services furnaces, air conditioners and water heaters for 90,000 customers, with 350 employees.

  What you'll do:
  - Answer customer calls and book service appointments
  - Explain rental agreements and protection plans
