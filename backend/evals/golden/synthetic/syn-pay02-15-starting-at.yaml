  - 1+ year of customer service experience; call centre experience preferred
  - A clear, friendly phone manner
  - Comfort with a CRM and several screens at once

  Pay: starting at $22.00 per hour, with increases at 6 and 12 months.

  This posting is for an existing vacancy.
