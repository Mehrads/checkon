labelled_by: [claude]
notes: >-
  The rule pack labels "Familiarity with the Canadian workplace" a violation; it is the classic euphemism the OHRC
  policy names. Lawyer: is "familiarity" (not "experience") still a requirement "related to Canadian experience"
  under s. 8.3 (1)? We say yes, since the only way to be familiar with a Canadian workplace is to have worked in one.
