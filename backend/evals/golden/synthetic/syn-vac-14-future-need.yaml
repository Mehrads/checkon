text: |
  Claims Service Representative
  Collingwood, ON

  Nottawasaga Mutual Insurance has 220 employees and is opening a second service office in Collingwood in 2027.

  We are posting this role early to plan for that office. This posting is to fill a future need; no position is open at this time.

  What you'll do
  - Take first notice of loss calls from policyholders
  - Set up claim files and assign them to adjusters
  - Keep customers updated as claims move forward

  What you need
  - 1+ year of customer service experience, ideally in insurance or banking
  - Clear phone and writing skills
  - Comfort with several systems at once

  Salary: $48,000 - $54,000 per year
