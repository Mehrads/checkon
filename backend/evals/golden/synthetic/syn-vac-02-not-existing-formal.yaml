id: syn-vac-02-not-existing-formal
slice: synthetic
purpose: >-
  The formal "not existing" statement, for a store that opens next year.
context:
  uses_ai_in_hiring: false
text: |
  Pharmacy Assistant
  Sault Ste. Marie, ON

  Lockview Pharmacy Group runs nine community pharmacies in Sault Ste. Marie and Elliot Lake with 125 staff. We are opening a tenth location in spring 2027 and are accepting applications now.

  What you'll do
  - Enter prescriptions and prepare them for pharmacist review
  - Manage inventory and returns
  - Serve customers at the dispensary counter

  What you need
  - Pharmacy assistant certificate or 1+ year of pharmacy experience
  - Accuracy and attention to detail
  - Availability for evenings and weekends

  Pay: $19.50 - $22.00 per hour

  This posting is not for an existing vacancy.
labels:
