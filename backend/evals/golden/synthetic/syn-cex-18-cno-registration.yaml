notes: >-
  The rule pack's own "ok" example: a registration requirement, which the guide excludes. Part-time at about 22.5
  hours a week; the hourly range is $5.30 wide, so the width is far under the limit at any hours. Lawyer: none on the
  CEX label. Is a long-term care home run by a not-for-profit ever within the Crown exemption? We assume not.
