text: |
  Registered Practical Nurse - Long-Term Care (Permanent Part-Time)
  Otonabee Gardens Long-Term Care Home, Peterborough

  Otonabee Gardens is a 160-bed long-term care home and part of a not-for-profit group of seven homes in eastern
  Ontario. We're looking for an RPN to join our team on the second floor, a 32-resident home area for people living
  with dementia.

  As an RPN with us, you'll give medications and treatments, assess and monitor residents, update care plans with
  the interdisciplinary team, and lead and support our personal support workers on your shift. You'll get to know
  residents and their families well, and you'll be part of a team that takes the time to do things right.

  You hold a current Certificate of Registration with the College of Nurses of Ontario as a Registered Practical
  Nurse, and you have current CPR. Experience in long-term care, geriatrics or dementia care is an asset, and new
  graduates are welcome to apply. You'll work 8-hour shifts, about 0.6 FTE, with every second weekend.

  Wage: $31.50 to $36.80 per hour, based on years of nursing experience. Percentage in lieu of benefits for
  part-time staff, and a pension plan.

  This posting is for an existing vacancy.
