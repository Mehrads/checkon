id: syn-pay01-11-commission-percent-no-figure
slice: synthetic
purpose: >-
  Commission only, stated as a percentage of each sale with no dollar figure.
context:
  uses_ai_in_hiring: false
text: |
  New Home Sales Associate
  Aurora, ON

  Castlegate Homes builds townhome and detached communities north of Toronto, with 140 employees and four active sales centres.

  What you'll do:
  - Staff our Aurora sales centre and walk buyers through models and site plans
  - Prepare agreements of purchase and sale and track deposits
  - Work with the construction team to keep buyers updated

  What you need:
  - Registration as a real estate salesperson, in good standing
  - Strong presentation and follow-up skills
  - Weekend availability

  Compensation: commission only, 1.5% of the purchase price on every home you sell, paid on closing.

  This posting is for an existing vacancy.
