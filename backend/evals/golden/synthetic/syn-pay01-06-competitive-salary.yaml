text: |
  Marketing Coordinator
  Oakville, ON

  Brightwater Home Products designs and sells kitchenware through 1,200 retail partners. Our marketing team is growing and we need a coordinator to keep campaigns on schedule.

  In this role you will:
  - Coordinate product launches across email, social and retail channels
  - Brief designers and copywriters and track deliverables
  - Report on campaign results every month

  You bring:
  - A diploma or degree in marketing, communications or a related field
  - 2 years of marketing experience, ideally in consumer products
  - Strong organization and writing skills

  We offer a competitive salary, a comprehensive benefits package and a hybrid schedule (three days in the office).

  This posting is for an existing vacancy.
