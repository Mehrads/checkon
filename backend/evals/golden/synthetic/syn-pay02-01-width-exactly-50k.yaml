id: syn-pay02-01-width-exactly-50k
slice: synthetic
purpose: >-
  An annual range exactly $50,000 wide ($85,000 to $135,000, the guide's own permitted example): the limit is
  inclusive.
context:
  uses_ai_in_hiring: false
text: |
  Senior Business Analyst
  Ottawa, ON

  Rideau Health Software builds scheduling and records systems used by 120 clinics. We have 340 employees and are hiring a Senior Business Analyst for our hospital products team.

  What you'll do
  - Run requirements workshops with clinical and IT staff
  - Write user stories and acceptance criteria and keep the backlog clean
  - Test releases with users before they ship

  What you bring
  - 5+ years as a business analyst on software projects
  - Experience with healthcare workflows is an asset
  - Clear writing and facilitation skills

  Salary range: $85,000 to $135,000 per year, based on experience.

  This posting is for an existing vacancy.
