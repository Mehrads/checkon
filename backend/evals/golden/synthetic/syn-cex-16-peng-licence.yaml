labelled_by: [claude]
notes: >-
  The guide says s. 8.3 doesn't apply to professional licensing or registration requirements. Experience is asked
  for with no place condition. Lawyer (law review Q8f): if a licence requirement were written with an Ontario
  practice condition ("P.Eng. with two years of Ontario practice"), would the licensing exclusion still cover it? We
  would label that a fail.
