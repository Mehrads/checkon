notes: >-
  The README's own borderline example, in a different trade. Ontario is in Canada, so an Ontario-only asset ranks
  applicants by Canadian experience, but it is an asset tied to a market rather than "Canadian experience" in words.
  Lawyer (law review Q8a, Q8b): if "Canadian experience is an asset" is a violation (syn-cex-07), is an Ontario
  asset also a violation rather than a warning?
