labelled_by: [claude]
notes: >-
  The posting never says "Canadian experience", but references from Canadian employers presuppose it. Lawyer: is a
  reference requirement a requirement related to Canadian experience under s. 8.3 (1)? We say yes. Would asking
  for references "from employers we can contact" (no place) be fine?
