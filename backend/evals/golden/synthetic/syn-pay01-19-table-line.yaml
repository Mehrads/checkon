text: |
  Delivery Driver - DZ Licence
  Pickering, ON

  Eastway Building Supply delivers lumber, drywall and roofing to job sites across Durham Region. We have 210 employees at five yards.

  Position | Location | Schedule | Pay
  Delivery Driver (DZ) | Pickering yard | Monday-Friday, 6:00 a.m. start | $27.50-$30.00/hr

  Duties
  - Load and deliver building materials using a boom truck or truck-mounted forklift
  - Inspect your truck daily and complete logbooks
  - Treat customers and job site crews with respect

  Requirements
  - Valid DZ licence with a clean abstract
  - 2+ years of commercial driving experience
  - Able to work outdoors in all weather

  This posting is for an existing vacancy.
