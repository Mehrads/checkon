labelled_by: [claude]
notes: >-
  The guide counts an established professional network as Canadian experience; a donor network in the GTA can only
  be built by working here. "Salary commensurate with experience" gives no figure. The CFRE is a certification.
  Lawyer: is a network requirement framed around a city (not Canada) still a requirement related to Canadian
  experience? We say yes, as with "local experience".
