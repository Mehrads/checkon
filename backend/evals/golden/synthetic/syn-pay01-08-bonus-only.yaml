id: syn-pay01-08-bonus-only
slice: synthetic
purpose: >-
  Only a discretionary bonus and benefits are given, no wage: a discretionary bonus isn't wages, so pay fails.
context:
  uses_ai_in_hiring: false
text: |
  Store Manager
  Barrie, ON

  Northern Trail Outfitters is a 40-store outdoor retailer. Our Barrie store needs a Store Manager to lead a team of 18.

  Responsibilities
  - Hit sales and margin targets and manage the store budget
  - Hire, schedule, coach and develop the team
  - Keep the store merchandised to company standards

  Requirements
  - 3+ years managing a retail store or department
  - Experience with scheduling and inventory systems
  - Weekend and holiday availability

  What we offer
  - Annual bonus of up to $8,000, at management's discretion
  - 30% employee discount
  - Health, dental and vision benefits

  This posting is for an existing vacancy.
labels:
  ON-APPL-01: pass
  ON-APPL-02: pass
  ON-PAY-01: fail
  ON-PAY-02: not_applicable
  ON-VAC-01: pass
  ON-AI-01: pass
  ON-CEX-01: pass
labelled_by: [claude]
notes: >-
  ESA s. 1 (1) (e) excludes bonuses that are at the employer's discretion and not tied to hours, production or
  efficiency. The bonus here is stated to be discretionary, so no wages are disclosed. ON-PAY-02 has no wage
  range to check.
