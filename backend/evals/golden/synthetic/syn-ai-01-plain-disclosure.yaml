text: |
  Warehouse Shift Supervisor (Afternoons)
  Northbridge Logistics, Brampton, ON

  About us
  Northbridge Logistics runs third-party fulfilment for retail and e-commerce brands from three distribution
  centres in Peel Region. Our Brampton site ships about 40,000 orders a day.

  The role
  You'll lead a team of 25 to 30 associates on the afternoon shift (3:00 pm to 11:30 pm, Monday to Friday),
  making sure orders leave on time, safely and accurately.

  What you'll do
  - Plan staffing and labour for the shift against the daily volume forecast
  - Coach associates on pick rates, accuracy and safe equipment use
  - Run the shift start-up meeting and hand over to the night supervisor
  - Investigate safety incidents and inventory discrepancies and close them out
  - Work with the transportation team when carriers are late or loads change

  What you bring
  - 3+ years in a warehouse or distribution centre, including at least 1 year leading a team
  - Comfort with a warehouse management system and Excel
  - Clear, calm communication on a busy floor
  - Forklift certification, or willingness to get certified in your first month

  Pay and benefits
  - Salary: $58,000 to $66,000 a year
  - Shift premium of $1.50 an hour for hours worked after 6:00 pm
  - Health and dental benefits from day one, RRSP matching after 3 months

  We use artificial intelligence to screen, assess or select applicants for this position.

  This posting is for an existing vacancy.
