labelled_by: [claude]
notes: >-
  "Local experience" in a posting for an Ottawa job means experience gained in Ottawa, which can only be Canadian
  experience; the rule pack's example labels it a violation. The safety training is certification, not experience.
  Lawyer: would "familiarity with local suppliers and trades" (knowledge, no experience condition) be different?
