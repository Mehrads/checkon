  ON-VAC-01: fail
  ON-AI-01: pass
  ON-CEX-01: pass
labelled_by: [claude]
notes: >-
  "Competitive wages" names wages but gives no amount or range, so s. 8.2 (1) is not met. The profit-sharing payment
  is tied to company results, not to the employee's hours, production or efficiency, so it isn't wages either. The
  apply-by date is not a vacancy statement (rule pack example). Lawyer: is profit-sharing a discretionary bonus
  (excluded from wages) or wages that also need a figure?
