labelled_by: [claude]
notes: >-
  Unsure, and we lean towards pass. Knowing the code that governs the buildings you draw is a core skill and can be
  learned from the code itself; "experience preparing permit drawings" has no place condition, and the BCIN is a
  registration. We label warning only to stay consistent with the README's "knowledge of Canadian tax rules".
  Lawyer: is knowledge of an Ontario statute or code a requirement related to Canadian experience? If not, this and
  syn-cex-12 should both be pass.
