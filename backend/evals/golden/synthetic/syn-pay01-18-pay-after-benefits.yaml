text: |
  Maintenance Technician
  Cambridge, ON

  Grand River Foods makes frozen baked goods for grocery chains, with 380 employees at our Cambridge plant.

  What you'll do
  - Troubleshoot and repair packaging and conveyor equipment
  - Carry out preventive maintenance on a planned schedule
  - Keep maintenance records up to date

  What you need
  - 309A or 433A certificate, or an apprentice close to completion
  - 3+ years of maintenance experience in food or packaging
  - Willingness to rotate onto night shifts

  What we offer
  - Health, dental and vision benefits from your first day
  - Matched retirement savings plan
  - Safety boots and uniforms provided
  - Wage of $36.00 - $42.00 per hour, depending on certification

  This posting is for an existing vacancy.
