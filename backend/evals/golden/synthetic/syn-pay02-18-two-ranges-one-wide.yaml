labelled_by: [claude]
notes: >-
  Level II is $54,000 wide. Read as one overall range for the position ($58,000 - $122,000) it is $64,000 wide,
  so it fails either way. Lawyer: when one posting covers one position at two levels, is each level's range
  checked separately, or the overall span?
