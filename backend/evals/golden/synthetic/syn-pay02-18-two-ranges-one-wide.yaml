id: syn-pay02-18-two-ranges-one-wide
slice: synthetic
purpose: >-
  One posting with two level-based ranges; the first is narrow and the second is $54,000 wide.
context:
  uses_ai_in_hiring: false
text: |
  Property Claims Adjuster (Level I or II)
  Richmond Hill, ON

  Yorkgate Insurance Company has 1,400 employees and serves 600,000 policyholders. We are hiring one property claims adjuster and will place the successful candidate at Level I or Level II based on experience.

  You will
  - Investigate home and small business property claims
  - Inspect losses, write estimates and set reserves
  - Negotiate settlements and keep customers updated

  You have
  - An insurance adjuster licence, or willingness to obtain one within 6 months
  - For Level II: 3+ years of property adjusting experience
  - Strong writing and negotiation skills

  Pay
  Level I: $58,000 - $70,000 per year
  Level II: $68,000 - $122,000 per year

  This posting is for an existing vacancy.
labels:
