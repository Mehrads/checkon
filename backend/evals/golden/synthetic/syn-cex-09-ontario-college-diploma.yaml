  ON-AI-01: pass
  ON-CEX-01: fail
labelled_by: [claude]
notes: >-
  The RECE line is a registration requirement, which the guide excludes. The diploma line requires an Ontario
  credential; the College registers applicants with credentials from elsewhere after an assessment, so the Ontario
  condition is the employer's, not the regulator's. Lawyer: is a provincial (Ontario) credential condition a
  "requirement related to Canadian experience"? We say yes, since an Ontario diploma is a Canadian credential.
