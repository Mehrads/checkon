text: |
  Diagnostic Medical Sonographer
  Brantford, ON

  Grand Valley Imaging operates 11 community ultrasound and X-ray clinics with 210 staff.

  The role
  - Perform general and vascular ultrasound exams
  - Prepare preliminary reports for radiologists
  - Keep equipment clean, calibrated and ready

  What you bring
  - Diploma in diagnostic medical sonography
  - Registration as a sonographer in good standing
  - Strong patient care skills

  Schedule: varies by clinic, including some evenings and Saturdays.
  Pay: $30.00 - $55.00 per hour

  This posting is for an existing vacancy.
