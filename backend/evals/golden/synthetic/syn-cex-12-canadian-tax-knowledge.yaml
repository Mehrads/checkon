notes: >-
  The rule pack labels "Knowledge of Canadian tax regulations" borderline. Knowing Canadian tax rules is the job
  itself and can be learned anywhere (the posting accepts a course), but in practice it is gained by working in
  Canada. Lawyer (law review Q8d): is knowledge of Canadian rules a requirement related to Canadian experience,
  or a job skill outside s. 8.3? Note syn-cex-17 labels experience with Canadian GAAP a pass; the two should
  probably get the same answer.
