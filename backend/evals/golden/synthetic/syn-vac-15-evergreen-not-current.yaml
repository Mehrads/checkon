text: |
  Licensed Optician
  Toronto, ON (Scarborough Town Centre)

  Eastlight Optical runs 38 optical stores with 300 staff.

  What you'll do
  - Fit and dispense eyeglasses and contact lenses
  - Take measurements and adjust frames
  - Help customers choose frames and lenses

  What you need
  - Registration as an optician in good standing
  - 1+ year of dispensing experience
  - Retail sales skills

  Pay: $26.00 - $31.00 per hour

  This is an evergreen requisition and does not represent a current vacancy.
