notes: >-
  The guide names "a requirement to have an established professional network or client base" as Canadian
  experience. The CFP and securities licence are licensing, which s. 8.3 doesn't cover. Lawyer: would "a book of
  clients you can transition", with no place named, still be a requirement related to Canadian experience in
  practice, since only Canadian clients can follow an advisor to a Toronto firm?
