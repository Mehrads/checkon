  ON-AI-01: pass
  ON-CEX-01: pass
labelled_by: [claude]
notes: >-
  Width $800 a month, $9,600 a year at 12 months. A reader that took "semi-monthly" as the unit would halve or
  double the figures; either way the range stays far inside the limit.
