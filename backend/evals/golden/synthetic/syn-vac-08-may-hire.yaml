text: |
  Registered Veterinary Technician
  North Bay, ON

  Trout Lake Veterinary Group runs six animal hospitals in northern communities with 95 staff.

  What you'll do
  - Assist with surgery, anaesthesia and dental procedures
  - Take radiographs and run in-house lab work
  - Teach clients about home care and follow-up

  What you need
  - Veterinary technician diploma and registration as an RVT
  - 1+ year of clinical experience in a small-animal practice
  - Calm, kind and organized under pressure

  Pay: $23.00 - $27.50 per hour

  We may hire for this role in the coming months, depending on caseload.
