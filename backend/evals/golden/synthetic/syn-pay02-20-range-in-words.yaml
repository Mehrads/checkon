text: |
  Construction Estimator
  Vaughan, ON

  Keele Street Mechanical installs plumbing, HVAC and fire protection systems in commercial buildings. We have 260 employees and a busy bid schedule.

  What you'll do
  - Prepare mechanical estimates from drawings and specifications
  - Get supplier and subcontractor quotes and compare them
  - Attend tender closings and hand awarded jobs to project managers

  What you bring
  - Diploma in mechanical engineering technology or a related field
  - Experience with estimating software is an asset
  - Strong math and organization skills

  Depending on experience, the salary for this role is between fifty-five thousand and one hundred and five thousand dollars a year.

  This posting is for an existing vacancy.
