text: |
  Grade 4 Homeroom Teacher
  Toronto, ON (Etobicoke)

  Humber Valley Academy is an independent JK-12 school with 680 students and 110 staff.

  What you'll do
  - Teach all core subjects to a class of 20 students
  - Plan units, assess learning and report to families three times a year
  - Lead one extracurricular club

  What you need
  - Bachelor of Education and teacher certification in good standing
  - Experience teaching the junior grades
  - Strong communication with families

  Salary: $62,000 - $88,000 per year, based on our teacher salary grid

  This posting is for an existing vacancy. We also keep strong applications on file for future openings.
