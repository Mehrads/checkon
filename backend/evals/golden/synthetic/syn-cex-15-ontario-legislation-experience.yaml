text: |
  HR Generalist
  Grand Valley Packaging Ltd., Kitchener, Ontario

  Grand Valley Packaging prints and converts folding cartons for food and pharmaceutical brands. We have 410
  employees on three shifts and a five-person HR team.

  Responsibilities
  - Advise supervisors on attendance, discipline and accommodation cases
  - Run full-cycle recruitment for hourly and salaried roles
  - Lead onboarding and the new-hire safety orientation
  - Manage WSIB claims and return-to-work plans
  - Support the joint health and safety committee and keep training records current
  - Help prepare for collective bargaining with our union

  Qualifications
  - Degree or diploma in human resources, or a related field
  - 3+ years as an HR generalist, ideally in a unionized manufacturing setting
  - Experience applying Ontario employment standards and OHSA requirements
  - CHRP or CHRL designation, or working towards it

  Salary: $68,000 - $78,000 per year, with benefits and a pension.

  We use artificial intelligence to screen, assess or select applicants for this position.

  This posting is for an existing vacancy.
