id: syn-pay02-12-monthly-under
slice: synthetic
purpose: >-
  A monthly range within the limit once annualised ($4,000 a month wide: $48,000 a year).
context:
  uses_ai_in_hiring: false
text: |
  Site Superintendent - Mid-Rise Residential
  Whitby, ON

  Lakeshore Ridge Construction builds mid-rise condominiums and rental buildings in Durham Region, with 160 employees.

  Responsibilities
  - Run day-to-day site operations on a 9-storey wood-frame building
  - Coordinate trades, deliveries and inspections
  - Keep the site safe and the schedule on track

  Requirements
  - 7+ years in residential construction, including 3 as a superintendent
  - Working at heights and first aid training
  - Able to read drawings and specifications

  Salary: $6,500 - $10,500 per month, plus a vehicle allowance.

  This posting is for an existing vacancy.
