text: |
  Senior Product Manager - Remote Canada
  Toronto, Ontario / Payer Solutions / Full Time

  Working for a company like Smile Digital Health means supporting our mandate for #BetterGlobalHealth. We strive towards this goal every day, and the results can be seen in the impact of our innovative health data platform and data management solutions, which are used in over 20 countries.  We were #19 on Deloitte's Technology Fast 50 Ranking for 2024!

  Smile Digital Health makes it easy for healthcare stakeholders to collect and exchange data with our leading FHIR-based data liberation platform.

  At its heart, the Smile platform enables people and organizations to better manage healthcare data.  We help generate and liberate structured healthcare data to ensure effective delivery across care teams and health systems bringing  #BetterGlobalHealth to patients everyday!

  Apply today and find plenty of reasons to SMILE!

  Responsibilities:
  • Act as an ambitious entrepreneur with a start-up mentality to proactively identify unmet market opportunities within the healthcare space and design strategic product capabilities to capitalize on them.
  • Collaborate with, and take direction from, the Director of Product Management to define and share ownership of the overarching product strategy and positioning for Smile’s platform components.
  • Collaborate extensively with all Smile stakeholders—including engineering, sales, marketing, and leadership—to design, develop, market, sell, and implement new products effectively.
  • Partner closely with Technical Product Managers to guide prioritization, provide market context, and translate business needs into actionable development backlogs.
  • Conduct deep competitive research and market analysis to benchmark and identify key differentiators for specific platform capabilities.
  • Support cross-functional teams and leaders in developing product communication materials (presentations, articles, white papers), product sales strategies, training, and internal/external demos.
  • Act as the chief cheerleader for your assigned products by conducting webinars and delivering compelling presentations at industry events to drive market awareness and adoption.
  • Evangelize product features and roadmaps to both internal cross-functional teams and external customers, hosting customer conversations to validate strategic direction and clarify how platform capabilities solve specific healthcare challenges.
  • Champion product capabilities related to healthcare data, ensuring platform features remain highly relevant to payer and provider workflows.

  Requirements:
  • 7+ years of experience in Product Management, Product Strategy, Health Informatics, or a related role driving software product development.
  • Deep Health Care industry knowledge, with proven experience identifying market gaps and delivering complex software products or platforms in healthcare environments.
  • Entrepreneurial mindset with a strong ability to work collaboratively across sales, marketing, design, and engineering teams to push a product from conception to market realization.
  • Demonstrated consultative experience, including facilitating meetings and communications with executive-level clients, prospects, and partners.
  • Critical thinking skills with a creative, solution-oriented mindset.
  • Self-driven, proactive, and results-oriented, with effective time management and written and verbal communication skills.
  • Strong Asset: Technical knowledge and familiarity with healthcare interoperability (FHIR, HL7 v2, CDA), terminology standards (LOINC, SNOMED, ICD-10), RESTful API standards, and modern stack architectures (Java, Kubernetes, Postgres, Kafka) is considered a big plus.
  • Strong Asset: Experience collaborating with engineering and architecture teams in cloud-native environments and familiarity with CI/CD or Software Release cycles.

  Additional Information:
  Smile discloses that artificial intelligence (AI) may be used in portions of the recruitment and selection process, such as resume screening or application assessment. All hiring decisions are ultimately made by qualified human decision-makers, and AI tools are used to support — not replace — fair and equitable hiring practices.
  This position is a new role, created to support Smile’s continued growth and commitment to operational excellence.

  Some of the benefits we offer:
  * Remote Work Environment
  * Flexible Time Away From Work Policy including PTO, Personal and Sick Days
  * Competitive Salary and Health/Medical Benefits
  * RRSP/TFSA/401K Employee Contribution
  * Life and Disability
  * Employee Assistance Program
  * FHIR Study Program and Skillsoft Learning
  * Super HAPI Fun Club

  Smile's core values include respect, inclusion, embracing our differences, and celebrating shared values because our people are the foundation of our success. We are big on creating a sense of belonging and empowering each other to bring our authentic selves to work.  We are dedicated to fostering a workplace that values diversity, equity, and inclusion.

  We welcome and encourage candidates of all backgrounds to apply. Candidates are encouraged to inform us if they wish to discuss or require accommodations during interviews or while working at Smile.

  $130,000 - $140,000 CAD per year
