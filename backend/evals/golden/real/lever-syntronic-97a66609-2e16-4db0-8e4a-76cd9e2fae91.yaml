text: |
  Cloud Native Developer - User Plane
  Kanata, ON / Software / Full-Time

  Join Syntronic: Where Your Innovation Shapes the Future
  At Syntronic, we don't just follow industry trends—we set them! Join us in partnering with visionary companies and the brightest minds to turn ground-breaking ideas into reality. Imagine working on cutting-edge telecom advancements, pioneering automotive tech, life-saving healthcare innovations, and next-gen industrial automation. Our projects are diverse, impactful, and at the forefront of technological innovation. Be a part of something extraordinary!

  Who are we?:
  Syntronic is a global leader in design and development, specializing in electronics, electro-mechanics, and software. We’re not just a company; we’re a community of innovators. Our teams work on projects that define the future—from creating state-of-the-art communication systems and autonomous vehicles to advancing IoT solutions that revolutionize everyday life. At Syntronic, your work will make a real difference.

  What we're looking for:
  We are seeking individuals who want to:
  ·        Collaborate with top-tier clients on transformative, cutting-edge projects.
  ·        Engage with and learn from industry leaders
  ·        Innovate from concept to completion, ensuring high standards.
  ·        Gain international experience on global projects.
  ·        Thrive in an entrepreneurial environment that supports new ideas.
  ·        Explore multiple sectors like telecommunications, automotive, healthcare, and industrial automation.


  As a Software Developer - Core User Plane as a Service, you will join a seasoned and highly collaborative User Plane development team responsible for delivering scalable, resilient, and high-performance user-plane functions on hyperscale cloud platforms.
  Working alongside experienced engineers and technical experts, you will help accelerate the delivery of new user-plane capabilities, improve system performance and reliability, and solve complex networking and scalability challenges. This is an exciting opportunity to work on cutting-edge Cloud Native 5G solutions, contribute to large-scale production systems, and grow your expertise.

  What you'll do
  • Design, develop, and maintain Cloud Native user-plane services for 5G Core networks.
  • Build and enhance high-performance networking software running on public cloud platforms such as AWS, Azure, or Google Cloud.
  • Develop and optimize packet processing functions using technologies such as DPDK.
  • Deliver scalable microservices using Docker and Kubernetes.
  • Own services end-to-end, including development, testing, deployment, monitoring, and operational support.
  • Collaborate with software architects, developers, and cross-functional teams to improve system performance, resiliency, and scalability.
  • Contribute to CI/CD pipelines and automation using modern DevOps practices and tools.
  • Troubleshoot complex networking and cloud infrastructure issues in production environments.
  • Drive continuous improvement in software quality, test coverage, and operational excellence.

  What you'll need to get the job done
  • Bachelor's degree in Computer Science, Software Engineering, Computer Engineering, or a related field.
  • Strong software development experience using C, C++, Go, or similar systems programming languages.
  • Solid Linux development and troubleshooting skills.
  • Good understanding of TCP/IP networking, routing, and network protocols.
  • Experience with high-performance packet processing technologies such as DPDK
  • Experience building Cloud Native applications and microservices.
  • Hands-on experience with Docker, Kubernetes, and containerized environments.
  • Experience working with public cloud platforms such as AWS, Azure, or Google Cloud.
  • Familiarity with CI/CD tools such as GitLab CI, Jenkins, Cloud Build, or similar.
  • Experience working with REST and/or gRPC APIs.
  • Strong analytical, problem-solving, and collaboration skills.

  What will make us REALLY love you
  • Experience with cloud-based databases and distributed systems.
  • Knowledge of observability and monitoring tools.
  • Experience in telecommunications, 5G Core, or cloud-native networking solutions.
  • Exposure to large-scale production environments and carrier-grade systems.

  This posting is for an active vacancy.


  What you’ll love about us:
  At Syntronic, our employees are our greatest asset. We foster innovation, collaboration, and excellence, offering opportunities for personal and professional growth. Join a global community that values creativity and diversity.

  Ready to Shape the Future with Us?
  If you’re ready to elevate your career and be part of a team that’s making a real impact, we want to hear from you. Apply today and embark on your journey with Syntronic, where your ideas and innovations can truly make a difference.

  We may use artificial intelligence (AI) tools to support parts of the hiring process, such as reviewing applications, analyzing resumes, or assessing responses. These tools assist our recruitment team but do not replace human judgment. Final hiring decisions are ultimately made by humans. If you would like more information about how your data is processed, please contact us.

  $105,000 - $125,000 CAD per year
