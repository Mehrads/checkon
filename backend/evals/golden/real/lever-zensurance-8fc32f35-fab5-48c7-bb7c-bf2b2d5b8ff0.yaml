  Commercial Insurance Broker (Remote First)
  Toronto, ON / Brokering / Full-time

  About Us:
  Zensurance is redefining commercial insurance for Canadian businesses.
  As a leading InsurTech, we make getting the right coverage simple, fast, and accessible through a digital-first experience. Our platform combines advanced technology with deep industry expertise to deliver tailored insurance solutions that help businesses thrive.
  Zensurance has been recognized for its rapid growth and industry impact:

  ✅ Deloitte’s Technology Fast 50 (2023, 2024, 2025)
  ✅ Deloitte’s Technology Fast 500 (2024, 2025)
  ✅ Top Insurance Employers (2022)

  At Zensurance, we value ownership, collaboration, and innovation. Our team thrives on solving complex challenges, challenging the status quo, and making a real impact in an industry ready for change.

  If you're looking to build something meaningful in a fast-growing, customer-focused company, we’d love to hear from you!


  About the Role & Team:
  We're looking for customer-focused Commercial Insurance Brokers. We operate with a shared interview process across our broker department, allowing you to select your preferred focus on your application.
  Reporting to a Team Lead, your day-to-day responsibilities will depend on your team alignment.
  Our Three Core Broker Teams:
  Accounts: Provide ongoing, consultative support for existing policyholders, handling mid-term policy changes and complex account inquiries.
  New Business: Consult with new prospects, recommend coverage, negotiate with underwriters, and close warm incoming opportunities.
  Renewals: Re-engage clients ahead of policy renewals to capture operational changes, optimize coverage, and actively upsell, cross-sell, or remarket policies.
  Because we hire continuously across all three groups, there is no right or wrong choice when sharing your preference. We use your input to match you with the opportunity that best aligns with your strengths and interests.

  Responsibilities:
  Accounts (Client Care & Policy Management):

  •

  Portfolio Stewardship: Onboard new clients and serve as the main point of contact for client requests.

  •

  Policy Servicing: Review submissions, process endorsements, issue certificates of insurance, and execute policy modifications.

  •

  Organic Revenue Growth: Conduct mid-term reviews to identify upselling and cross-selling opportunities. that close coverage gaps.

  •

  Remarketing: Analyze and execute remarkets with insurance partners to ensure clients maintain optimal coverage and pricing.

  New Business (Sales Focussed):

  •

  Drive Inbound Conversion: Engage inbound leads provided by Zensurance to advise and convert requests into clients. No cold calling required!

  •

  Consultative Selling: Evaluate prospective clients' risks to recommend and cross-sell coverage packages.

  •

  End-to-End Deal Execution: Guide clients through the pipeline from initial quote to closed sale, explaining coverage terms in plain language.

  •

  Pipeline Management: Share flow updates and insights to help optimize pricing models, conversion strategy, and program offerings.

  Renewals (Sales Focussed):

  •

  Maximize Retention: Lead outreach for the renewal lifecycle, leveraging client relationships to retain business.

  •

  Upsell & Coverage Growth: Perform gap analyses on renewing policies to identify exclusions and sell supplementary coverage lines.

  •

  Commercial Negotiation: Liaise with insurance partners to negotiate pricing structures and secure coverage packages for renewing accounts.

  •

  Account Auditing: Review policy data to ensure accuracy across all renewal documentation.

  Requirements:
  •

  Licensing & Experience: Valid broker license with 1+ years of insurance experience. Holding an active RIBO license is highly desirable.

  •

  Clear Communication: Skilled at translating complex insurance concepts into simple language.

  •

  Collaboration: Skilled at working with colleagues, underwriters, and partners to deliver service.

  •

  Detail & Solution-Oriented: Attention to detail in policy accuracy paired with a target-driven mindset.

  •

  Organization: Strong prioritization skills to manage a portfolio of clients and tasks simultaneously.

  •

  Technical & Workflow Efficiency: Proven ability to leverage digital tools and a BMS to manage client portfolios efficiently.

  Our Interview Process:
  •

  Application Review: We look for customer-centric brokers who thrive in high-volume environments.

  •

  Recruiter Screen: An introductory interview to discuss your experience, learn about Zensurance, and ask questions.

  •

  Team Lead Interview: A conversation with two Team Leads covering your experience, past accomplishments, and technical insurance skills.

  •

  Offer: Welcome to Zensurance!

  Benefits & Perks at Zensurance:
  At Zensurance, we know that when our people thrive, so does our business. That’s why we offer a flexible, people-first work environment designed to support your well-being, growth, and success.
  If you're looking for a team that values learning, collaboration, and impactful work, we’d love to meet you!
  💻 Work Your Way:
  • Remote-first setup for added flexibility
  • Home office allowance to create a comfortable workspace
  • Top-tier tech: "Office in a box" with all necessary tech equipment
  • Half days before public holidays: Enjoy half days before long weekends
  ❤️ Your Health, Your Way:
  • Flexible health and dental plans for families, including mental health support
  • Health & personal spending accounts to invest in wellness your way
  • Parental leave top-up, because family comes first
  🚀 Investing in Your Growth:
  • Education assistance reimbursement for courses, conferences, books, and memberships
  • Opportunities to learn from industry experts and grow your career
  🤝 Staying Connected:
  • Weekly Friday huddles to share updates and connect across teams
  • Virtual & in-person team-building events to strengthen our culture
  AI Tools and Your Interview:
  We know AI is a valuable tool, and you're welcome to use it to prepare for your interview. However, please don't use AI assistants during the live interview itself. We want to have an authentic conversation with you, and using AI during the interview could affect our evaluation of your suitability for the role.
  Just so you know, we use an AI scribe to help us take notes and review interviews, ensuring a fair and clear process.
  Diversity & Inclusion:
  Zensurance celebrates diversity and is committed to creating an inclusive environment. We welcome applications from all backgrounds and provide accommodations throughout the hiring process. If you need support, let us know, we’re here to help.

  $52,000 - $80,000 CAD per year

  At Zensurance, we hire for talent and potential. By opening this position across multiple seniority levels, we ensure the role, responsibilities, and compensation scale to match your experience.
  Our On-Target Earnings (OTE) Structure:
  Your total cash compensation consists of a guaranteed base salary and a performance-based bonus. Our bonus structure is paid out quarterly and includes multipliers for any performance over target. This means your actual take-home pay can significantly exceed the standard OTE.
  Earning Levels by Experience:
  Associate Level: $58,000 OTE (Up to $68,000+ for top performers)
  Intermediate Level: $68,000 OTE (Up to $92,000+ for top performers)
  Senior Level: $78,000 OTE (Up to $110,000+ for top performers)
  Determining Your Level:
  Your specific placement within these levels will depend on your unique blend of skills, licensing, commercial insurance experience, and your interview performance.
  Curious to learn more about our compensation structure? We’ll dive into the exact breakdown during your initial interview!
