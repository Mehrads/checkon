text: |
  Mechanical Intern (Winter 27)
  Ottawa, Canada

  At Spaceium, we are building spacecraft systems designed to push the boundaries of what's possible in orbit. As a Mechanical Intern, you will work alongside our mechanical engineering team on real spacecraft hardware. This is a hands-on role where you will contribute to the design, analysis, build, and testing of the mechanical structures, mechanisms, and assemblies critical to our missions.

  Responsibilities

  • Support mechanical design and CAD modeling for spacecraft components, structures, and assemblies
  • Assist with the design of mechanisms, brackets, fixtures, and structural elements
  • Help build and maintain test setups, fixtures, and ground support equipment
  • Support structural, thermal, and tolerance analysis tasks
  • Assist with machining, fabrication, and 3D printing of parts
  • Assist with assembly, integration, and testing of mechanical hardware
  • Contribute to documentation, test reports, and design reviews
  • Collaborate with electrical, software, fluids, and systems engineers

  Basic Qualifications

  • Currently pursuing a Bachelor's or Master's degree in Mechanical Engineering, Aerospace Engineering, or a related field
  • Familiarity with CAD tools (SolidWorks, NX, Fusion 360, or similar)
  • Basic understanding of statics, dynamics, materials, and manufacturing
  • Eagerness to learn and work in a fast-paced startup environment

  What We're Looking For

  We're building technology that hasn't been done before. Experience is helpful, but curiosity, drive, and the ability to learn quickly matter more. If you're excited about spacecraft, enjoy solving hard engineering problems, and want to help build something new, we encourage you to apply.

  Preferred Skills

  • Creative problem solver with strong first-principles thinking, capable of assessing risk and making decisions with limited data.
  • Experience in a nimble, technical engineering role, with a scrappy, entrepreneurial approach to meeting tight time or budget constraints.
  • Hands-on experience with personal or academic mechanical projects, especially student design teams (rocketry, FSAE, robotics)
  • Experience machining, 3D printing, or building and testing real hardware
  • Familiarity with GD&T and design for manufacturability
  • Exposure to structural or thermal analysis (FEA)
  • Strong written and verbal communication skills

  Additional Requirements

  • Extended hours and weekend work may be required to support critical project and mission milestones.
  • This role requires a physical presence at the Ottawa facility.

  Please submit any exciting project that you have worked on.
