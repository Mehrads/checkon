  Part-Time Key Lead (Masonville Place)
  London, ON / Retail Stores / Part Time Permanent - Team Member (Retail)

  Knix is an award-winning intimate apparel and activewear brand that is re-inventing intimates for real life. Through our innovative products and our engaged community, we are empowering people everywhere to be unapologetically free. Launched in 2013, we are one of the fastest-growing intimate apparel brands in North America and are globally recognized as an innovator within the apparel space. We reach over 3 million customers through our online stores, Knix retail locations across North America and channels such as wholesale and Amazon. We are revolutionizing the apparel industry with our best-in-class customer experience, innovative products and brands Knix and Kt by Knix.  Come join us if you are looking for a purpose-driven and authentic career!

  About You
  We are looking for a dynamic and results-driven Key Lead to join our team. In this role, you will be at the heart of our store operations—fostering an inclusive environment, coaching a high-performing team, and driving operational excellence. Acting as leader-on-duty, you will lead shift execution and master the Knix selling model to set the standard on the sales floor. With a strong sense of ownership and a passion for the brand, you will elevate the customer experience, build brand loyalty, and consistently maximize store performance.

  Why You’ll Love Working at Knix
  • Inclusive Culture: A welcoming, supportive environment where you can bring your authentic self to work every day.
  • Competitive Pay: Base Salary plus Monthly Bonus eligibility.
  • Generous Discounts on your favourite Knix products and Gratis Program.
  • Health benefits program that starts on your first day, and access to a mental health & wellness platform that offers therapy and coaching sessions.
  • Growth Opportunities: Real avenues for professional development and career progression within a rapidly growing brand.

  Key Responsibilities
  • Sales & Metric Targets: Consistently meet and exceed store sales goals by driving key metrics, specifically Conversion Rate and Average Order Value (AOV). Able to link behaviours to results and identify and communicate key controllables that impact the business.
  • Empower & Develop: Help team members understand their role in driving store KPIs through effective use of our selling techniques and product knowledge by providing real-time feedback and side-by-side coaching.
  • Master the Knix Selling Model: Demonstrate a deep understanding of our selling model, executing it flawlessly on the sales floor through active listening, fitting support, and genuine product recommendations to build basket size.
  • Leadership Excellence: Act as the leader on duty—opening and closing the store, leading team huddles, and communicating daily targets to maintain high energy.
  • Operational Excellence: Ensure compliance with all operational workflows, POS systems, loss prevention measures, and health and safety protocols.
  • Visual Merchandising: Maintain Knix’s high visual standards, keeping floors fully stocked, size runs organized, and displays clean and inviting. Partner with leadership to execute visual updates, seasonal launches, and promotional setups according to company directives.
  • Stock & Inventory: Oversee inventory management compliance, including shipment processing, restock routines, loss prevention, and accurate stock counts.
  • Culture & Values: Champion a welcoming, high-energy environment by modeling Knix core values—fostering inclusion, authenticity, respect, and mutual support so both customers and team members feel valued and seen.

  Qualifications
  • 1–2+ years of retail experience, with previous keyholder, supervisory, or leadership experience preferred.
  • Proven success in hitting sales targets and understanding core retail metrics (Conversion, AOV, UPT), with strong proficiency in structured retail selling models.
  • Strong interpersonal skills with a passion for mentoring, coaching, and building strong relationships.
  • Resourceful and proactive, with a proven ability to calmly resolve conflicts and de-escalate challenging situations with both team members and customers.

  Eligibility Requirements
  • Must have the necessary work authorization to be legally employed in Canada and be 18 years of age or older.
  • Ability to lift and handle packages weighing up to 25lbs.
  • Ability to move efficiently through the store for long periods of time and as needed for an entire shift.
  • Flexible to work 15 to 20 hours per week, up to 29 hours during peak, with availability to work evenings, weekends, and holidays.

  Hourly Salary
  • $20.90 CAD per hour

  AI Disclosure Statement

  We want to share that we may use artificial intelligence (AI) tools to help us screen and assess applications. While technology helps us stay organized, every hiring decision at Knix is made by real people who care about finding the best addition to our team. We use these tools to support our process, not to replace the human connection that makes our culture special.

  How we Hire

  Our people are what make Knix, Knix! Our people are passionate and have a strong belief in our mission. Our people are naturally curious and ambitious by nature. Employees feel respected and supported at Knix. We take an inclusive and equitable approach offering the same interview experience to every candidate we meet with. Knix is an equal opportunity employer, we celebrate everyone and their intersecting identities. We know and believe that diverse and inclusive teams empower us to make better decisions and inspire innovation so that we can better serve our customers and community. We are committed to providing reasonable accommodations and will work with you to meet your needs. If you are a person with a disability and require assistance during the application process, please don’t hesitate to reach out! We celebrate our inclusive work environment and welcome members of all backgrounds and perspectives to apply.
