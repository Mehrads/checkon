text: |
  Digital Project Manager
  Toronto, Ontario, Canada

  We were founded on the belief that the world needs more creativity. It’s what drives all our decision-making. There is just so much ineffective, badly crafted work in the world that never gets noticed, has zero impact and is a waste of client budgets. We are here to change all that. When you truly embrace creativity as a competitive advantage, you will see it transform your world and your business. We’ve witnessed this over and over with our own clients. And, as a purpose-driven company, we also use our creativity to do good in the world by supporting causes we truly believe in.
  With 200 staff in New York, Toronto, and Vancouver, Z.A.K. is a magnet for top global talent. Want to change your world as a marketer? Let’s fight sameness together.

  Who We’re Looking For:

  We’re in search of a Digital Project Manager/Product Owner, who will oversee digital projects from concept to delivery, ensuring work is resourced, scheduled, and executed at the highest level. You’ll be the go-to contact for both internal teams and clients, balancing creative vision with technical execution. More specifically, you will:

  • Own the process: Manage incoming digital projects, assess feasibility, create budgets and detailed workback schedules.
  • Resource smartly: Prioritize in-house talent, supplement with freelancers or vendors as needed.
  • Manage multiple projects: Manage digital projects, have daily check ins with them team to make sure all projects are on track
  • Lead production: Partner with agency producers, account managers, and creatives to deliver on time, on budget, and on brief.
  • Inspire innovation: Champion emerging tech opportunities and integrate new tools/processes into our workflow.
  • Grow the network: Maintain and expand a roster of top-tier digital innovation freelancers.

  Who You Are:

  • Leader on digital production for websites, AI/AR, and emerging tech projects
  • Entrepreneurial thinker who takes ownership from pitch through delivery
  • Champion of delivering design, development, 3D, and content creation projects for major brands
  • Strong client-facing communicator with the ability to translate complex digital concepts
  • Passionate for continuous learning and staying ahead of industry trends

  What You Bring:

  • 7+ years managing digital projects in an agency, brand, or platform environment.
  • Solid understanding of design, development, and digital content workflows.
  • Experience with platforms like WordPress, React, Next.js, AR/3D, and campaign websites.
  • Skilled in budgeting, scheduling, and resource management.
  • Experience working with large brands and navigating complex approval processes.
  • Nice to have: Scrum Master (CSM), Product Owner (CSPO), or similar Agile certification.

  Project Types include:

  • Websites (WordPress, React, Next.js)
  • AI-powered experiences
  • AR lenses and 3D content
  • Innovation/emerging technology focused campaigns
  • Interactive and experiential marketing projects

  Compensation for this role ranges from $95,000 to $115,000 CAD, depending on experience.

  Zulu Alpha Kilo is an equal opportunity employer. It prohibits discrimination based on age, colour, disability, national origin, race, religion, sex, sexual orientation, and any other legally protected class in accordance with applicable federal, provincial, and local laws. Zulu Alpha Kilo is committed to creating and maintaining an inclusive and accessible workplace. If you are contacted for an interview and require accommodation during the interviewing process, please let us know.

  This job posting relates to an existing vacancy. Zulu Alpha Kilo uses artificial intelligence systems in the recruitment process to screen, assess, or select applicants but all hiring decisions are made by humans.

  We appreciate your interest in joining Zulu Alpha Kilo. When applicable, please include a link to your portfolio with your application. Although all applications are reviewed, only those selected for interviews will be contacted.
