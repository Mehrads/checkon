text: |
  Talent Partner, GTM Sales
  Remote - Toronto

  About Owner

  Owner is the AI-native system local business owners use to succeed, starting with restaurants.

  We’re building the system that replaces the many tools owners use to run their business.

  It powers everything from the restaurant’s website, online ordering, CRM, POS, and more.



  Product philosophy

  Most small business software makes owners do the work to get what they want: sales growth and profit growth. Owner does the work for them agentically.

  Our system drives demand, converts it, and helps operators run their business day to day. As it improves, the business improves with it.

  Using Owner should feel like having a team of great operators, engineers, and marketers working for you.



  Our vision



  We’re starting by helping independent restaurants succeed online.



  But it’s not just restaurants that need our help. Most local businesses are struggling with these same problems. Huge technology corporations are taking their customers, bleeding their profits, and making it hard for them to survive.



  Once we nail the solution for restaurants – we’ll scale it into every other local business type.



  In the future we envision, tens of millions of local business owners will use our technology to succeed in the digital age.



  Our traction



  Since 2020, we've generated tens of millions in revenue and processed over a billion dollars of online orders. 1 in 5 Americans have used an Owner.com http://Owner.com website.



  More importantly, we’ve helped over 20,000 restaurant owners, and saved them nearly $200 million in fees.



  Our team



  Our team is now in the low hundreds. We’ve got top talent from the most successful companies in SMB software, including: Shopify, HubSpot, DoorDash, ServiceTitan, Rappi, Faire and Stripe.



  We’ll be scaling even faster in 2026 to keep pace with our customer growth.



  Where we work



  Owner is a remote-first, global company headquartered in San Francisco, with a sales hub in Toronto. For a few of our roles we prioritize in-person collaboration at one of our office locations. Most of our teammates are distributed throughout the globe. Please review the role description and discuss with your recruiter for more details on location!





  Why we're looking for you



  As a Talent Partner, GTM Sales at Owner, you'll own hiring for the front end of our go-to-market organization, including Business Development Representatives and Sales Development Representatives. These are the roles where most of our sales team starts, the people who make first contact with restaurant owners, and the bench our Account Executives get promoted from.

  This is high-volume, early-career recruiting. Most candidates you evaluate won't have a quota history to point at, so your judgment about who will ramp is the core of the job rather than a supporting skill. You'll partner with BDR and SDR managers to set the bar and build a screen that holds it.

  This role is 100% remote and can be based anywhere in the Greater Toronto Area. Must be willing to come into the office for large events.



  The impact you'll have

   - Own full-cycle entry-level sales hiring: Run BDR and SDR searches from kickoff through offer acceptance.

   - Drive outbound sourcing: Build top-of-funnel pipeline through LinkedIn Recruiter, referrals, direct outreach, and competitor mapping across the Toronto market.

   - Open early-career channels: Develop university programs, sales bootcamps, alumni networks, and referral loops so hiring isn't dependent on inbound applications.

   - Partner with sales leaders: Work with BDR and XDR managers to define profiles, calibrate the bar, and reset expectations when the market says a profile is unrealistic.

   - Own the candidate experience: Deliver a fast, clear, respectful process to every candidate, including the majority who won't receive an offer.

   - Track and report metrics: Monitor pipeline velocity, conversion, and time-to-fill. Identify which sources produce reps who actually ramp, and move effort toward them.

   - Keep the system honest: Maintain Ashby accurately enough that funnel reporting can be trusted by Sales and Finance.



  Who you'll work with

   - The Talent team at Owner, alongside recruiters covering GTM & G&A

   - Sales leadership, particularly the BDR and SDR managers you'll be hiring for.



  What we're looking for

   - 1–2 years of recruiting experience across full-cycle or sourcing. Agency and in-house experience a plus.

   - Comfort operating at volume, with evidence of a heavy screen load handled without pipelines or ATS data falling apart.

   - Sound judgment evaluating candidates who have no quantitative performance record, and the confidence to hold a recommendation with senior stakeholders.

   - Excellent written communication. Your outreach represents the sales organization you're hiring for.

   - High agency and adaptability, comfortable working autonomously where the process isn't fully written down yet.

   - Experience with Ashby, Greenhouse, Lever, or similar, and with LinkedIn Recruiter or comparable sourcing tools.

   - Based in the Greater Toronto Area.



  Pay and benefits

  The estimated base salary range for this role is $80,000-$90,000 CAD, plus a generous pre-IPO equity package. Other benefits include comprehensive health coverage, a remote-first workplace, unlimited PTO, and extra fun perks.





  Notice - Employment Scams

  Communication from our team regarding job opportunities will only be made by an Owner team member with an @owner.com email address.



  We do not conduct interviews over email or chat platforms, and we will never ask you to provide personal or financial information such as your mailing address, social security number, credit card numbers or banking information. If you believe you are being contacted by a scammer, please mark the communication as "phishing" or “spam” and do not respond.



