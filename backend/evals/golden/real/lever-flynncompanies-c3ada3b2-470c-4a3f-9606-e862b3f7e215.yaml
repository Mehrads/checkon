  Project Manager, Roofing/Waterproofing
  Ottawa, ON / Flynn Group of Companies / Office Full-time

  At Flynn, it's not just a job, it's a career


  Project Manager
  Waterproofing division
  Flynn Canada Ltd
  Ottawa, ON

  A day in the life
  ·        Forecasting, planning, analysis throughout the lifecycle of the project
  ·        Prepare a comprehensive material list for the project
  ·        Preparing takeoffs and estimates for change orders
  ·        Communicate with Site Supervisor / Foreman in issuing, coordinating and tracking deliveries / purchase orders, etc.

  What we are seeking
  ·       3-5 years with General Project Management/Construction knowledge
  ·        Excellent communication skills
  ·        Understand direction and be dependable to follow through
  ·        Microsoft Office
  ·        Ability to read drawings
  ·        Organizational skills
  ·        Attention to detail
  ·        Ability to work in a team environment
  ·        Added benefit to being bilingual (English/French) as we do work on either side of the Ontario / Quebec border.
  ·        Added benefit to having experience in below grade waterproofing, traffic coating, spray products (insulation, etc.)

  What we offer
  ·        Free parking
  ·        Competitive wages and benefits
  ·        RRSP matching
  ·        Great environment where our motto is “Flynn Family Winning Together”!
  ·        On-going career development programs through our in-house Flynn University and eLearning courses


  #LI-NT1

  Flynn Group of Companies is the leading trade contractor in North America that works on virtually every aspect of a building’s outer layer, including Roofing, Glazing, Waterproofing, and Architectural Metals. The foundation of our award winning success is having the right people on our team.
  Disclosure: We use an AI-powered system to initially screen resumes.  However,  all applications/resumes are also reviewed by our team of Human Resources and Talent Acquisition Professionals to ensure a fair and thorough evaluation in determining a candidate’s potential fit for a role they applied to.
  This posting is for an existing vacancy within the organization.

  $80,000 - $90,000 CAD per year
