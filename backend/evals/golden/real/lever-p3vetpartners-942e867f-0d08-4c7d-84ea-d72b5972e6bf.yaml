  Board Certified Veterinary Dentist
  Guelph, Ontario / Hale Veterinary Clinic / Full-time or Part-time

  Hale Veterinary Clinic in Guelph, Ontario (Canada) has an amazing opportunity for a Board Certified Veterinary Dentist or a Veterinarian that has completed residency training to join our experienced and dedicated team. We are a well respected single-disciplinary dental practice driven by service excellence. We take pride in our longstanding tradition of providing personalized service and undivided attention to each patient. In fact, when the clinic opened in 2003 we were the only facility in Canada to exclusively offer veterinary dental care to dogs and cats. Hale Veterinary Clinic is truly a neighbourhood specialty pet hospital, but our unparalleled reputation for quality patient care draws referrals from all across Ontario. Unlike the big referral centres, each doctor focuses on one client & patient at a time from admission through to discharge (on a strictly outpatient basis). The operational efficiency derived from our singular focus on dentistry empowers the clinic to deliver advanced dental care to a larger segment of the population.

  We are searching for an ambitious and compassionate professional who wants to advance their career and simultaneously secure a beautiful balance of work, play, and time for family & friends. The clinic is open Monday - Friday from 8:00 A.M. - 5:00 P.M. There are no weekend hours, overnights, or emergency work. Hale Veterinary Clinic boasts 5 experienced RVTs, 2 of which have been with the clinic since it opened in 2003! The quality of our team allows us to keep the promises we make to our clients and their pets. Attracting the best veterinary talent demands a level of respect and a commitment to supporting, motivating, empowering, and educating our team members. An established client base that is eager to meet their new neighborhood Dental Specialist awaits.

  About Guelph: Guelph is a progressive city of 135,000 people that is located 1-hour west of Toronto, and approximately 100 minutes from the state of New York. Guelph, the Royal City, is well established as a leader in environmentalism, academics, equality, employment opportunities, and altruism. Its sparkling rivers, natural parks, and labyrinth of hiking and biking trails are rivalled in reputation only by its robust arts and cultural scene. Fantastic restaurants and farmers markets, an impressive art gallery, three museums, a Jazz Festival, and multiple performing arts centres are a few attractions celebrated by residents. The region of Guelph boasts a diverse economy, highlighted by a thriving high-tech sector in Kitchener and Waterloo, and one of the lowest unemployment rates across Canada. MoneySense magazine recently rated Guelph as the best place to buy real estate in Canada. It is the type of place where you can enjoy all the amenities you'll ever need, escape the commute and traffic challenges faced by bigger cities, and simultaneously retain quick access to the countryside.

  Ontario Veterinary College (OVC), the 5th ranked veterinary program worldwide and top program in Canada rests on the University of Guelph campus. Collaborate with the OVC! Cheer on the U of Guelph Gryphons Hockey team at ice-level! Enjoy varsity Football, Basketball, Baseball! It's all possible in Guelph. The city has something for everyone, and is consistently rated as one of safest and best locations in Canada to raise a family.

  Total Compensation - Our clinic values our Veterinarians, and we prove it by supporting your personal, financial, and professional growth through:
  • Competitive Salary
  • A Comprehensive Health Benefits Package (Medical, Dental, & Vision premiums paid by clinic)
  • Professional Services coverage (chiropractor, massage therapist, physiotherapist, and more)
  • Enhanced Mental Health Practitioner Coverage
  • P3 Pawsitive Health & Lifestyle Spending Account
  • Unlimited Continuing Education (CE) funds for advanced professional development plus one week of paid leave to attend CE
  • RRSP Matching
  • Employee Assistance Program
  • Paid Licensing & Membership Dues
  • Professional Liability Insurance coverage
  • Paid Vacation Time
  • Paid Sick & Personal Emergency Days
  • Generous Veterinary Discounts (75% off services for your own pets, and an extended family and friends discount)
  • Clothing Allowance
  • Eligibility for a Performance Bonus
  • Relocation Allowance to assist with moving expenses can be arranged for out-of-town candidates
  • Comprehensive Immigration Assistance provided by experienced immigration lawyer on retainer for out-of-country applicants.

  Education
  • Doctorate of Veterinary Medicine

