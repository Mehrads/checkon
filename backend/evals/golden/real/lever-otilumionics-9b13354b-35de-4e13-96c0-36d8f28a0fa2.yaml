text: |
  Junior Mechatronics Engineer
  Mississauga, ON / Full time (On Site)

  about us
  OTI Lumionics is developing advanced materials—by design—using quantum simulations, machine learning and real-world testing in pilot production. We are currently focused on key enabling materials for OLED displays that will be used in next-generation consumer electronics and automotive. Our advanced electrode materials, and associated manufacturing technology, are being used to build transparent displays and lighting. We work closely with our partners and customers to design new materials that are mass-production ready. Using our computational Materials Discovery Platform, we are able to rapidly iterate new materials, allowing fast turn around time to meet our customers’ needs.
  Workplace type
  On-Site
  primary responsibilities
  Assist the team in generating new mechanical concepts and electrical designs for process automation
  Design and build software structure for automated manufacturing and testing systems
  Design and build software, including, but not limited to embedded microcontroller systems, PLC, user-friendly UI
  Design electrical circuits, electrical panel layouts and PCBs based on system requirements
  Design and validate automated system prototypes in collaboration with other automation team members
  Contribute to test plans for final designs and perform the test plan
  Contribute to analyzing test results, mitigate risks and resolve the unknowns
  Integrate Mechanical/Electrical components of automated systems and assist with finalizing product designs
  Maintain and ensure the work complies with health and safety standards
  Troubleshoot, maintain, and upgrade manufacturing and testing equipment
  Ensure compliance with environmental policies, procedures, and objectives, and actively participate in the identification and reduction of environmental impacts related to the role
  Adhere to health and safety protocols, report hazards, and contribute to maintaining a safe and healthy work environment for all employees
  profile
  Bachelor’s Degree in Electrical/Software Engineering and minimum 2-year working experience in a team environment
  required skills
  Critical thinking skills
  Solidworks, E3, or similar 2D/3D mechanical and electrical design software
  Familiar with electrical, motion and pneumatic control systems
  Ability to design and assemble electrical panels for internal electrical equipment
  Ability to create prototypes based on problem definition and visual design
  Ability to create user-friendly UI using C#
  Embedded programming using C++, Arduino, Raspberry Pi, and PLC structured text
  Capability of integrating electronic components and software into product design
  Capability of connecting suppliers, production team, QA/QC and shipping products
  Capability of analyzing test results and mitigating risks
  Capability of working under pressure and tight deadlines
  Willing to accept challenges
  Excellent communication skills
  Excellent problem-solving skills
  Excellent organizational, time management, analytical and follow-up skills.
  The following will be considered as an asset
  Experience with thin film fabrication tools
  Experience with thin film testing tools
  Fast learner, flexible, have a strong initiative and can-do spirit
  Extended hours and shift work may be required from time to time

  $65,000 - $90,000 CAD per year
