  Design Engineer (Co-op)
  Toronto

  WHO WE ARE

  For decades, insurance software has been built around rigid forms, portals and call centers that create friction for customers and drag for teams. Even as AI has advanced, most insurance work is still manual, slow and spread across disconnected systems.

  General Magic builds AI agents that handle quoting, follow-ups, document collection, verification, claims intake and broker communication, connected directly to carrier, MGA and broker systems. We've raised $7.2M USD from Radical Ventures, a16z and several AI luminaries. We work onsite in Toronto five days a week.


  THE ROLE

  This is a co-op role at the intersection of design and engineering. You'll design and build the interfaces brokers, carriers and our own team use to work with our agents, and ship them to production.


  IN THIS ROLE, YOU WILL

   - Design and build product UI, from rough sketch to shipped code

   - Prototype new workflows quickly and refine them with real user feedback

   - Turn complex insurance processes into simple, clear interfaces

   - Help shape our design system and front-end components


  FOR THIS ROLE, YOU SHOULD HAVE

   - Enrolment in a co-op program, ideally in design, computer science, engineering or a related field

   - A portfolio showing interfaces you've designed and built

   - Comfort with Figma and modern front-end tools like React and TypeScript

   - Strong taste and attention to detail

   - A bias toward shipping and learning fast
