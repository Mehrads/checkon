  Roofer Service Foreman - Ottawa
  Ottawa, ON / Flynn Group of Companies / Field Full-time

  Role: Roofer Service Foreman

  Summary:  Supervise crew and ensure productivity on inspecting, repairing, and maintaining roofs on industrial, institutional and commercial buildings.

  Benefits:
  •Dental insurance
  •Health insurance
  •Vision insurance
  •Prescription insurance
  •Free uniforms that are laundered for you
  •Winter and wet weather gear provided
  •Referral bonus program
  •Overtime pay
  •Vacation pay
  •On-site parking
  •Paid apprenticeship training
  •Sponsored Retirement Savings Plan
  •PPE provided
  •Tools provided
  •Flynn University (Coach training)

  Daily responsibilities:
  •Drive company vehicle to the job site that requires the team to perform emergency roof repairs
  •Completing repairs, inspections, and leak detection on industrial, institutional and commercial buildings
  •Manage administration activities, including timekeeping, material and equipment use and safety reporting

  Flynn is North America’s leading trade contractor, working on virtually every aspect of a Building’s outer layer, including Roofing, Glazing, Waterproofing and Architectural Metals.  Flynn’s strong culture focuses the energies of employees on doing the right thing, for the benefit of the company, its customers, and themselves. The result has been 40 years of success, and the next 40 looking even brighter.

  This posting is for an existing vacancy within the organization. Disclosure: We use an AI-powered system to initially screen resumes.  However, all applications/resumes are also reviewed by our team of Human Resources and Talent Acquisition Professionals to ensure a fair and thorough evaluation in determining a candidate’s potential fit for a role they applied to.

