  LTC Pharmacist - Simcoe, Ontario
  Simcoe, ON / Pharmacy / Full-time

  Roulston’s Pharmacy has delivered trusted retail services since 1933, with over 30 years of specialized expertise in long-term care and retirement home pharmacy. Our interdisciplinary team provides tailored, patient-focused care that consistently exceeds industry standards.
  We’re hiring a pharmacist to join our dynamic team. This role is ideal for a detail-oriented and collaborative pharmacist who thrives in a fast-paced environment and is passionate about delivering high-quality, patient-centered care to LTC and retirement home residents.
  We’re looking for someone who:
  - Has strong clinical and technical skills in medication verification, compliance packaging, and eMAR systems
  - Communicates effectively with care teams, patients, and families
  - Demonstrates sound clinical judgment and attention to detail
  - Can manage competing priorities while ensuring timely and accurate medication delivery
  As a key member of our team, you will oversee complex medication regimens, ensure eMAR accuracy, supervise pharmacy staff, and collaborate closely with care providers, POAs, and interdisciplinary teams. You’ll also support clinical services, participate in safety and adherence initiatives, and practice to your full regulatory scope, including minor ailments prescribing and involvement in specialty clinics.

  Duties and Responsibilities
  • - Provide patient-focused care to assisted living and community-based patients with complex medication needs.
  • - Manage and review multi-drug regimens to ensure safety and therapeutic effectiveness.
  • - Dispense medications using compliance aids (blister packs, PacMed strips) to support adherence.
  • - Supervision of pharmacy assistants and RPT to ensure efficient workflow, accurate dispensing and completion of required daily tasks.
  • - Collaborate with caregivers, facility staff, and providers to coordinate care.
  • - Maintain and update electronic MARs (PointClickCare, MED e-care) accurately for partnered facilities.
  • - Conduct three-month medication reviews and patient consultations to support adherence and outcomes.
  • - Assist with onboarding new patients, including med history reviews and packaging setup.
  • - Help deliver Respiratory Clinic services including therapy assessments, inhaler education, and spirometry testing.
  • - Assist in a hypertension clinic as part of a clinical trial, including patient monitoring and documentation
  • - Conduct minor ailment assessments and prescribe when appropriate under regulatory authority.
  • - Collaborate with satellite locations via Central Fill operations to optimize fulfillment and delivery of patient medications.
  • - Participate in initiatives to improve medication safety and adherence.
  • - Possibility to liaise with long-term care (LTC) homes, perform audits, participate in PAC and CQI committees, deliver educational in-service presentations for staff and residents, and provide recommendations during annual resident care conferences.

  Experience, Skills and Qualifications
  • - Superior oral and written communication skills
  • - Commitment to high professional ethical standards and integrity
  • - Ability to collaborate with other pharmacists, co-workers, LTC/NH/RH nursing staff, doctors and customers
  • - High level of skill in practicing within the expanded scope, and excellent documentation skills
  • - Excellent critical thinking skills, such as the ability to evaluate the ethics of decisions, validity of written prescriptions and effectiveness of alternate pharmaceutical treatments
  • - Familiarity with Kroll, PointClickCare (PCC), Med e-care, and PACMED/PACVision is preferred
  • - Previous experience in long-term care or community pharmacy an asset.

  Required Experience
  • - Registered Pharmacist in good standing with the Ontario College of Pharmacists
  • - Experience in Compliance Packaging and eMAR an asset

  Benefits
  • - Competitive hourly rate
  • - Extended Health & Dental Benefits
  • - Annual licensing & liability insurance
  • - Life Insurance
  • - Employee Assistance Program
  • - DPSP program & RRSP Matching (2 year vesting period)
  • - Store discount

  If you’re passionate about making a difference in people’s lives through healthcare, we’d love to hear from you!

  $65 - $70 CAD per hour
