  Small Animal Veterinarian
  Owen Sound, Ontario / Owen Sound Veterinary Clinic / Full-time or Part-time

  Owen Sound, the perfect destination to explore the natural beauty of Ontario! Love what you do, and where you live! Owen Sound Vet Clinic is searching for a Small Animal DVM to join our experienced RVTs and incredible support staff.

  Owen Sound rests on a beautiful harbour and is the largest city in Grey County. If you're searching for a quaint and affordable lifestyle along the Niagara Escarpment, and appreciate outdoor activities like boating, fishing, hiking, kayaking, and swimming - you'll love life on Georgian Bay! Enjoy authentic food, culture, arts and entertainment, while retaining quick access to a host of hiking trails renowned for their beauty. Owen Sound, it's where you want to live!

  Teamwork is the foundation of our hospital, and positivity is the cornerstone. Our team believes that supporting, motivating, educating, and empowering our teammates are the most critical prerequisites to success. Our ideal candidate is a team player with excellent communication skills, who is detail oriented and thrives in a fast-paced environment while connecting with our clients through their love of pets. If you are looking for a progressive environment where each individual is heard, and recognized for their unique contributions, we'd love to talk.

  Our fully equipped hospital features a digital DR Xray, ultrasound, digital dental Xray, and an in-house lab. You will be scheduled for 32 - 40 hours per week. If you're searching for an inclusive environment and are passionate about providing high-quality medical, surgical, dental, and preventative care – this is the perfect opportunity for you!

  Education
  • Doctorate of Veterinary Medicine

  Total Compensation: Our clinic values our Veterinarians, and we prove it by supporting your personal, financial, and professional growth through:
  • Competitive Salary: we offer a competitive range of $90,000 – $200,000/yr based on full-time hours, commensurate with experience and skill set
  • A Comprehensive Health Benefits Package (Medical, Dental, & Vision premiums paid by clinic)
  • Professional Services coverage (chiropractor, massage therapist, physiotherapist, and more)
  • Enhanced Mental Health Practitioner Coverage
  • P3 Pawsitive Health & Lifestyle Spending Account
  • Unlimited Continuing Education (CE) funds for advanced professional development plus one week of paid leave to attend CE
  • RRSP Matching
  • Employee Assistance Program
  • Paid Licensing & Membership Dues
  • Professional Liability Insurance coverage
  • Paid Vacation Time
  • Paid Sick & Personal Emergency Days
  • Generous Veterinary Discounts (75% off services for your own pets, and an extended family and friends discount)
  • Clothing Allowance
  • Eligibility for a Performance Bonus
  • Relocation Allowance to assist with moving expenses can be arranged for out-of-town candidates
  • Comprehensive Immigration Assistance provided by experienced immigration lawyer on retainer for out-of-country applicants

  Visit our website at: https://owensoundveterinaryclinic.com/

  Contact Information: to arrange an introductory conversation to learn more about this opportunity, please contact Aysha by phone or text at [phone], or via the email below.

