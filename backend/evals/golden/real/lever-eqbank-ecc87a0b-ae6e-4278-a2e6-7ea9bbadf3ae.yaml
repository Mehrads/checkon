text: |
  Senior Manager, Governance and Control
  Toronto / Compliance / Full Time

  Join a Challenger
  At EQ, we're remaking banking so every Canadian gets ahead, every day. Serving nearly 4 million Canadians from coast to coast, we offer a wide variety of financial services from banking and lending, to trust and credit union solutions.

  We've been at this since 1970, challenging the conventions of traditional banking with smarter, faster, and more connected financial experiences.

  What's kept us moving?  The people behind it all: challengers who ask better questions, push back on old assumptions, and look for a better way forward.

  If you're driven to help reshape how banking works for Canadians and the businesses that power our economy, this could be your next big opportunity.

  We can’t wait to get to know you!


  The Work

  This position is pivotal in the governance, control, and operational risk management activities for PersonalBanking. The Senior Manager will lead the design, implementation, execution, and reporting of 1st line testing and risk management programs, ensuring regulatory compliance and operational excellence. This role supports both day-to-day business priorities and strategic initiatives, collaborating with cross-functional teams to build and maintain a robust risk and control environment.

  Core Responsibilities
  1st Line Control Testing and Governance

  •

  Develop, maintain, and continuously update a comprehensive inventory of controls – covering both key and non-key controls – within the 1st line, in alignment with OSFI Guideline E-13 requirements.

  •

  Design, implement, and execute 1st line testing activities for key controls, ensuring alignment with regulatory requirements and internal standards.

  •

  Analyze test results, identify control gaps and remediation strategies, and communicate findings with actionable recommendations.

  •

  Review and streamline processes and controls across the business.

  •

  Challenge and provide coaching on how to improve existing processes to enable controls to be effective while enabling agility.

  •

  Create and maintain a central inventory of key controls, procedures, policies, testing activities, evidence, action items, deliverables and various other documentation in SharePoint, enabling efficient communication with senior leaders.

  •

  Lead the periodic refresh of key controls.

  •

  Act as subject matter expert on issues management within the Bank’s RCM Tool (Resolver),

  •

  Track and manage remediation of identified issues, ensuring timely resolution and continuous improvement.

  •

  Remain current on regulatory developments, industry best practices, and emerging risks in personal banking.

  •

  Review and draft department policies and procedures relating to issues management and testing of controls.

  •

  Design and deliver training and guidance 1st line on testing processes and expectations.

  Reporting

  •

  Prepare and deliver concise reports to senior leaders summarizing testing outcomes, control effectiveness, regulatory themes, and risk trends

  •

  Support reporting for Board and senior leadership, highlighting key risks and control gaps in Personal Banking

  •

  Collect, analyze and report on relevant metrics

  Let's Talk About You!
  •

  Post-secondary education in a related field (Risk Policy, Risk Management, Business, Law, Finance)

  •

  Minimum 5 years of progressive risk management, audit experience, or first line risk management experience (OSFI 1B LOD), preferably in the financial industry.

  •

  Knowledge of the financial services sector (understanding the different products/services/channels)

  •

  Knowledge of risk management, compliance matters, regulatory/legal issues, and business planning strategies.

  •

  Knowledge of regulatory legislation including but not limited to the Bank Act, Proceeds of Crime, Privacy, federal consumer protection laws, regulations and best practices.

  •

  Previous experience in Compliance testing or Audit

  •

  Excellent listening, written and verbal communication skills to influence a wide range of internal audiences and interact with all levels of management.

  •

  Strong judgment, a practical approach and commitment to achieving excellence in regulatory compliance management.

  •

  Ability to develop and maintain strong relationships with internal and external contacts.

  •

  Effective problem-solving capabilities.

  •

  Excellent organizational skills and the ability to work independently, perform under pressure within tight time constraints.

  •

  Working knowledge of Microsoft Office (Word, Excel and PowerPoint).

  What we offer [For full-time permanent roles]

  💰 Competitive discretionary bonus
  ✨ Market leading RRSP match program
  🩺  Medical, dental, vision, life, and disability benefits
  📝  Employee Share Purchase Plan
  👶🏽 Maternity/Parental top-up while you care for your little one
  🏝 Generous vacation policy and personal days
  🖥  Virtual events to connect with your fellow colleagues
  🎓  Professional development and comprehensive Career Development program
  💛  A fulfilling opportunity to join one of the top FinTechs and help create a new kind of banking experience

  The incumbent will be working hybrid and in office time will be spent working from EQ Bank’s additional office space located at 2200-25 Ontario Street, Toronto, ON.

  Equity, Diversity & Inclusion
  EQ is committed to building an inclusive, accessible environment where every employee feels valued, respected, and supported. We believe our organization is stronger — and our people thrive — when we honour and celebrate diverse experiences, identities, and perspectives. We’re equally committed to supporting your growth, both professionally and personally.
  We provide a barrier‑free recruitment process and work environment. If you require accommodations at any stage, we will work with you to ensure you can bring your best self to the process and beyond.
  As part of our recruitment process, EQ uses AI to help screen, assess, and/or select applicants for this position. All AI-enabled outputs are reviewed and validated by our talent team. All candidates considered for hire must successfully complete a criminal background check and credit check. While we appreciate every application, an EQ recruiter will contact only those whose skills and experience most closely match the requirements of the role.


  EQB Inc. (TSX: EQB) is the parent company of Equitable Bank, the country's seventh-largest Schedule I bank by assets, which operates EQ Bank, Canada's Challenger Bank™. EQB Inc. serves nearly 4 million Canadians and manages approximately $150 billion in combined assets under management and administration.

  To learn more, visit eqb.investorroom.com and eqbank.ca.
