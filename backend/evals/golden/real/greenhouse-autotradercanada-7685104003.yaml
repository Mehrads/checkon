text: |
  Agent, National Sales
  Toronto, ON (Canada)

  We are TRADER, a Canadian leader in digital automotive solutions. Our flagship brands - AutoTrader.ca, AutoSync, Dealertrack Canada and CMS - help Canadians buy, sell, and finance vehicles with confidence. Learn more at tradercorporation.com.

  As part of AutoScout24 group, Europe’s largest online car marketplace, we’re shaping the future of automotive retail in Canada and beyond.

  This role will be within our Collateral Management (CMS) team, a national tech solution that boosts lien and registration services, recovery services, and insolvency management solutions for Canadian Lenders.

  Role: Agent, National Sales

  Location: Etobicoke, ON

  Role Summary: The Agent, National Sales role is to administer seized moveable assets for disposition. This individual will ensure that information received from Recovery and the supply chain is complete and accurate as per process outline and Service Level Agreements (SLA’s). This individual will work independently while providing support to their manager. The Agent, National Sales will need to maintain and continuously develop their own knowledge of the Autoremarketing process. They will use their knowledge and experience to ensure the highest quality, efficiency, and adherence to CMS standards. Reporting directly to the Team Lead, National Sales, this individual will do all assigned duties accurately and according to target mandates.

  1. CORE ACCOUNTABILITIES /OUTCOMES:

  • Administer files as required to complete the remarketing process. Ensure daily productivity targets are met within prescribed timelines.
  • Ensure all tasks and queues are actioned and completed in accordance with the aligned work instructions within the prescribed timelines; follow standard operating procedures; action items according to task matrix; ensure quality and efficiency. Stay within or exceed daily productivity targets.
  • Maintain strong knowledge of and stay abreast of SOP’s.
  • Update/relay important information to management.

  2. COMPLEXITY/JUDGEMENT

  • Maintain and increase knowledge of documentation required for the purpose of remarketing and disposition; ensure changes are reported to management in a timely manner.
  • Maintains awareness of the external environment to anticipate and influence trends that will affect CMS's customers and their business. Uses this information to continually adapt strategy to ensure CMS has competitive advantage in meeting customer needs.

  3. QUALIFICATIONS & EDUCATION

  • Secondary education diploma preferred

  4. COMPETENCIES, SKILLS & EXPERIENCE

  • Working knowledge of MS Office software
  • Knowledge of automobile and moveable property
  • Knowledge of PPSR is an asset
  • Able to work independently
  • Strong communication skills
  • Must anticipate challenges and ensure processes are in place to identify possible risk and minimize impact
  • Industry experience is an asset

  5. INDEPENDENCE OF ACTION

  • Builds agile and effective operational processes that support CMS's ability to meet customer standards for quality and timeliness. Mobilizes resources to drive continuous process improvement and deliver on commitments to both customers and owners.
  • Contributes by using an entrepreneurial approach to develop new and innovative solutions that create value for CMS's customers and owners. Increasingly these solutions span across their service platforms and lines of business.

  What’s in it for you:

  We understand that there is life at work and life outside of work. Here are a few benefits that support us to be our creative best.

  • Gym discounts
  • Employee and Family Assistance program
  • Virtual wellness events
  • Conferences & training budget
  • Regular internal training programs
  • Financial planning with 3% matching Pension
  • Competitive salary
  • Annual bonus structure

  Compensation

  Our ranges reflect the expected compensation at the time of posting. The final offer may vary and can be higher based on relevant skills, experience, location, and market conditions. Based on the role, the total rewards package may also include benefits, bonus, and other employee offerings.

  The base salary range for this position is

  $44,000—$45,000 CAD

