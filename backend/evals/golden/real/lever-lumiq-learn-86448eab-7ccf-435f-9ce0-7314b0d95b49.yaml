  GTM Engineer
  Toronto / Full Time Permanent

  At LumiQ, we’re on a mission to make professional education enjoyable. As a modern, audio-first learning platform, we empower accounting and finance professionals to fulfill their continuing professional development requirements through engaging podcasts. Over the past five years, we’ve cultivated a devoted customer base of over 1,000 corporate and accounting firms across North America.

  LumiQ is proud to be a 2025 Deloitte Fast 50 and Fast 500 winner. We’re creating awesome proprietary content, nailing our go-to-market strategy, and being the first to shake up the industry. In 2024 we secured a strategic investment from Vertu Capital to fuel our expansion globally and continue executing on our exponential growth plans.

  LumiQ is also a certified Great Place to Work! We’re all about transparency, ownership, innovation, and empathy. If you’re ready to make a real impact and help us transform professional education, we’d love to hear from you!


  About the Role
  In order to support our continued growth, we are looking for a hard working GTM Engineer that combines technical abilities with commercial instincts. You will bridge the gap between strategy and execution by designing, building, and operationalizing the systems, automations, and AI-powered workflows that let Go To Market teams move with speed and precision. This is a hands-on, high-impact role for someone who enjoys owning a problem end-to-end.

  What You’ll be Responsible For:
  • Workflow Automation: Design and build custom internal tools, automated signal-based outbound prospecting sequences, and seamless cross-functional data handoffs using orchestration platforms like Clay, Zapier, or n8n.
  • Data Architecture: Build and optimize pipelines to clean, enrich, deduplicate, and sync raw lead data across our modern data stack and core CRM environment (Salesforce). (ie. Conference List Upload process).
  • Marketing Operations: Partner closely with Sales and Marketing teams to design and implement lead-scoring methodologies, optimize lead routing, and streamline pipeline generation.
  • AI Integration: Identify high-leverage opportunities to embed AI and Large Language Models (LLMs) directly into GTM workflows to automate cognitive tasks and personalize revenue loops.

  Who You Are:
  • Experience: 4+ years in GTM engineering, Marketing Operations, Data analysis, or Data Engineering within a SaaS environment.
  • Technical Skills: Experience with Python, SQL, API’s and Webhooks for custom scripts and data manipulation. Experience with orchestration and enrichment tools like Clay, Zapier, n8n or Claude Code.
  • Systems Knowledge: Strong working knowledge of Salesforce/CRM data models and architecture.
  • Systems & Holistic Thinker: Deconstructs complex, interconnected processes to design
  scalable solutions that align with both technical constraints and business goals.
  • Familiarity with Snowflake, Databases, Business Intelligence Tools, Customer Success Platforms is a bonus.

  If you think your experience is most of the way there, we’d still love to meet you!

  Please note this is a flexible hybrid role based out of Toronto, Canada. Employees will be expected to be able to commute to the office 2 times a week. However, for training & onboarding purposes, the in-office expectation time may increase.

  Benefits and Perks:
  Nomad policy: Work remotely 4 weeks of the year from anywhere in the world.
  Time Off to Recharge: Great vacation day offerings as well as uncapped sick and mental health days.
  Schedule flexibility: We know our employees have lives outside of work and don’t mind if you need to run to a mid-day doctor's appointment or pick up a kid early from school!
  Health Benefits: available after 3 months with us including medical, dental, vision and a yearly health spending account. RRSP matching after 1 year with us.
  Hybrid Work Style: The best of both worlds. Enjoy remote work and a downtown Toronto office with snacks, events, and ping pong.
  Quarterly & Holiday team social events: (Poker Night, Softball Tournaments, Summer Party, Halloween Party, Trivia & Paint Night are just a few examples of what we have done in the past).
  Endless Learning: Our platform isn't just for accountants. Listen to podcasts on soft skills, career development, leadership, and more.
  LumiQ Clubs: Join an existing club or start your own!

  $100,000 - $130,000 CAD per year

  Salary is based on a number of factors including market conditions, location and may vary depending on job-related skills and experience.
