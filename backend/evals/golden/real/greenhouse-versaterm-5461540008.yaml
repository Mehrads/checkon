text: |
  Events Specialist
  Ottawa, Ontario, Canada

  The Company

  Versaterm is a PE-backed, high-growth SaaS company building a fully integrated platform across the entire public safety ecosystem — dispatch, law enforcement, forensics, courts, and beyond. We've grown through strategic acquisitions and deep product investment. What connects all of it is a single purpose: give public safety agencies the tools and insights to make better decisions in high-stakes moments.

  When a 911 call is answered, a detective investigates a case, or a forensic lab processes evidence, there's a good chance our software is working behind the scenes. That's been true for over four decades.

  AI is central to where we're going. Not as a feature but as core infrastructure. We're embedding intelligence directly into the workflows our customers rely on every day, and we're doing it alongside them. Our customers tell us what the mission demands. We build what answers it.

  This work attracts a specific kind of person — someone who wants to be pushed by great people, build things that outlast a sprint cycle, and go home knowing the work connected back to something real.

  The Role

  The Events Specialist plays a key role in planning and executing a variety of live and virtual events, including industry conferences, workshops, symposiums, and internal meetings. This role supports the full lifecycle of event management—from pre-event planning and logistics to post-event evaluation and reporting.

  What You Do

  • Event Planning & Execution: Assist with all aspects of planning and coordinating live and virtual events, including venue selection, scheduling, logistics, and on-site/online support.
  • Industry Engagement: Support the organization’s presence at external industry events, including registration, booth coordination, and materials preparation.
  • Workshops & Symposiums: Coordinate internal and external educational events, ensuring smooth execution and alignment with strategic goals.
  • Versaterm Team Meetings & Conferences: Manage logistics for company-wide meetings and conferences, including agenda development, speaker coordination, and technical setup.
  • Vendor Management: Research vendors, maintain contracts, and liaise with external partners to ensure timely and quality service delivery.
  • Registration & Evaluation: Oversee attendee registration processes and compile post-event evaluations to assess success and identify areas for improvement.
  • Reporting & Analysis: Prepare summaries of event costs, attendee demographics, and feedback to inform future planning.
  • Additional Duties: Performs other related duties as assigned to support team objectives, departmental needs, and overall organizational priorities.

  What You Bring

  • Bachelor’s degree or diploma in Event Management, Communications, Marketing, or a related field, or equivalent combination of education and experience.
  • A minimum 2-3 years of experience in event coordination or administrative support, ideally in a corporate or client-facing environment.
  • Strong organizational skills and attention to detail.
  • Excellent communication and interpersonal abilities.
  • Proficiency in Microsoft Office Suite; experience with event management software is a plus.
  • Ability to travel occasionally and work flexible hours during events.

  Note: This position requires a security clearance from the Government of Canada. Candidates must be legally authorized to work in Canada and must successfully obtain and maintain a Reliability security clearance. Please note that specific customer contracts may impose additional security verification requirements. Obtaining and maintaining all required security clearances is a condition of employment. For more information on the Government of Canada's security screening process, please visit Public Services and Procurement Canada.
  Versaterm is committed to fair and equitable compensation that is competitive, consistent, and aligned with the value each role contributes to our organization. The starting salary for this position will be dependent upon many factors, such as the successful candidate’s skills, experience, education, training as well as internal equity, market data, and business needs. In addition to base salary and our comprehensive benefits offering, some roles may also be eligible for variable compensation such as incentive plans or discretionary performance bonuses.

  For Ontario-based roles, the expected base salary range for this position is CAD $70,000 to $100,000 annually.

  AI is central to how Versaterm builds and delivers solutions for our customers. Within Talent Acquisition, we use AI-enabled tools to support certain aspects of the recruitment process, helping our team work more efficiently and spend more time connecting with great talent. AI supports our work, but all hiring and employment decisions are made by people.

  Versaterm is an equal opportunity employer and is committed to equity, diversity, inclusion, and a barrier-free workplace. Accommodations are available upon request throughout all stages of the recruitment process and apply to the terms and conditions of employment. For more information, please contact [email].
