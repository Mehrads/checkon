  General Manager - Tanger Outlets Ottawa
  Ottawa, ON / Property Management / Permanent, Full Time

  Who We Are

  For over 30 years, our entrepreneurial mindset and strategic vision have fueled our growth into one of Canada’s largest and most successful REITs. Our retail-focused and mixed-use portfolio reflects our commitment to creating vibrant community spaces where people want to shop, live, work, and play. We take pride in our strong legacy while continuously adapting, innovating, and investing in the future. We’re proud to be recognized as one of Canada’s Most Admired Corporate Cultures, Canada’s Greenest Employers, Canada’s Best Diversity Employers, and a Greater Toronto Top Employer.

  At RioCan, we believe our people are our greatest strength. We foster a welcoming, inclusive culture where employees can connect authentically, grow continuously, and bring their whole selves to work. Here, you’ll find opportunities to learn, lead, and make an impact every day.

  RESPONSIBILITIES:
  • In collaboration with the Asset Management and Leasing teams, establish short and long-term strategic goals and objectives for the centre;
  • Manage property emergencies, including after-hours response, coordinating security, contractors and emergency services, attending on site as required, and ensuring timely escalation and follow-up.
  • Serve as the primary on-site management contact during peak shopping periods, including summer peak periods, Black Friday and Boxing Day, with evening, weekend and holiday availability as operationally required.
  • Manage, motivate and develop an effective, efficient and cooperative property management team through the implementation of proven training and performance management programs; complete annual reviews while providing guidance and feedback on a continual basis;
  • Lead the accounts receivable process. Monitor and directly supervise rent collection and payment of arrears on an ongoing basis. Ensure timely, appropriate resolution of tenant receivable issues;
  • Prepare and recommend annual operating and capital budget(s) for review and approval by the owners and senior management, within approved guidelines;
  • Oversee the preparation of and/or review financial reports pertaining to variance analysis, vacancy rates, rent roll review, retail sales analysis and other relevant reporting information, ensuring the accuracy of financial records and statements;
  • Cultivate solid tenant relationships; reinforce customer (tenant) service culture through proactive communication - tenant meetings, correspondence, newsletters and by being accessible. Handle complaints and concerns in a prompt, appropriate manner;
  • Regularly liaise with and establish beneficial working relationships with internal functional teams;
  • Partner with the Leasing Department during lease negotiation processes, provide support through relevant site-specific data and access. Monitor tenant compliance with lease agreements and resolve problems and concerns to ensure a high rate of tenant retention;
  • In cooperation with the national and local marketing teams, develop and implement short and long-term marketing and promotional strategies to enhance awareness and increase revenues via specialty programs, property/space lease and rentals;
  • Ability to prepare, review and award tender and contract documents. Oversee execution of third party contracts and supervise major repair projects. Liaise with the Construction Department on all landlord construction projects and tenant coordination.
  • Prepare and deliver presentations, speeches and reports demonstrating a high degree of professionalism;
  • Implement Corporate programs;
  • Monitor maintenance and operational functions to ensure compliance with legislative and regulatory standards and within RioCan governance requirements. Identify and address issues relating to life safety, liability and potential negligence situations that could impact RioCan, its contractors, tenants and/or customers;
  • Ensure that RioCan’s Health & Safety and Sustainability’s policies and practices are routinely assessed at the property level.

  QUALIFICATIONS:
  • Proven retail property management experience – 5-7 years;
  • Demonstrated financial management ability;
  • Exceptional customer service skills;
  • Exceptional leadership skills partnered with a demonstrated teamwork orientation; ability to build collaborative relationships internally and externally at all levels;
  • Experience in delivering results through hands-on participation, commitment, innovation and solid critical thinking;
  • Excellent verbal and written communication skills;
  • Professionalism in all aspects of performance;
  • Proficiency in Word, Excel and Outlook;
  • Experience with Yardi

  The base salary range for this role reflects compensation for candidates at varying levels of experience and proficiency. The salary will be determined based on the successful candidate’s relevant competencies, including skills, experience, education, and our teams’ requirements.

  The listed salary range does not include bonus and other total rewards. This role is eligible for participation in the company’s bonus program.

  This posting is for an existing vacancy within our organization.

  Why join RioCan?

  We believe in rewarding you for what you do and investing in your career and long-term success. Our total rewards program is designed to help you thrive in every aspect of your life: physically, emotionally, financially, and socially. Here’s what we offer:

  An Extensive Health and Benefits Program that includes health and dental benefits starting on day one, healthcare and wellness/lifestyle spending accounts, access to an employee family and assistance program, virtual healthcare services, and other resources to support your overall well-being.

  A Comprehensive Retirement Program to help prepare you for your future. This includes matching employee contributions in a retirement savings plan, pension plan,
  and an employee unit purchase plan.

  Work/Life Balance that prioritizes you. Enjoy flexible work hours, an extra-long weekend with our RioCan Cares Day, and half days before every long weekend in the summer.

  Professional Growth and Development opportunities to advance your skills and grow your career through our continuing education reimbursement, mentorship and leadership development programs, on-demand online learning, and cross-functional training opportunities.

  Additional Perks and Benefits that include paid time off, parental leave top-up, employee discounts, referral and recognition programs, and year-round opportunities to connect through community initiatives, committees, and social events.

  If you share RioCan’s values and a passion for real estate, we want to hear from you.
  We are committed to creating a diverse and inclusive work environment where all employees are valued, included, and empowered to do their best work and bring great ideas. People are at the core of who we are, and we respect that they have taken all paths to get here. RioCan welcomes applications from all candidates and is committed to providing accommodations for people with disabilities. If you require accommodation at any stage of the application process, please let us know, and we will be happy to work with you to meet your needs.
  You can visit us at www.riocan.com and follow us on LinkedIn to learn more about who we are and what a career at RioCan can look like for you.

  $122,500 - $168,500 CAD per year
