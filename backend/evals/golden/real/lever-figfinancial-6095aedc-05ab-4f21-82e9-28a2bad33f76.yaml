text: |
  VP, Head of Engineering
  Toronto, Ontario / Full Time

  Build a better way to borrow

  Fig is a Canadian fintech making personal lending simpler, faster, and more accessible for Canadians. We offer fully digital personal loans, helping customers apply in minutes and receive decisions quickly, without paperwork, branch visits, or long delays .

  Since launching in 2023, we’ve grown quickly and earned recognition including Consumer Lender of the Year and FinTech Startup of the Year. We’re proud to be consistently ranked among Canada’s Best Workplaces, with a 4.8/5 Trustpilot rating from our customers.

  Supported by Fairstone Bank of Canada and Ontario Teachers’ Pension Plan, we combine deep lending expertise with the agility of a startup.

  About the role

  We’re hiring a Head of Engineering to play a central role in Fig’s evolution from a single-product lender into a multi-product financial platform.

  Reporting directly to the COO, this role will sit at the leadership table and help shape the company’s long-term technology strategy, engineering culture, and platform architecture. As Fig continues to scale its lending business and expand into new product areas, you’ll help build the technical foundation, systems, and engineering capabilities that support the company’s next phase of growth.

  This is a high-impact leadership role for someone who combines strong technical judgment with operational and business thinking. In the near term, you’ll work closely with internal teams and external development partners to help bring Fig’s next generation of financial products to market. Over time, you’ll help define the engineering strategy and technical direction across a growing portfolio of products and capabilities.

  We’re looking for a pragmatic builder: someone equally comfortable discussing architecture, mentoring teams, improving execution, contributing to executive and board-level discussions, and leveraging modern tooling, automation, and AI to improve how engineering teams operate and deliver. You should thrive in ambiguity, enjoy solving complex problems, and be excited by the challenge of building in regulated environments where speed, quality, and risk must all be balanced thoughtfully.

  This is a rare opportunity to help shape the technical foundation of a company at a pivotal stage of its evolution.

  What you’ll do

  •

  Lead Fig's engineering strategy, technical roadmap, and platform architecture as the company evolves from a single-product lender into a multi-product financial platform.

  •

  Help bring Fig's next generation of financial products to market, partnering closely with internal teams and external development partners to drive execution from concept through launch.

  •

  Partner closely with leadership to align technology decisions with business strategy, operational priorities, and long-term company growth.

  •

  Build and lead a high-performing engineering organization with a strong culture of ownership, execution, collaboration, and continuous improvement.

  •

  Guide key technical decisions across infrastructure, security, scalability, reliability, and engineering quality, balancing short-term delivery with long-term platform health.

  •

  Lead internal engineering efforts and external development partners, ensuring strong execution, accountability, and delivery quality across teams.

  •

  Improve engineering workflows, tooling, automation, and AI-enabled processes to increase engineering effectiveness and organizational leverage.

  •

  Work cross-functionally across Product, Operations, Risk, Compliance, and CX to build scalable, secure, customer-centric systems that support both Fig's core lending business and future product lines.

  •

  Serve as a key technical voice in executive and board-level discussions related to technology strategy, operational risk, scalability, and company growth.

  You’ll succeed here if you have

  •

  The judgment to operate effectively across both fast-moving startup environments and regulated financial ecosystems, balancing urgency, collaboration, technical quality, and risk appropriately.

  •

  Experience building, launching, and scaling products in fintech, lending, banking, payments, or similarly regulated industries.

  •

  Strong technical judgment and experience guiding architecture and engineering decisions across complex systems and evolving platforms.

  •

  A track record of balancing execution speed with scalability, reliability, security, and long-term maintainability.

  •

  Experience leading teams through ambiguity, helping organizations navigate evolving priorities, new opportunities, and complex tradeoffs with confidence.

  •

  Strong leadership instincts and experience building healthy, high-performing engineering cultures.

  •

  Experience managing external vendors, development agencies, or distributed engineering teams and integrating them effectively into broader engineering efforts.

  •

  Strong communication and collaboration skills, with the ability to influence decisions and build alignment across technical, operational, and business stakeholders.

  •

  A pragmatic, hands-on mindset and willingness to dive into problems directly when needed.

  •

  Curiosity about AI tools and emerging technologies, with strong instincts for applying them thoughtfully to improve engineering productivity and operational effectiveness.

  •

  Strong systems thinking and a bias toward building simple, scalable, resilient solutions.

  Why Fig

  •

  Make an impact: Rare opportunity to join early and help shape the future direction of a fast-growing fintech company.

  •

  High ownership: Take on a high-impact role with direct exposure to senior leadership and company-building initiatives.

  •

  Strong culture: Work in a team that values impact, accountability, curiosity, and collaboration.

  •

  Hybrid work environment: Balance of remote and in-office work (currently one day a week in Toronto), while maintaining strong collaboration.

  •

  Competitive compensation: Expected base salary range between $185 000 and $205 000, plus the opportunity to earn an annual incentive bonus tied to performance

  •

  Retirement savings program: Employer matching to support your long-term financial goals.

  •

  Comprehensive benefits: Medical, dental, and vision group insurance, as well as health and wellness spending accounts.

  •

  Time off: Generous vacation and wellness time to support rest and recharge.

  •

  Parental support: Parental leave top-up to support your growing family.

  •

  Growth and Development: Continuing education stipend to support your professional development.

  Our commitment to diversity, equity and inclusion

  Fig is an equal opportunity employer committed to building a diverse and inclusive team.

  We welcome applications from people of all backgrounds and do not discriminate based on race, religion, culture, sexual orientation, gender identity, or disability.

  We’re focused on creating an environment where everyone feels respected, supported, and able to bring their full selves to work. We also provide accommodations throughout the recruitment process. If you need support, just let us know.

  Next steps

  We appreciate your interest in joining Fig. Our team will review applications and contact candidates selected to move forward in the process.

  AI disclosure

  We may use AI tools to support parts of our hiring process, such as reviewing applications, analyzing resumes, or assessing responses. These tools assist our team but do not replace human judgment, and all hiring decisions are ultimately made by people.

  If you have questions about how your information is handled, feel free to reach out to us.

  $185,000 - $205,000 CAD per year
