text: |
  Sales Enablement Specialist, Sales Development Program
  Toronto

  About Owner

  Owner is the AI-native system local business owners use to succeed, starting with restaurants.

  We’re building the system that replaces the many tools owners use to run their business.

  It powers everything from the restaurant’s website, online ordering, CRM, POS, and more.



  Product philosophy

  Most small business software makes owners do the work to get what they want: sales growth and profit growth. Owner does the work for them agentically.

  Our system drives demand, converts it, and helps operators run their business day to day. As it improves, the business improves with it.

  Using Owner should feel like having a team of great operators, engineers, and marketers working for you.



  Our vision



  We’re starting by helping independent restaurants succeed online.



  But it’s not just restaurants that need our help. Most local businesses are struggling with these same problems. Huge technology corporations are taking their customers, bleeding their profits, and making it hard for them to survive.



  Once we nail the solution for restaurants – we’ll scale it into every other local business type.



  In the future we envision, tens of millions of local business owners will use our technology to succeed in the digital age.



  Our traction



  Since 2020, we've generated tens of millions in revenue and processed over a billion dollars of online orders. 1 in 5 Americans have used an Owner.com http://Owner.com website.



  More importantly, we’ve helped over 20,000 restaurant owners, and saved them nearly $200 million in fees.



  Our team



  Our team is now in the low hundreds. We’ve got top talent from the most successful companies in SMB software, including: Shopify, HubSpot, DoorDash, ServiceTitan, Rappi, Faire and Stripe.



  We’ll be scaling even faster in 2026 to keep pace with our customer growth.



  Where we work



  Owner is a remote-first, global company headquartered in San Francisco, with a sales hub in Toronto. For a few of our roles we prioritize in-person collaboration at one of our office locations. Most of our teammates are distributed throughout the globe. Please review the role description and discuss with your recruiter for more details on location!





  Why we’re looking for you

  Owner is growing fast, and our XDR team is at the center of that growth. We’re looking for a sales-first Revenue Enablement Specialist to own and evolve our XDR (SDR & BDR) enablement program.

  This role is ideal for someone who has lived the sales motion—as an SDR, BDR, AE, or sales leader—and is excited to apply that experience to building training, onboarding, and development programs that actually move the needle. Formal enablement experience is a plus, but deep sales credibility is the priority.

  You’ll partner closely with XDR leadership to ensure every rep is equipped to clearly communicate Owner’s value, ramp quickly, and grow into their next role. Your work will directly impact ramp time, rep performance, and the future AE bench at Owner.


  Location: Toronto-based role with a hybrid schedule (2 days/week in-office). During monthly new-hire onboarding, this role is expected to be in-office 5 days/week (apx 2.5 weeks per month)


  The impact you will have

   - Program Ownership & Strategy: Own the XDR Enablement Roadmap, Quarterly Plans, and Monthly Sprints. Continuously iterate on programs based on rep performance, manager feedback, and business priorities. Lead enablement projects and execute proper change management processes across the XDR team

   - New Hire Onboarding: Execute and continuously improve Owner’s monthly XDR onboarding program in Toronto. Accelerate new XDRs' time to value and productivity by delivering a world-class XDR Academy and Onboarding Experience. Fundamentally impact the organization's ability to scale by reducing ramp time for new XDR team members

   - Rep Up-skilling & Development/; Own and maintain all XDR training content, ensuring it stays relevant as Owner evolves. Build competency-based training that prepares top XDRs for promotion into AE roles. Create clear development paths for skill-building, performance improvement, and career growth

   - Knowledge Management: Own XDR-specific documentation within Owner’s knowledge base. Ensure enablement content is easy to find, up to date, and actionable. Create new sales plays, talk tracks, and resources that help reps win

   - Cross-Functional Collaboration: Partner closely with XDR frontline managers to continuously improve training and program effectiveness. Collaborate with broader Revenue Enablement team and cross-functional stakeholders to move XDR initiatives forward. Act as a force multiplier for sales leadership by translating strategy into execution Sellers time to value and quota by delivering a world class Sales Academy and Onboarding Experience

  Who you’ll work with

   - XDR frontline managers (your primary partners)

   - Revenue Enablement team

   - Cross-functional teams (AE Leadership, Product, Marketing, RevOps, etc) as required to support XDR initiatives

  Minimum requirements

   - 3–5+ years of experience in sales (SDR, BDR, AE, and/or sales leadership) with a proven track record of exceeding quota

   - Experience leading, coaching, or supporting SDR/BDR teams as a manager, senior rep, or enablement partner

   - Demonstrated history of top performance in a quota-carrying SDR or BDR role

   - Hands-on experience training sales reps, improving sales processes, or building scalable workflows that drive performance

   - Proven track record of taking ownership of projects end-to-end and driving them to impact, not just completion

   - Exceptionally detail-oriented and organized, with high standards for quality, consistency, and follow-through

   - Clear, confident communicator who can navigate ambiguity, align stakeholders, and move work forward in a fast-changing environment

   - High energy, positive, and deeply motivated by helping sales talent grow, win, and raise the bar across the team

  Pay and benefits

   - The estimated base salary range for this role is $120,000 - $140,000 CAD plus a generous equity pre-IPO equity package

   - Other benefits include comprehensive health coverage, work from anywhere (100% remote workplace except during Toronto onboarding weeks), unlimited PTO - plus extra fun perks!





  Notice - Employment Scams

  Communication from our team regarding job opportunities will only be made by an Owner team member with an @owner.com email address.



  We do not conduct interviews over email or chat platforms, and we will never ask you to provide personal or financial information such as your mailing address, social security number, credit card numbers or banking information. If you believe you are being contacted by a scammer, please mark the communication as "phishing" or “spam” and do not respond.



