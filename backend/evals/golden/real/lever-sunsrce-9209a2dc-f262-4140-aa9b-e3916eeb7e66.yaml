  Industrial Sales Account Manager Trainee - Mobile Hydraulic Solution Sales
  Mississauga, Ontario L5N 2M2 / SunSource / Grow Our Own Sales Development Program

  SunSource and its family of companies represent 270+ locations and 4,000+ employees making up one of North America’s leading value-add industrial distribution companies.  We provide customers with products and value-added solutions within Fluid Power, Fluid Process, Fluid Conveyance, Automation, General Industrial Components, and Industrial Repair. www.sun-source.com


  Looking to use your technical education to provide cutting-edge solutions for customers building Agricultural or Construction machinery?

  SunSource is hiring individuals wanting to start a career focused on applying and selling hydraulic and pneumatic solutions that help our customers’ mobile equipment operate more efficiently and intelligently.

  In this role you will begin your career in SunSource’s Grow Our Own (GO2) Sales Training Program, based at our Mobile Engineering Center in Mississauga, ON.

  During your first year, you will participate in a structured rotational development program within Fluid Power, learning SunSource products and systems used in Heavy Duty Mobile Equipment, including machines for:
  • Construction
  • Agriculture
  • Railway
  • Transportation
  • Forestry

  You will receive hands-on exposure to our complete systems solutions while learning SunSource’s sales methodology, including:
  • Prospecting and territory planning
  • Account and relationship management
  • Negotiation fundamentals
  • Customer problem-solving strategies
  • In-depth technical product training on components and systems for the Mobile Equipment Industry
  • Exposure to multiple departments, including: Applications Engineering, Design Engineering, Sales & Marketing, Customer Service, Repair & Operations, Sales and customer service training, Continuous mentorship and support, High visibility to senior leadership, and a clear and defined career growth path.

  What to Expect?
  • Willingness and ability to relocate for 18 months to our Mississauga, ON location, with an end territory to be in the Toronto region
  • Upon successful completion of the GO2 program, you will be promoted to an Account Manager role, where you will manage your own territory and continue growing your career with SunSource.

  What is Expected of You?
  • Bachelor’s degree in Engineering, Engineering Technology, Agribusiness, or related field (preferred) OR Associates degree from a Fluid Power–specific program OR 1–2 years of related experience or internship and/or equivalent combination of education and experience
  • Desire to build a career in industrial sales
  • Demonstrated technical aptitude with mechanical and/or electrical principles, much of what we do requires applying mechanical and/or electrical principles on mobile and industrial equipment
  • Clear and concise communication, presentation, and phone skills
  • Professional business etiquette
  • Entrepreneurial mindset with resilience and drive

  Sun Source Offers
  • Competitive compensation
  • Medical, Dental, and 401(k)
  • Paid vacation and holidays
  • Ongoing training and professional development opportunities

