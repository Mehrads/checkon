text: |
  Financial Analyst- 12 month contract
  Toronto, Ontario

  Since 2015, Mejuri has reimagined what fine jewelry can be in a modern world—shifting it from a traditional gift to to a personal choice rooted in self-expression.

  Founded by third-generation jeweller Noura Sakkijha, the brand was built on a simple idea: fine jewelry shouldn’t require a special occasion, and it should never come with guilt. It’s about celebrating yourself—your style, your life, your everyday.

  Mejuri meets customers where they are—online, in app, and through a growing global retail footprint of 58+ stores worldwide. Mejuri is also deeply committed to doing things the right way, with responsible sourcing, sustainable practices, and philanthropic initiatives that reflect our values and long-term vision.

  Overview

  (Financial Analyst- 12 month contract)

  The Financial Analyst owns the numbers behind Mejuri's planning cycle: building the annual budget and the quarterly and monthly forecasts, then tracking actuals against them across departments, stores, and the consolidated business. Forecasts and budgets only matter if someone is watching how reality diverges from them — that ongoing read is what this role exists to provide.

  You'll prepare the reporting packages that give business leaders a clear view of their financials and headcount, with variance analysis that surfaces risk and opportunity before it shows up in results. You'll run the weekly cash flow report for the company, catch data issues at the source with Payroll, and work directly with business partners across departments who bring their numbers to you before they bring them to anyone else.

  You'll join a small FP&A team, where one person's analysis often reaches a business leader directly, with no layer of review between the work and the decision it informs.

  What You'll Do

  Planning & Forecasting

  • Budget and forecast accuracy — The annual budget and monthly and quarterly forecasts reflect where the business actually stands. You build them across departments and stores, then monitor results against plan and flag where they diverge.
  • Cash flow reporting — The company gets an accurate weekly read on cash position. You assist in preparing this report on a consistent schedule, alongside ad hoc analysis as it comes up.
  • Process improvement — Budgeting and forecasting get faster and more reliable over time. You look for where the current process breaks down and fix it, rather than working around it each cycle.

  Reporting & Business Partnering

  • Reporting packages — Business leaders see their financial results and headcount clearly, with the variance analysis to explain why. You prepare these packages and flag the risks and opportunities in them.
  • Decision support — Business partners get an answer that changes what they decide, not just a summary of what happened. You analyze past and projected financial impact to support their calls.
  • Fact-based challenge — Assumptions get tested before they become the forecast. You question inputs that don't hold up and push back with the numbers when they say something different.
  • Systems fluency — Business partners get a better process, not just a report. You build a working knowledge of Mejuri's systems, processes, and financial statements, and use it to find where efficiency is possible.

  What You'll Bring

  • Finance education — A Bachelor of Business Administration with a specialization in Finance or Accounting.
  • FP&A experience — 1–3 years in FP&A or financial reporting; retail or CPG industry experience is an asset, as is progress toward a CPA, CFA, or CBV designation.
  • Advanced Excel — Comfort building complex formulas and financial models, and handling large volumes of data without losing accuracy.
  • Systems aptitude — A demonstrated ability to pick up new systems quickly and use their full capabilities, not just the basics.
  • Self-direction — You take initiative without being asked and follow through on what you commit to.
  • Relationship-building — Strong written communication and the ability to build working relationships across functions and levels, including with non-finance and executive stakeholders.

  Benefits at Mejuri:

  • A minimum of four weeks vacation, plus personal days and three religious/cultural observance days.
  • A hybrid work model for all corporate roles
  • ‘Mejuri Passport’ which allows employees who meet specific criteria to work in other locations for one month per year.
  • Comprehensive medical and dental benefits, including mental health coverage, and generous personal and sick days for our full-time employees. We also offer bereavement leave, including miscarriage and stillbirth support.
  • Parental leave salary top-up of up to 80%, as well as a personalized return-to-work transition and accommodation plan for full-time employees.
  • A generous product discount!

  Location
  Toronto, Ontario
  60 Bloor Street W
  Hybrid; 3 days in office 2 days remote

  Salary:

  $72,000-$85,000
  Looking for the perfect next opportunity is a big decision. Mejuri recognizes the importance of pay transparency when it comes to salary ranges as it empowers individuals through the hiring process and supports them in making an informed decision. We will review individual salary expectations and **weight salary commensurate with experience.

  At Mejuri, we use AI-assisted tools as part of our recruitment process to help screen and assess candidate applications. All hiring decisions involve human review, and our Talent team remains responsible for evaluating candidates and making final decisions throughout the process.

  #LI-Onsite

  At Mejuri our success is driven by a strong commitment to our Purpose and Values. They're the foundation of our operations, defining how we show up, solve problems, and accomplish incredible things—together.

  Our strength comes from each team member's dedication to embracing and embodying these Values daily. This isn't merely a duty; it's a passion that defines us. They guide us in providing extraordinary experiences for our customers and fostering an innovative environment. Success, for us, means living our values relentlessly.

  Our values are:

  RAISE THE BAR | Stay Curious, Share/Seek Feedback, and Strive for Excellence

  CUSTOMER OBSESSED | Get close to the customer and prioritize them in our decisions

  EMPOWERED OWNERS | Treat the company like your own, take initiative

  FIND A WAY | Seek simple, creative solutions, and act fast

  DRIVE RESULTS | Be clear on your goals and be relentless in achieving them

  TEAM FIRST | Value team success over personal ego

