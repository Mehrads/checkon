  Small Animal Veterinarian - Medical Director
  Orangeville, Ontario / Westend Veterinary Hospital / Full-time

  Westend Veterinary Hospital in Orangeville is expanding and looking for a Medical Director! If you’re searching for a fun-loving team, a welcoming environment, and the opportunity to advance your career - you can't afford to miss this opportunity. Our Hospital believes that supporting, motivating, and empowering our teammates are the most critical prerequisites to success. We support our patients and clients unconditionally, and believe you deserve no less as a colleague and member of our team. If you have a desire to work with a progressive team that is committed to creating a better veterinary experience for pets, pet parents, and the professionals that provide this care - please get in touch.

  Total Compensation - Our clinic values our Veterinarians, and we prove it by supporting your personal, financial, and professional growth through:
  • Competitive Salary: we offer a competitive range of $90,000 – $200,000/yr based on full-time hours, commensurate with experience and skill set
  • A Comprehensive Health Benefits Package (Medical, Dental, & Vision premiums paid by clinic)
  • Professional Services coverage (chiropractor, massage therapist, physiotherapist, and more)
  • Enhanced Mental Health Practitioner Coverage
  • P3 Pawsitive Health & Lifestyle Spending Account
  • Unlimited Continuing Education (CE) funds for advanced professional development plus one week of paid leave to attend CE
  • RRSP Matching
  • Employee Assistance Program
  • Paid Licensing & Membership Dues
  • Professional Liability Insurance coverage
  • Paid Vacation Time
  • Paid Sick & Personal Emergency Days
  • Generous Veterinary Discounts (75% off services for your own pets, and an extended family and friends discount)
  • Clothing Allowance
  • Eligibility for a Performance Bonus
  • Relocation Allowance to assist with moving expenses can be arranged for out-of-town candidates
  • Comprehensive Immigration Assistance provided by experienced immigration lawyer on retainer for out-of-country applicants.

  Education
  • Doctorate of Veterinary Medicine

  Visit our website at: www.westendvethosp.com

  Contact Information: to arrange an introductory conversation to learn more about this opportunity, please contact Aysha by phone or text at [phone], or via the email below.

  We are an equal opportunity employer committed to fostering a respectful, inclusive, and diverse workplace.

  If you require accommodation during the recruitment process or wish to submit your CV for consideration, please contact us at [email]
