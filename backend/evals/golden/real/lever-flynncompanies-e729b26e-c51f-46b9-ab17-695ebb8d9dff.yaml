  Automatic Door Technician - Glazing - Sudbury
  Sudbury, ON / Flynn Group of Companies / Field Full-time

  HAPPY WITH YOUR CAREER BUT OPEN TO A CHANGE IN LOCATION?
  Flynn Canada’s Automatics and Glazing Service team in Sudbury, Ontario is the leader in automatic door installation and service throughout Northern Ontario. We work with the manufacturers of most name brand automatic door entrance systems. We’re looking for an experienced “Automatic Door Technician” to join our growing team.

  HOW WOULD WE DESCRIBE THE IDEAL CANDIDATE?

  You are an AAADM-certified automatics troubleshooting genius with at least 6+ years’ experience and superb customer service skills. You thrive on the opportunity to provide solutions – regardless of the brand of product. You are a strong team player with a well-rounded set of relevant skills that you are more than happy to pass along to apprentices and other members of the team.

  OTHER DETAILED REQUIREMENTS INCLUDE YOUR ABILITY TO:
  -Install and service automatic door entrance systems in a professional, cost-effective and safe manner
  -Maintain records of all work conducted and parts used on each job
  -Maintain company vehicle, tools and property in an appropriate manner
  -Maintain the parts inventory for your service vehicle
  -Maintain good customer relations
  -Assist and instruct others in installing/servicing automatics
  -Lead/assist in other areas of our team responsibility including working with commercial glass, commercial doors and hardware, etc.

  HOW CAN FLYNN HELP YOU WITH A NEW CHAPTER IN YOUR CAREER?
  •Dental insurance
  •Health insurance
  •Vision insurance
  •Prescription insurance
  •Referral bonus program
  •Overtime pay
  •Vacation pay
  •On-site parking
  •Paid apprenticeship training
  •Sponsored Retirement Savings Plan
  •PPE provided
  •Tools provided
  •Flynn University (Coach training)


  How To Apply?
  - Please apply directly online

  #LI-DNI

  Flynn Group of Companies is the leading trade contractor in North America that works on virtually every aspect of a building’s outer layer, including Roofing, Glazing, Waterproofing, and Architectural Metals. The foundation of our award winning success is having the right people on our team.
  Disclosure: We use an AI-powered system to initially screen resumes.  However,  all applications/resumes are also reviewed by our team of Human Resources and Talent Acquisition Professionals to ensure a fair and thorough evaluation in determining a candidate’s potential fit for a role they applied to.
  This posting is for an existing vacancy within the organization.

  $21.91 - $39.83 CAD per hour

  *wage is determined on skill and experience level.*
