text: |
  Registrar
  Toronto, ON

  Join one of Canada's fastest-growing universities as our Registrar, where you will lead enrolment services, academic administration, and institutional reporting while advancing student success through data-informed decision-making and service excellence.

  About the Role

  The Registrar is a strategic, student-centred leader responsible for supporting student outcomes through excellence in enrolment services, academic administration, records management, and institutional reporting. The Registrar oversees the integrity, governance, analysis, and effective use of student and institutional data, providing insights, analytics, and reports that support evidence-based decision-making, strategic planning, quality assurance, and regulatory compliance. Working collaboratively across the University, the Registrar champions service excellence, continuous improvement, and data-informed practices that enhance the registrarial and academic administration experience, support the monitoring of student progression, persistence, retention, and graduation outcomes, and contribute to the achievement of the University's strategic goals.

  Title: University Registrar
  Type: Full-Time, Permanent
  Reporting to: President
  Location: Toronto, Ontario
  Existing Vacancy: Yes
  Compensation Range: $130,000-$150,000 annually

  Why Join IBU

  Located in downtown Toronto, IBU is one of Canada's fastest-growing universities, offering a dynamic academic and professional environment driven by innovation, research, and academic excellence. By joining IBU, you will have the opportunity to play a meaningful role in its continued growth by developing strategic partnerships, enhancing the University's external presence, and supporting its recruitment and growth objectives.

  What You'll Do

  Strategic Leadership, Data Analytics, and Institutional Effectiveness

  • Lead the University's student information, records, and data management strategy, ensuring the integrity, security, accessibility, and effective use of student and institutional data.
  • Develop and oversee institutional dashboards, analytics, key performance indicators, and reporting frameworks that support strategic planning, the planning and evaluation of student success initiatives, accreditation, regulatory compliance, and evidence-based decision-making.
  • Provide timely analysis, insights, and recommendations to senior leadership to inform operational and strategic priorities.
  • Champion data governance, continuous improvement, and a culture of informed decision-making across the University.

  Technology, Innovation, and Process Excellence

  • Lead the modernization and optimization of Registrar's Office systems, processes, and services through the effective use of technology, artificial intelligence, automation, and digital transformation initiatives.
  • Identify opportunities to improve efficiency, service quality, responsiveness, and scalability while reducing administrative burden for students, faculty, and staff.
  • Oversee the effective implementation, maintenance, and continuous enhancement of student information systems and related technologies.

  Registrarial Service Excellence

  • Foster a student-centered culture that prioritizes service excellence, responsiveness, accessibility, and continuous improvement.
  • Ensure Registrar's Office services and processes are designed to deliver an exceptional registrarial and academic administration experience from admission through graduation, distinct from student life, wellness, counselling, career readiness, and international student support services.
  • Monitor and improve service standards, turnaround times, and student satisfaction metrics, implementing solutions that enhance the overall student journey.
  • Collaborate with academic and administrative departments to remove barriers and improve service delivery across the student lifecycle.

  Leadership and Team Development

  • Provide strategic leadership, direction, and mentorship to the Registrar's Office team, fostering a high-performing, accountable, collaborative, and customer-focused culture.
  • Establish clear performance expectations and service standards while supporting professional development and continuous learning.
  • Promote innovation, adaptability, and a commitment to excellence in service delivery.

  Academic Administration and Compliance

  • Oversee student records, registration, academic scheduling, grading processes, graduation audits, credential issuance, and related academic administrative functions.
  • Ensure compliance with legislative, regulatory, accreditation, and institutional requirements related to student records and registrarial responsibilities.
  • Develop, implement, and maintain policies, procedures, and practices that support academic integrity, operational effectiveness, and institutional accountability.
  • Work collaboratively with the Dean of Students and other student-facing units while maintaining primary accountability for registrarial services, student records, academic administration, systems, data, and reporting functions.

  What You Bring/Who You Are

  • Master's degree in a relevant discipline; an equivalent combination of education and leadership experience will be considered.
  • Progressive senior leadership experience in student services, enrolment management, customer experience, operations, data analytics, institutional effectiveness, or related functions.
  • Demonstrated success leading high-performing, customer-centric teams and fostering a culture of accountability, service excellence, and continuous improvement.
  • Proven ability to leverage data, analytics, and performance metrics to drive strategic decisions, operational effectiveness, and organizational outcomes.
  • Experience leading technology-enabled transformation, including the implementation and optimization of digital systems, automation, artificial intelligence, and process improvement initiatives.
  • Strong strategic, analytical, and communication skills, with the ability to translate data and insights into action.
  • A commitment to delivering exceptional student and customer experience through innovative, efficient, and responsive services.
  • Experience in post-secondary education is an asset; however, candidates from other sectors will be considered where they demonstrate significant leadership in data-driven operations, customer service excellence, technology transformation, and team leadership.

  Additional Information

  To support the overall well-being and success of our employees, IBU offers a comprehensive Total Rewards package, which may include the following, based on role eligibility:

  • 100% employer-paid extended Health & Dental benefits
  • 24/7 access to an Employee and Family Assistance Program (EFAP) and virtual healthcare services
  • Life, Accidental Death & Dismemberment (AD&D), and Long-Term Disability insurance
  • Competitive paid time off, starting at three weeks
  • Tuition Benefit Program
  • Access to preferred corporate membership rates with GoodLife Fitness
  • Engaging employee appreciation and community-building events

  IBU is an Equal Opportunity Employer

  IBU is committed to fostering a diverse, inclusive, and equitable workplace where everyone feels welcome, valued, and respected. We are dedicated to the principles of equal opportunity and encourage applications regardless of race, religion, colour, national origin, gender, sexual orientation, age, marital status, or disability status. Please contact [email] if you require accommodation during the recruitment process.

  Application Process

  All applications are reviewed by our HR team. We may use AI tools to support certain stages of the hiring process and do not replace human judgment. IBU is committed to the responsible and fair use of AI in compliance with applicable laws.

  While we appreciate all applications, we regret that we can only contact those candidates selected for an interview. We thank all applicants for their submissions.
