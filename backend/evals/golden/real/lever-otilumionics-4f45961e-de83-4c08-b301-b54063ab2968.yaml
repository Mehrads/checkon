text: |
  Research Scientist
  Mississauga, ON / Full time (On Site)

  About Us

  OTI Lumionics is developing advanced materials—by design—using quantum simulations, machine learning and real-world testing in pilot production. We are currently focused on key enabling materials for OLED displays that will be used in next-generation consumer electronics and automotive. Our advanced electrode materials, and associated manufacturing technology, are being used to build transparent displays and lighting. We work closely with our partners and customers to design new materials that are mass-production ready. Using our computational Materials Discovery Platform, we are able to rapidly iterate new materials, allowing fast turn around time to meet our customers’ needs.

  Workplace Type

  On-Site

  Primary Responsibilities

  • Design experiments including but not limited to OLED device performance and material characteristic tests
  • Perform literature review on research projects
  • Analyze and present experimental data to summarize key project findings or identify new objectives for the subsequent experiments
  • Collaborate with software engineers by providing feedback on potential improvements that can be made to programs and software developed by OTI Lumionics
  • Troubleshoot and work with Facility Engineers to fix, modify, and set up new equipment
  • Operate R&D equipment
  • Write reports and analyzing data
  • Maintain the laboratory and equipment in a functional state to provide necessary services
  • Assist team on various ongoing projects
  • Generate assembly and test documentation
  • Perform all tasks in accordance with established Safe Work Practices and Standard, Operating Procedures
  • Adhere to health and safety protocols, report hazards, and contribute to maintaining a safe and healthy work environment for all employees
  • Other ad hoc duties as assigned

  Profile

  • PhD in Physics/Electrical Engineering/Materials Science & Engineering
  • < 3 years of Postdoc experience

  Required Skills

  • Proven track record (4+ years) in characterization and development of advanced semiconductor devices, including but not limited to LEDs, OLEDs, Organic / Perovskite solar cells
  • Hand-on experience of thin-film engineering and chemical / physical vapor deposition
  • In-depth understanding of vacuum systems
  • Project management, independent and critical thinking, milestone driven project execution
  • Understanding of processing engineering (i.e., design-of-experiment, root-cause analysis, process optimization)
  • Ability to process and analyze data, and identify trends and relationships between different parameters
  • Effective communication skills (both oral and written)
  • Extended hours and shift work may be required from time to time

  $75,000 - $110,000 CAD per year
