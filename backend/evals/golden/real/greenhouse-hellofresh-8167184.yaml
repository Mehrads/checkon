text: |
  Associate Manager, Supply Chain Enablement
  Toronto, Ontario, Canada

  S'more about the team:

  We are seeking a driven and analytical Supply Chain Enablement Associate Manager to support the transformation of our ingredients and packaging inbound supply chain. Reporting to the Associate Director, Supply Chain Enablement, you will lead standalone supply chain process and technology improvement workstreams end-to-end — turning operational signals into data-driven cases and delivering measurable impact. As a part of the Procurement team, you will develop deep expertise in our processes, data, and technology, building the analytical foundation that drives continuous improvement across our E2E supply chain.

  You will succeed in this role by combining structured analytical thinking, effective cross-functional collaboration, and strong project management skills to independently own and deliver workstreams from problem definition through implementation.

  Lettuce share what this role will be responsible for:

  • Lead standalone supply chain process and technology improvement workstreams end-to-end, from opportunity identification and root cause analysis through implementation and adoption
  • Build data-driven analytical cases — quantify opportunity size and impact, assess root causes, and make clear recommendations to fix, standardize, or escalate
  • Run deep current- and future-state process mapping to isolate root causes; independently lead root cause and corrective action (RCCA) on workstream-level problems
  • Collaborate with cross-functional stakeholders across the organization (including teams from procurement, planning, logistics, technology, data, fulfillment operations, and finance) to align on solutions and drive workstream-level change
  • Serve as the primary mentor and quality gate for offshore resources within your workstream — vetting new workstreams, defining execution plans, auditing quality, and managing SLA variances
  • Contribute to our source-to-pay technology and process knowledge; support master data and technology initiatives within your workstream scope
  • Maintain and improve standard operating procedures and documentation for workstream processes
  • Manage project plans, Jira workflows, and timelines; provide stakeholder updates and collaborate with our data team to track KPIs and report on progress
  • All other duties as assigned

  Sound a-peeling? Here's what we're looking for:

  • Bachelor's and/or Graduate degree in Business Management, Supply Chain Management, Engineering, or equivalent field
  • 4+ years of relevant consulting or industry experience with logistics, supply chain management, operations, or a related field
  • Demonstrated ability to build analytical cases — quantifying impact, sizing opportunities, and translating data into clear, actionable recommendations
  • Experience leading process improvement projects end-to-end, including stakeholder alignment, change communication, and post-implementation tracking
  • Working knowledge of Lean methodologies and root cause analysis tools (e.g., 5 Whys, Variable Tree Analysis); Lean Six Sigma Green Belt certification is a plus
  • Proficiency in data analysis and visualization tools (e.g., Google Sheets, Tableau, Looker); ability to build or contribute to reporting dashboards
  • Subject matter knowledge in one or more of: procure-to-pay, source-to-pay, process mapping, spend analysis, or performance metrics
  • Demonstrated ability to collaborate across cross-functional teams and engage stakeholders at multiple levels of the organization
  • Clear and structured communication skills, with the ability to synthesize complex information and present recommendations to cross-functional audiences
  • Comfort operating in a fast-paced, ambiguous environment with the ability to self-direct a workstream with limited guidance

  Let’s cut to the cheese, this is why you'll love it here:

  • Box Discount - Amazing discounts on 1 box per week! 75% discount on weekly HelloFresh and Chefs Plate meal kits AND 50% off weekly Factor meal box.
  • Health & Wellness - Health & Dental benefits from day 1, a Health Spending Account, unlimited access to the Headspace app to meet your self-care needs, and 25% discount on GoodLife fitness memberships!
  • RRSP Matching - Competitive RRSP matching program offered
  • Vacation & PTO - Time off is also an important part of self-care! We offer generous vacation and PTO to help you create a good work-life balance.
  • Family Benefits - A parental leave top-up program for expectant parents.
  • Growth & Development - We support your career progression, provide development opportunities, and invest in your continued learning through our organization wide L&D fund.
  • Work Hard & Have Fun - From team socials to engaging company days, you’ll have plenty of opportunity to experience the fun!
  • Diversity & Inclusion Initiatives - With impactful ERG’s like FreshPride, Women Empowered and LIMES, we are committed to our diversity, equity & inclusion efforts.
  • Food Puns - this one is kind of a big dill if you haven’t already noticed. We even have some punny meeting room names!

  Working Conditions:

  It’s no surprise that as a food company, we use many ingredients that may be considered common allergens (i.e. peanuts, tree nuts, milk, etc.). Whether this role is based out of our headquarters or one of our distribution centers, it is possible that you may be exposed to such allergens in this role. If you have any concerns with being exposed to any particular food ingredients, including meat, please disclose this during the hiring process.

  If this sounds like you, please click the "Apply Now" button. If this role doesn't quite match what you're looking for, but you'd like to know more about joining the HelloFresh team, please visit our Jobs page to view our other vacancies. We'd love to hear from you!

  HelloFresh Canada uses AI-integrated technology to help us process and evaluate applications more efficiently. This includes tools that screen and assess candidate qualifications based on the requirements for this role. While these tools assist our workflow, all final selection decisions are made by our hiring team.

  This is a posting for an existing vacancy. We are actively seeking to fill this position.

