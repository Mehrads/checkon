  Outside Sales Account Manager - Industrial Service and Repair Sales
  Windsor, Ontario N9A 6P1 / K+S Services / Outside Sales & Sales Management

  K+S Services, a SunSource company, offers a full range of industrial repair capabilities with over 866 different Manufacturers and over 122,000 unique part numbers supported. We provide our customers with quality industrial repair services, effective solutions and efficient service through continuous quality improvements. With a growing number of operations throughout the USA, Canada, and Mexico, we offer a variety of exciting opportunities and strive to recognize our associates for their hard work and dedication.  www.k-and-s.com


  We are currently seeking a driven, customer-focused Outside Sales Regional Account Manager to join our team and cover a territory from the Windsor, ON area through the London, ON area. In this role, you’ll build and strengthen customer relationships, develop new business, and provide solutions that help keep our customers’ operations running.

  Essential Functions
  • Maintain and grow existing customer relationships while identifying and developing new business opportunities within a defined geographic territory.
  • Prospect and cold call to identify new customers and expand the territory.
  • Manage a book of open orders, ensuring customers are kept informed and their needs are met throughout the process.
  • Maintain accurate CRM activity and customer information daily while organizing your schedule around a proactive, effective outside sales approach.
  • Build strong relationships with customers at all levels of their organizations.
  • Identify customer challenges and provide solutions that help keep their operations running.

  Experience, Education and Skills
  • High school diploma or equivalent.
  • Bachelor’s degree in Sales, Marketing, or Engineering, or a 2-year technical degree, preferred.
  • 2+ years of industrial sales experience, preferably selling industrial repair services. Experience with electronics, hydraulics, robotics, servos, and/or mechanical components is strongly preferred.
  • Demonstrated experience with opportunity qualification, pre-call planning, account development, and time management.
  • Ability to establish, develop, and maintain strong business relationships.
  • Excellent verbal and written communication skills, with the ability to communicate clearly and effectively.
  • Computer proficiency, including Microsoft Office products, and the ability to learn and effectively use a CRM system.
  • Valid driver’s license.
  • Overnight travel may be required.
  • Ability to drive to and conduct customer visits in industrial settings. At times, the role may require the ability to lift and carry items weighing up to 50 lbs.

  We Offer
  • Industry-competitive salary, commissions, and bonus opportunities
  • Medical, dental, vision, and 401k
  • Positive and engaging team mentality with upward mobility opportunities #LI-KM1

