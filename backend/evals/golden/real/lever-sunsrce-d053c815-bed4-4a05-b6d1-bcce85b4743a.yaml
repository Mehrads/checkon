  District Sales Manager - Mobile Fluid Power
  Mississauga, Ontario L5N 2M2 / SunSource / Outside Sales & Sales Management

  SunSource and its family of companies represent 270+ locations and 4,000+ employees making up one of North America’s leading value-add industrial distribution companies.  We provide customers with products and value-added solutions within Fluid Power, Fluid Process, Fluid Conveyance, Automation, General Industrial Components, and Industrial Repair. www.sun-source.com


  Become a member of our sales leadership team with SunSource www.sun-source.com  a leading mobile fluid power distributor representing top quality manufacturers across the U.S.
  The District Sales Manager will direct all day-to-day sales activities and will supervise 6 account managers covering the province of Ontario.
  The mission of the DSM is to lead, motivate, develop, and coach the sales team to operate at peak productivity levels.

  Key Objectives
  • Developing a sales plan for the district, and for each account manager
  • Execution of sales plan, achieving growth objectives for new accounts, overall revenue, market share and margin improvement
  • Implement company’s strategic initiatives
  • Assess, coach and improve the sales team’s performance
  • Provide in-person sales coaching through joint customer visits
  • Manage supplier partner relationships
  • Assist with Inventory management and collaborate with customer service at the Branch in Mississauga

  Background & Experience
  • Bachelor’s degree preferred. Two-year technical degree is a minimum requirement.
  • 5+ years of experience within industrial sales, preferably in the mobile OEM space, with at least 3 years in Sales Management.
  • Experienced in selling value-add Mobile Fluid Power products
  • Proven ability to lead, motivate, develop and manage a technical sales group.
  • Ability to obtain productivity improvement, and to help account managers achieve higher sales levels.
  • P&L familiarity, including the ability to work with and/or produce budgets, forecasts, sales reports, etc.
  • CFPS / FPS certifications are a plus.

