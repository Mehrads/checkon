text: |
  Senior Product Manager
  Toronto, ON (Canada)

  We are a Canadian leader in digital automotive solutions. Our flagship brands — AutoTrader.ca, AutoSync, Dealertrack Canada and CMS — help Canadians buy, sell, and finance vehicles with confidence.

  Dealertrack Canada is the country’s top automotive financing portal, processing more than 6.5 million credit applications each year. Collateral Management (CMS) is a national tech solution that boosts lien and registration services, recovery services, and insolvency management solutions for Canadian Lenders

  As part of AutoScout24 group, Europe’s largest online car marketplace, we’re shaping the future of automotive retail in Canada and beyond.

  Join us on our journey as we bring together the best of Europe and North America to shape the future of automotive retail.

  Role Summary

  We’re looking for a Senior Product Manager to drive key initiatives within our fintech domain. Reporting into the Product Director, you will own the strategy, roadmap, execution, and performance of important product areas that support automotive lending, dealer workflows, and lender experiences across Canada.
  You’ll work closely with engineering, design, data, commercial teams, lenders, and partners to translate customer needs, business opportunities, and product performance signals into clear product direction and measurable outcomes. This is a highly visible individual contributor role with direct impact on company priorities, customer success, and the evolution of our fintech platforms.
  You’ll thrive here if you enjoy solving complex problems, operating in ambiguity, connecting customer, business, technical, and data perspectives, and rallying teams around a clear product vision. You bring a hands-on, experimental mindset — including a demonstrated ability to use AI tools across product discovery, research, analysis, story refinement, prototyping, and execution.

  What you'll do

  • Own the product vision, strategy, roadmap, and full lifecycle for a key product area within our fintech portfolio — from discovery through delivery and into long-term health
  • Own the numbers for your product area: define success metrics, understand performance drivers, monitor adoption and business impact, and use data to guide decisions and priorities
  • Partner with financial institutions, dealers, and internal stakeholders to understand evolving needs and ensure our platforms continue to support critical lending workflows
  • Lead discovery for complex problems, validating hypotheses through customer research, data analysis, structured experimentation, and market insight
  • Translate customer, partner, data, and business needs into clear product priorities, requirements, user stories, acceptance criteria, and technical context
  • Drive cross-functional execution with engineering, design, data, product marketing, sales, operations, and business teams to deliver high-impact products
  • Navigate complex stakeholder environments, integrations, workflows, and business constraints while making clear product decisions, even when data is incomplete
  • Clearly communicate product vision, strategy, roadmap decisions, product performance, and launch impact to executives, partners, and cross-functional teams

  What you'll need

  • 5+ years of product management experience in B2B SaaS, digital platforms, fintech, lending, automotive, CRM, dealer software, or other complex product environments
  • Proven experience owning product strategy, roadmap, execution, and outcomes for complex products or platforms
  • Strong data-informed decision-making skills, including defining success metrics, analyzing performance, sizing opportunities, and making tradeoffs based on customer, business, and product signals
  • Strong product fundamentals, including discovery, prioritization, story writing, acceptance criteria, roadmap planning, agile delivery, and go-to-market partnership
  • Ability to operate effectively in complex systems with multiple stakeholders, integrations, customer segments, workflows, and commercial considerations
  • Strong technical fluency and the ability to partner deeply with engineering teams as a trusted product counterpart
  • Demonstrated capability applying AI tools across product work — research, prototyping, analysis, story writing, prioritization, or workflow acceleration
  • Comfort with multi-level stakeholder management, including proactive communication with leadership, partners, and delivery teams
  • A collaborative mindset, strong accountability, and a track record of making the people and teams around you better

  About You
  Building the technology that powers automotive finance involves constant change, complexity, and ambiguity. We thrive on pushing limits and solving hard problems. Many people find that environment energizing, though it isn’t the right fit for everyone.
  Before you apply, consider whether you can:

  • Care deeply about the impact of the work you do
  • Continuously push yourself to learn and improve
  • Keep pace with an environment that moves quickly
  • Remain resilient and resourceful when problems are unclear or evolving
  • Bring clear thinking, strong opinions, and thoughtful debate to the table
  • Use AI effectively so you can focus on higher-impact work
  • Balance customer empathy, business impact, data, and technical feasibility
  • Respect different perspectives while challenging ideas to reach better outcomes

  What's in it for you

  We understand that there is life at work and life outside of work. Here are a few benefits we all benefit from that support us to be our creative best.

  • Gym discounts
  • Employee and Family Assistance program
  • Virtual wellness events
  • Conferences & training budget
  • Regular internal training programs
  • Financial planning with 3% matching pension
  • Competitive salary
  • Annual bonus structure

  Compensation

  The base salary range for this position is CAD 125K -145K.

  This range reflects the expected compensation at the time of posting. The final offer may vary and can be higher based on relevant skills, experience, location, and market conditions. Based on the role, the total rewards package may also include benefits, bonus, and other employee offerings.

  For a career where you can drive our business and shape your future, apply now.

