text: |
  Senior Manager, Admissions and Enrolment
  Toronto, ON

  Join one of Canada's fastest-growing universities as our Senior Manager, Admissions and Enrolment, where you will play a key role in leading student enrolment operations, supporting institutional effectiveness through technical transformation, and driving the successful execution of the university's strategic goals.

  About the Role

  The Senior Manager, Admissions and Enrolment is a key leadership role within the Office of the Registrar, responsible for overseeing admissions, enrolment, and student records operations while ensuring service excellence, compliance, and data integrity.

  Reporting to the Registrar, this role leads the Admissions and Enrolment team, drives operational efficiency through innovation, and supports strategic enrolment management through data-informed decision-making.

  Title: Senior Manager, Admissions and Enrolment
  Type: Full-Time, Permanent
  Department: Office of the Registrar
  Reporting to: Registrar
  Direct Reports: Admissions and Enrolment Officers
  Location: Toronto, Ontario (Hybrid)
  Existing Vacancy: Yes
  Compensation Range: $90,000 - $110,000 annually

  Why Join IBU

  Located in downtown Toronto, IBU is one of Canada's fastest-growing universities, offering a dynamic academic and professional environment driven by innovation, research, and academic excellence. By joining IBU, you will have the opportunity to shape and enhance the student experience, lead transformational initiatives, collaborate with academic and administrative leaders, and contribute directly to the continued growth and success of a rapidly evolving institution.

  What You'll Do

  • Lead the modernization and digital transformation of admissions, enrolment, and student records systems to improve efficiency, automation, data integrity, and service delivery.
  • Oversee end-to-end admissions, enrolment, registration, and student records processes, ensuring accuracy, compliance, and an exceptional student experience.
  • Manage key student lifecycle functions, including offers, deferrals, transfer credits, academic progression, withdrawals, leaves of absence, orientation, and graduation.
  • Develop data analytics, dashboards, and reporting frameworks to monitor enrolment performance, support decision-making, and drive continuous improvement.
  •

  Ensure compliance with institutional, provincial, and federal regulations while maintaining the integrity and security of student information.

  • Foster collaboration across Admissions, Recruitment, Finance, Academic, IT, and other departments to support enrolment objectives.
  • Oversee grade administration, academic appeals, accessibility accommodations, and the issuance of official student documentation.
  • Lead and develop a high-performing team while promoting accountability, innovation, operational excellence, and a culture of continuous improvement.

  This is a hybrid role based in Toronto, requiring in-person attendance as needed, including weekdays, evenings, and occasional Saturdays.

  What You Bring/Who You Are

  • Bachelor’s degree required; Master’s degree preferred in Education, Administration, Business, or a related field.
  • Minimum of seven (7) years of progressive experience in higher education administration, preferably in admissions, registrar, enrolment management, or student services.
  • Proven expertise in managing student information systems, enrolment workflows, and academic policy compliance.
  • Demonstrated proficiency in data analytics and reporting, with the ability to interpret data to support strategic planning, process improvement, and decision-making.
  • Strong leadership, communication, and problem-solving skills, with a demonstrated ability to foster collaboration across diverse teams.
  • Proven experience in managing complex projects, setting priorities, and meeting deadlines in a fast-paced environment.
  • Comprehensive understanding of accessibility, equity, diversity, and inclusion (EDI) principles in student support and institutional practices.
  • Skilled in stakeholder engagement, with experience preparing and presenting analytical reports and insights to inform senior decision-makers.
  • RCIC (Regulated Canadian Immigration Consultant) will be a strong asset.

  Additional Information

  To support the overall well-being and success of our employees, IBU offers a comprehensive Total Rewards package, which may include the following, based on role eligibility:

  • 100% employer-paid extended Health & Dental benefits
  • 24/7 access to an Employee and Family Assistance Program (EFAP) and virtual healthcare services
  • Life, Accidental Death & Dismemberment (AD&D), and Long-Term Disability insurance
  • Competitive paid time off, starting at three weeks
  • Tuition Benefit Program
  • Access to preferred corporate membership rates with GoodLife Fitness
  • Engaging employee appreciation and community-building events

  IBU is an Equal Opportunity Employer

  IBU is committed to fostering a diverse, inclusive, and equitable workplace where everyone feels welcome, valued, and respected. We are dedicated to the principles of equal opportunity and encourage applications regardless of race, religion, colour, national origin, gender, sexual orientation, age, marital status, or disability status. Please contact [email] if you require accommodation during the recruitment process.

  Application Process

  All applications are reviewed by our HR team. We may use AI tools to support certain stages of the hiring process and do not replace human judgment. IBU is committed to the responsible and fair use of AI in compliance with applicable laws.

  While we appreciate all applications, we regret that we can only contact those candidates selected for an interview. We thank all applicants for their submissions.
