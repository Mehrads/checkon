text: |
  IT Director
  Mississauga, ON / Full time (On Site)

  about us

  OTI Lumionics is developing advanced materials—by design—using quantum simulations, machine learning and real-world testing in pilot production. We are currently focused on key enabling materials for OLED displays that will be used in next-generation consumer electronics and automotive. Our advanced electrode materials, and associated manufacturing technology, are being used to build transparent displays and lighting. We work closely with our partners and customers to design new materials that are mass-production ready. Using our computational Materials Discovery Platform, we can rapidly iterate new materials, allowing fast turnaround time to meet our customers’ needs.

  Workplace type

  On-Site

  primary responsibilities

  Strategy & Leadership

  • Define and execute the IT strategy, roadmap, and governance framework aligned with business objectives
  • Act as a trusted advisor to leadership on technology investments, risks, and opportunities
  • Drive continuous improvement in IT service delivery and operational efficiency

  Infrastructure & Operations

  • Oversee design, implementation, and ongoing management of IT infrastructure (cloud, on‑prem, network, and endpoints)
  • Ensure high availability, performance, and scalability of systems supporting a growing and distributed workforce
  • Establish and enforce IT policies, procedures, and documentation standards
  • Direct IT service management practices (incident, change, and problem management)

  Security & Risk Management

  • Lead cybersecurity strategy, including risk assessments, vulnerability management, and user awareness programs
  • Ensure protection of systems through best practices, employee training, and phishing simulations
  • Oversee compliance with regulatory, security, and data protection requirements
  • Develop and maintain business continuity and disaster recovery plans

  Projects, Vendors & Innovation

  • Lead major IT initiatives, including system upgrades, migrations, and digital transformation efforts
  • Evaluate and implement new technologies, tools, and vendors to improve performance and cost-efficiency
  • Manage vendor relationships, contracts, and service delivery
  • Forecast, budget, and advocate for IT investments and resource planning

  Operations & Service Delivery

  • Oversee provisioning, configuration, and lifecycle management of hardware, software, and IT assets
  • Ensure efficient onboarding/offboarding processes and identity/access management
  • Support remote and in-office employees with reliable IT services and tools
  • Maintain asset inventory, licensing compliance, and procurement processes
  • Ensure regular system monitoring, patching, maintenance, and upgrades across all environments

  Health, Safety & Compliance

  • Promote secure, compliant, and sustainable IT practices
  • Ensure compliance with environmental policies, procedures, and objectives, and actively participate in the identification and reduction of environmental impacts related to the role
  • Adhere to health and safety protocols, report hazards, and contribute to maintaining a safe and healthy work environment for all employees
  • Other ad hoc duties as assigned

  profile

  • 10+ years of progressive IT experience, including infrastructure and operations leadership
  • Proven experience developing and executing IT strategy and managing enterprise environments
  • Strong background in cybersecurity, cloud platforms, and infrastructure management
  • Experience leading projects, vendors, and cross-functional initiatives
  • Bachelor’s degree in IT, Computer Science, or related field (or equivalent experience)

  required skills

  • IT strategy & governance
  • Infrastructure & cloud architecture
  • Cybersecurity & risk management
  • IT operations & service delivery
  • Vendor & budget management
  • Leadership, communication, and stakeholder engagement

  $105,000 - $175,000 CAD per year
