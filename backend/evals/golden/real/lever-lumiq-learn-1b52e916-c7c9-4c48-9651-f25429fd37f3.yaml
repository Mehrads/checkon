text: |
  Business & Finance Producer
  Toronto / Full Time Permanent

  At LumiQ, we’re on a mission to make professional education enjoyable. As a modern, audio-first learning platform, we empower accounting and finance professionals to fulfill their continuing professional development requirements through engaging podcasts. Over the past five years, we’ve cultivated a devoted customer base of over 1,000 corporate and accounting firms across North America.

  LumiQ is proud to be a 2025 Deloitte Fast 50 and Fast 500 winner. We’re creating awesome proprietary content, nailing our go-to-market strategy, and being the first to shake up the industry. In 2024 we secured a strategic investment from Vertu Capital to fuel our expansion globally and continue executing on our exponential growth plans.

  LumiQ is also a certified Great Place to Work! We’re all about transparency, ownership, innovation, and empathy. If you’re ready to make a real impact and help us transform professional education, we’d love to hear from you!


  We are looking for a Business & Finance Producer to help us disrupt the professional education industry and create the world’s best CPD content!

  This is not a traditional content or production role. Producers at LumiQ are trusted with a high degree of ownership and are expected to exercise strong judgment, independent thinking, and accountability from day one. At the same time, this role is deeply collaborative. Producers work closely with Editors, peers, and guest experts to pressure-test ideas, incorporate feedback, and elevate the quality of the final output.

  The role is best suited for individuals who are comfortable operating in ambiguous environments, contributing strong points of view, and engaging in thoughtful debate—where the best idea wins, not the loudest voice. Success in this role means owning outcomes while actively participating in a shared editorial standard and collaborative feedback process.

  This is a unique opportunity to work at the intersection of complex subject matter, education, and content creation. Producers play a critical role in translating expert knowledge into clear, engaging learning for accounting and finance professional, making complex topics accessible without oversimplifying them.

  Reporting to the Manager of General Education, the Business Podcast Producer is responsible for owning episodes end-to-end, from topic conception to final delivery, while ensuring content is accurate, engaging, and deeply relevant to our audience.
  Curious what this role actually looks like in practice? We made a few short videos that give you a real sense of the work, the team, and whether this could be your next move.
  The Accounting Career You Didn't Know Existed: https://vimeo.com/1195601547
  Check them all out:
  What Makes a Great LumiQ Producer: https://vimeo.com/1195613488
  What It's Like to Produce at LumiQ: https://vimeo.com/1195613487
  The Unexpected Part of Being a LumiQ Producer: https://vimeo.com/1195613489

  What You’ll Be Responsible For:
  Content Development:

  • Researching and pitching business topics aligned with LumiQ’s roadmapScoping episodes intentionally to balance depth, clarity, and audience relevanceIdentifying, outreach to, and coordinating subject matter expertsCreating interview prep materials and foundational research

  Hosting & Production:

  • Hosting interviews with senior business and finance professionalsGuiding conversations to ensure they are educational, engaging, and practical - This includes guiding experts toward clarity, asking follow-up questions that surface insight, and ensuring conversations remain accessible and valuable to the audience
  • Reviewing raw audio and making content-level edits
  • Writing episode copy, including descriptions, quiz questions, glossary terms, and visual aids

  Who You Are:
  • You are comfortable working across topics such as finance, economics, entrepreneurship, advisory, business ethics and emerging trends (e.g., AI in budgeting). You are not expected to be a technical expert, but you are expected to learn quickly, ask strong questions, and build enough understanding to guide expert conversations and produce accurate, audience-relevant content.
  • You are intellectually curious and driven to truly understand what you’re covering, you ask “why” until it makes sense, push past surface-level explanations, and are energized by learning across unfamiliar or evolving topics.
  • You are a fast, disciplined learner. When you encounter unfamiliar subject matter, you proactively close knowledge gaps, surface uncertainty early, and seek clarity before it becomes a risk to content quality.
  • You are a critical thinker. You use judgment to decide:

  ○ Which topics matter most

  ○ How deeply to cover them

  ○ How to structure content for maximum audience value

  • You are comfortable making decisions without step-by-step direction.
  • You are highly organized and able to manage many live projects at once. You set priorities independently, make trade-offs intentionally, and keep work moving without needing constant validation.
  • You take ownership by default. You anticipate issues, surface risks early, and come to your manager with proposed solutions, not open-ended questions.
  • You are confident in communicating complex ideas clearly and naturally, including hosting conversations with senior professionals.

  This Role Is Not for You If…
  • You prefer detailed instructions or clearly defined rules before taking action
  • You prefer executing tasks over owning outcomes
  • You are uncomfortable making decisions independently with incomplete information
  • You struggle to prioritize when managing many projects simultaneously
  • You are uncomfortable being on-mic or leading professional conversations
  • You are uncomfortable operating in ambiguity or fast-changing environments
  • You are uncomfortable spending time deeply understanding subject matter you are not already familiar with

  This is a judgment-heavy role by design. It is best suited for people who enjoy autonomy, accountability, and owning work end-to-end.

  If you think your experience is most of the way there, we’d still love to meet you!

  Please note this is a flexible hybrid role based out of Toronto, Canada. Employees will be expected to be able to commute to the office 2 times a week. However, for training & onboarding purposes, the in-office expectation time may increase.

  Benefits and Perks:
  Nomad policy: Work remotely 4 weeks of the year from anywhere in the world.
  Time Off to Recharge: Great vacation day offerings as well as uncapped sick and mental health days.
  Schedule flexibility: We know our employees have lives outside of work and don’t mind if you need to run to a mid-day doctor's appointment or pick up a kid early from school!
  Health Benefits: available after 3 months with us including medical, dental, vision and a yearly health spending account. RRSP matching after 1 year with us.
  Hybrid Work Style: The best of both worlds. Enjoy remote work and a downtown Toronto office with snacks, events, and ping pong.
  Quarterly & Holiday team social events: (Poker Night, Softball Tournaments, Summer Party, Halloween Party, Trivia & Paint Night are just a few examples of what we have done in the past).
  Endless Learning: Our platform isn't just for accountants. Listen to podcasts on soft skills, career development, leadership, and more.
  LumiQ Clubs: Join an existing club or start your own!

  $80,000 - $90,000 CAD per year

  Salary is based on a number of factors including market conditions, location and may vary depending on job-related skills and experience.
