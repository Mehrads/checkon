  Restaurant Enterprise Ad Sales Account Executive
  Toronto, ON

  About the Team

  The ad sales team is responsible for the advertising vision, development and growth of our largest advertising partnerships. This team is seeking additional team members to build an industry-leading ads and promotions business across DoorDash’s core category, enterprise restaurant brands. The growing DoorDash ads business will quickly become the single best place for merchants and brands to market to local customers, in an ecosystem that benefits all parties.

  You’ll leverage AI-powered insights, data-driven signals, and emerging tools to shape strategy, inform decision-making, identify opportunities, and drive growth across complex, enterprise-level engagements. By integrating AI and data-enabled analysis into day-to-day workflows, you’ll improve prioritization, execution, and business impact while partnering cross-functionally to translate evolving platform and AI capabilities into clear, tangible value for partners and the business.

  About the Role

  As an Enterprise Account Executive - Ad Sales, you will build partnerships that create tangible value for both DoorDash and advertisers. In this role, you will manage the ads strategy across a focused portfolio of accounts, and drive adoption of our growing ads and promotions offering. You will also work cross-functionally with account management, marketing, analytics, and product to innovate on our future approach and solutions. You will report into an Industry Manager, Restaurants within our Enterprise Sales & Business Development organization.

  You’re excited about this opportunity because you will…

  • Lead end-to-end advertising conversations across a portfolio of enterprise restaurant clients
  • Drive product/feature adoption, and ultimately grow advertiser value and sustainable revenue for DoorDash
  • Represent advertiser needs to influence our Ads & Promos product roadmap and go to market strategy
  • Manage a robust sales pipeline and create annual and quarterly plans to achieve ambitious goals
  • Co-develop pitch materials and processes to enable future scale of the team and business

  We’re excited about you because…

  • You are a consultative seller with 6+ years of experience in digital media
  • You’re an expert in using data and insights to inform recommendations, rooted in advertiser objectives and business priorities
  • You know the basics of digital ads measurement - from attribution to funnel metrics
  • You have strong written/verbal communication and presentations skills, and experience operating across several levels of an organization
  • You diligently manage a sales pipeline and can juggle both short- and mid-term impact
  • Nice to Have: You have experience working directly with restaurant advertisers or similar

  • Experience leveraging data, AI-informed insights, and emerging AI tools to drive strategic decisions, enhance productivity, and improve outcomes in complex business environments.
  • Strong ability to interpret AI-generated insights, synthesize them into clear, actionable recommendations and executive-level narratives, and influence stakeholders.
  • Baseline fluency in AI concepts, with a willingness to continuously learn and adopt new technologies as AI capabilities become increasingly embedded in workflows, products, and customer interactions.

  Compensation

  Actual compensation within the pay range listed below will be decided based on factors including, but not limited to, skills, prior relevant experience, and specific work location. Base salary is localized according to employee work location.

  In addition to base salary, the compensation for this role includes opportunities for equity grants and sales commission. Talk to your recruiter for more information.

  DoorDash cares about you and your overall well-being. That’s why we offer a comprehensive benefits package for all regular employees, that includes paid time off, paid parental leave, wellness benefit and several paid holidays.

  Additionally, for full-time employees, DoorDash offers medical, dental, and vision benefits, disability and basic life insurance, an RRSP including an employer match, and a mental health program, among others.

  To learn more about our benefits, visit our careers page here.

  The base pay for this position ranges from our lowest geographical market up to our highest geographical market within British Columbia.

  $120,000—$150,000 CAD

  The total on-target earnings (base + commissions) for this position ranges from our lowest geographical market up to our highest geographical market within British Columbia.

  $200,000—$250,000 CAD

  About DoorDash

  At DoorDash, our mission to empower local economies shapes how our team members move quickly, learn, and reiterate in order to make impactful decisions that display empathy for our range of users—from Dashers to merchant partners to consumers. We are a technology and logistics company that started by enabling door-to-door delivery, and we are looking for team members who can help us go from a company that is known as the place you order food to a company that people turn to for any and all goods.

  DoorDash is growing rapidly and changing constantly, which gives our team members the opportunity to share their unique perspectives, solve new challenges, and own their careers. We're committed to supporting employees’ happiness, healthiness, and overall well-being by providing comprehensive benefits and perks including premium healthcare, wellness expense reimbursement, paid parental leave and more.

  Our Commitment to Diversity and Inclusion

  We’re committed to growing and empowering a more inclusive community within our company, industry, and cities. That’s why we hire and cultivate diverse teams of people from all backgrounds, experiences, and perspectives. We believe that true innovation happens when everyone has room at the table and the tools, resources, and opportunity to excel.

  If you need any accommodations, please inform your recruiting contact upon initial connection.
  Beware of recruitment scams: DoorDash, Deliveroo, and Wolt will never ask you to pay money or share sensitive financial information during hiring — learn more about our legitimate recruiting process at Recruitment Scam Awareness - DoorDash .

