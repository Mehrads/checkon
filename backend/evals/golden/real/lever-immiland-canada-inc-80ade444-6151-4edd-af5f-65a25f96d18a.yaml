text: |
  Junior Lawyer
  Toronto / External / Full Time

  Immiland Law Professional Corporation is dedicated to assisting individuals in their journey to immigrate to Canada. We provide comprehensive guidance, analysis, and support through every stage of the immigration process.

  We are seeking a passionate and highly qualified Junior Lawyer to join our firm. The ideal candidate must be admitted to the bar of any Canadian province and should have up to 2/3 years of experience advising clients on Family law, Immigration law, Estate Law, Business Law, and federal court procedures for immigration judicial reviews. This role offers long-term growth opportunities based on performance, initiatives, and a sense of belonging.

  Requirements
  • Juris Doctor (JD) degree from an accredited law school.
  • Admission to the bar in any Canadian province.
  • Advanced level of English. (Speaking Spanish and/or French will be a plus).
  • 1-2 years of experience in Immigration law, Estate Law, Business Law and or Family law.
  • High level of organization.
  • Ability to handle different legal cases at the same time.
  • Ability to solve problems independently with high analytical thinking that adapts to the parameters of the company's values and objectives.
  • Good communication and professionalism between co-workers and clients.
  • Good computer skills. Use of software and technological programs for handling client documents and open to learn how to use new programs and systems.
  • Open to feedback and personal improvement.
  • Commitment to maintaining high ethical standards and confidentiality.

  Responsibilities
  • Assist in the preparation of cases related to Immigration law, Estate Law, Business Law and or Family law.
  • Do legal research and present findings to senior attorneys to support case strategy.
  • Draft and prepare legal documents with accuracy and detail.
  • Provide empathetic client support while maintaining confidentiality.
  • Attend court proceedings and mediations under the guidance of senior lawyers.
  • Stay informed and up-to-date of all changes and developments in Estate Law, Immigration law, Business Law and or Family law to ensure compliance.
  • Assist in reviewing and managing client files, ensuring information is current and accurately recorded.
  • Support legal staff on case preparation and management for efficient case progression.

  At Immiland, we offer a great opportunity to develop your career in a growing firm and a supportive, inclusive work environment that fosters professional growth.

  If you are interested in joining a dynamic and challenging team, this opportunity is for you!

  We look forward to welcoming your talent and experience to our team!
