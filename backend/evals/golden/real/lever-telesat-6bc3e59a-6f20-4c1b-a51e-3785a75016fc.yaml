  Document Control Coordinator
  Ottawa, Ontario / Lightspeed Program Delivery / Full Time Hire - (FTE with Benefits)

  Telesat (Nasdaq and TSX: TSAT) is a leading global satellite operator, providing reliable and secure satellite-delivered communications solutions worldwide to broadcast, telecommunications, corporate and government customers for over 55 years.  Backed by a legacy of engineering excellence, reliability and industry-leading customer service, Telesat has grown to be one of the largest and most successful global satellite operators.
  Telesat Lightspeed, our revolutionary Low Earth Orbit (LEO) satellite network, scheduled to begin service in 2027, will revolutionize global broadband connectivity for enterprise and Government users by delivering a combination of high capacity, security, resiliency and affordability with ultra-low latency and fiber-like speeds. Telesat is headquartered in Ottawa, Canada, and has offices and facilities around the world.

  The company’s state-of-the-art Satellite fleet consists of 12 GEO satellites, the Canadian payload on ViaSat-1 and one LEO 3 demonstration satellite.  For more information, follow Telesat on X and LinkedIn or visit www.telesat.com


  The Telesat LEO Lightspeed Document Control Coordinator will report to the Lightspeed Manager, Configuration Management & Change Control.
  The Document Control Coordinator plays a critical role in supporting mission assurance and program execution within Lightspeed Program. This position is responsible for the controlled management of technical and program documentation throughout its lifecycle, ensuring compliance with aerospace quality standards, configuration management principles, and customer/mission requirements.
  The Document Control Coordinator will require a good working knowledge of document and data management control processes and procedures with experience working with best practices standards such as CM2, ANSI-EIA 649, or ISO 10007 on complex, large to medium sized systems integration projects. The Document Control Coordinator will also require excellent organizational, language, writing and communication skills with intermediate to advanced proficiency using MS Office products (MS Word, MS Excel, MS PowerPoint).
  The role ensures that all documentation is accurate, traceable, audit-ready, and aligned with program baselines, supporting the successful delivery of high-reliability, mission-critical space systems.

  Main Responsibilities:
  The Document Control Coordinator will work with other Configuration & Data Management (CADM) team members and Lightspeed technical personnel in the following capacity:

  Review & Approval Workflow Coordination

  • Coordinate and monitor the document development process lifecycle from initiation to final approval for all internally developed Lightspeed documentation

  Technical Writing

  • Create and manage controlled templates aligned with program, customer (e.g., Telesat Lightspeed), and regulatory requirements
  • Guide engineering, systems, and program teams in the proper creation of technical documentation (e.g., specifications, ICDs, procedures, verification artifacts)
  • Develop, write, and edit technical documentation for the organization, which include manuals, procedures, specifications, and design documents
  • Edit and proofread content to ensure that documents are free of grammatical mistakes, technical inaccuracies
  • Ensure that documentation is compliant security requirements and applicable regulations
  • Apply consistent formatting and structure across all technical and program documentation
  • Ensure compliance with corporate branding and customer deliverable requirements
  Support audit readiness for internal reviews, customer audits, and regulatory assessments

  Document Numbering & Configuration Control

  • Maintain document configuration status, version control, and baseline integrity
  • Support configuration control processes and change management activities
  • Log and capture program documentation
  • Generate Release Notices as required to notify the Lightspeed Program of completed and approved documentation
  Assists in data searches for historical documents.
  • Document Control Coordinator will be cross-trained and expected to support other Configuration and Data Management functions
  Support continuous process improvement activities by identifying and driving improvements that will make the document control and configuration management processes more efficient, reliable, and cost effective.

  Education and Skills required:
  • Bachelor’s Degree, Library Information Science/College Degree in Information and Library Technologies related field or equivalent related experience.
  • 2–4 years of experience in document control, configuration management working on medium to large, complex development and systems integration project
  • Canadian Reliability Status (Minimum) is required
  • Eligibility for Controlled Goods Program (CGP) Registration is required
  • Ability to handle controlled, sensitive, and export-regulated technical data in compliance with Canadian and international regulations
  • Understanding of ITAR/EAR concepts or equivalent export control frameworks is considered an asset

  Key Competencies:
  • Familiarity with systems engineering documentation (e.g., requirements, design documentation, verification matrices, interface control documents)
  • Experience supporting formal program reviews (SRR, PDR, CDR, TRR, ORR)
  • Exposure to mission assurance or product assurance functions
  • Familiarity with configuration management and controlled document lifecycles in complex engineering programs
  • Strong attention to detail with a focus on traceability, compliance, and quality
  • Experience with document management tools (e.g., PLM systems, SharePoint, GCDocs)
  • Excellent organizational and communication skills
  • Exceptional language and writing skills
  • Intermediate to advanced proficiency using MS Office products (MS Word, MS Excel, MS PowerPoint)
  • Effective coordinator across engineering, mission assurance, and program teams
  • Ability to manage multiple deliverables under tight program schedules
  • Strong follow-through and accountability in review/approval workflows

  Decision making and Supervision:
  • This role has no direct reports, but will work and interact with multi-disciplinary engineering, contracts, legal, and commercial teams.

  Working Conditions:
  • Working conditions are typical of an office environment.

  The successful candidate must be able to work in Canada and obtain Reliability Status.

