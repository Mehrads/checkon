text: |
  Pelvic Health Physiotherapist
  10785 Leslie Street, Unit 303, Richmond Hill, ON L4S 0B2 / CLINICS — CANADA / Full-Time Contractor

  $5,000 Sign-On Bonus + Established Full Caseload
  This role is eligible for a $5,000 sign-on bonus. You’ll take over an established, full caseload, allowing you to make an impact from day one.

  Myo is modern physical therapy designed to FutureProof the body.
  Our mission is to raise body IQ globally by helping people move better, understand their bodies, and take a more proactive approach to their health.

  Our care model is built around a 5-phase FutureProof Framework:
  Decrease Pain
  Align & Repair
  Learn How to Move
  Build Strength
  Move With Purpose
  We believe pain relief is only the beginning. Our goal is to help clients create lasting functional change and to give clinicians a clear framework to deliver care with confidence and purpose.
  Why Myo?
  At Myo, clinicians get the time, structure, and support to do meaningful work.

  Mentorship & Growth
  Receive 70+ hours of structured onboarding and mentorship in your first 90 days.
  Advance your clinical reasoning, client communication, caseload development, and business skills through on-shift coaching and mentorship, reinforced by ongoing education, clinical workshops, and peer learning opportunities.
  Receive ongoing support from your Clinic Director and Lead Clinician as you build a sustainable caseload within our premium 1:1 care model.
  Access clear growth pathways into leadership, our Senior Clinician Program, and future clinic expansion opportunities as a Founding Team Member.
  Brand & Industry Exposure
  Get support from an in-house Marketing Team for community, brand, and partnership opportunities.
  Opportunity to represent Myo at major events and activations, including the LA Marathon, NYC Marathon, Erewhon, Lululemon SeaWheeze, and more.
  Select activations may include expense-covered travel.
  Premium 1:1 Care
  Treat fewer than 8 clients per day in a true one-on-one care model.
  Work with engaged clients focused on movement, performance, and proactive care.
  Practice in a collaborative clinical environment with ongoing case discussions and peer learning.
  Qualifications
  Degree from an accredited Canadian entry-to-practice physiotherapy program, or international physiotherapy education that meets Canadian credential assessment requirements.
  Current registration as a physiotherapist with the College of Physiotherapists of Ontario, or eligibility to obtain registration before starting practice.
  Pelvic health training and demonstrated clinical competence in pelvic floor assessment and treatment, including internal examinations.
  Rostered with the College of Physiotherapists of Ontario to perform pelvic internal examinations, or able to complete rostering before providing these services independently.
  Strong commitment to high-quality assessment, hands-on care, and movement-based treatment.
  Commitment to informed consent, patient comfort, privacy, and sensitive communication when providing pelvic health care.
  Interest in working within a collaborative multidisciplinary environment.
  Commitment to ongoing professional, clinical, and business development.
  Strong communication and relationship-building skills with clients and teammates.
  Compensation & Benefits
  A competitive fee split with opportunities for performance-based increases
  $1,000 in annual continuing education reimbursement, plus bonuses for successful team member referrals
  The option to begin with a structured monthly stipend for your first three months, giving you stability as you build your caseload before moving to our standard fee split
  Access to our Senior Clinician Program, a performance-based pathway that recognizes clinical excellence with a 20% increase in pricing for your services
  Complimentary staff treatment sessions, with your time paid
  Employer-paid mental health support through Homewood, our Employee Assistance Program
  Community discounts and partnerships with leading brands
