  Pharmacist - North Bay, ON
  North Bay, ON / Pharmacy / Full-time

  Practice Pharmacy the Way It Was Meant to Be Practiced

  Northern Shores Pharmacy is an independent community pharmacy built on clinical integrity,
  accountability, and long-term patient relationships.
  We are seeking a full-time pharmacist who takes pride in their profession, communicates directly, and
  wants to practice at a high level in a supportive, well-run environment.

  This role is ideal for a pharmacist who wants:
  • Autonomy with responsible ownership support
  • Time and staffing to do the job properly
  • A stable schedule and predictable workload
  • A team that shows up and pulls their weight
  • A workplace where professionalism matters

  What You’ll Do
  • Provide thoughtful medication counselling and clinical care
  • Build strong relationships with patients and prescribers
  • Deliver opioid agonist therapy services, including methadone
  • Provide minor ailment assessments and prescribing
  • Administer injections and clinical services
  • Identify and resolve medication-related problems proactively
  • Collaborate with a dependable technical support team
  • Contribute to continuous improvement of workflow and patient experience

  What Makes This Role Different
  • Independent pharmacy focused on patient outcomes, not retail quotas
  • Ownership that is engaged, accessible, and decisive
  • Modern workflow supported by experienced technicians and assistants
  • Predictable scheduling with respect for your time
  • A culture that values reliability, professionalism, and initiative

  Qualifications
  • Licensed Pharmacist in Ontario (Part A register)
  • Methadone/OAT experience or willingness to obtain authorization
  • Minor ailments prescribing training (or willingness to complete)
  • Strong clinical judgment and attention to detail
  • Clear, professional communication style
  • Comfortable working independently
  • Injection certification preferred
  • French language skills are considered an asset

  About Northern Shores Pharmacy
  We serve the North Bay community with a patient-first philosophy grounded in service, collaboration,
  and high-quality patient care.
  We are building a team of professionals who take pride in their work and support each other.

  $53 - $70 CAD per hour
