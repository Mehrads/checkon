  Estimator, Waterproofing
  Ottawa, ON / Flynn Group of Companies / Office Full-time

  At Flynn, it's not just a job, it's a career


  Estimator
  Waterproofing
  Flynn Canada Ltd
  Ottawa, ON

  “Fast paced, excitement of pursuit, rewarding, being part of amazing projects, visiting worksites, overall culture, endless opportunities, having the feeling of some autonomy”

  This is what our Estimators coast to coast, love most about working as an Estimator at Flynn!

  Here at Flynn, we are a family. We offer employment that is exciting, challenging and provide talented people with great opportunities. As the leading trade contractor in North America, our winning success is having the right people on our team.

  A Day in the Life

  ·         Complete take-offs/estimate or assigned projects
  ·         Follow up on multi-scope or single-scope projects
  ·         Attend pre-bid & post-bid meetings
  ·         Complete work orders & prepare material order sheets

  What We Are Seeking

  ·         1-2 years' experience in Construction Estimation
  ·         Bilingualism English/French is a must
  ·         Ability to read specs and drawings
  ·         Ability to work with tight deadlines
  ·         Post-secondary education in a Construction program
  ·         Architectural Technology
  ·         Construction Management
  ·         Construction Engineering
  ·         Great communication skills
  ·         General Building Envelope knowledge
  ·         Sales skills
  ·         Basics of AutoCAD

  What We Offer

  ·         Competitive wages and benefits
  ·         RRSP Matching
  ·         Great environment where our motto is "Flynn Family Winning Together!"
  ·         On-going career development programs through our in-house Flynn University and eLearning courses
  ·         In-house gym

  #LI-NT1
  CANOO

  Flynn Group of Companies is the leading trade contractor in North America that works on virtually every aspect of a building’s outer layer, including Roofing, Glazing, Waterproofing, and Architectural Metals. The foundation of our award winning success is having the right people on our team.
  Disclosure: We use an AI-powered system to initially screen resumes.  However,  all applications/resumes are also reviewed by our team of Human Resources and Talent Acquisition Professionals to ensure a fair and thorough evaluation in determining a candidate’s potential fit for a role they applied to.
  This posting is for an existing vacancy within the organization.
