  Immigration Consultant with ICCRC / IRCC License
  Toronto / External / Full Time

  Immiland Law Professional Corporation is dedicated to assisting individuals in their journey to immigrate to Canada. We provide comprehensive guidance, analysis, and support through every stage of the immigration process.

  Being in full growth within the company, we are looking for an Immigration Consultant, who wants to join our team full time. The consultant will represent clients through consultations and applications. This position seeks to contribute to the intellectual development of the consultant by offering long-term growth opportunities within the company based on personal and professional ambitions. This is a reflection of the consultant's work performance, initiatives and sense of belonging.

  Job Duties
  • Provide immigration consultations to clients. These consultations will seek to evaluate the client's profile and indicate the best immigration pathway for them, whether it be through study, work permits, express entry, etc.
  • Working on applications to be submitted to IRCC, this includes, filling out forms, drafting letters of motivation and presentation and compilation of documents that support the application to be submitted. Carrying out from start to finish each particular process for each client.
  • Keeping up to date with recent changes in Canadian immigration laws.
  • Application Monitoring.
  • Creating, maintaining and collecting all necessary information for each client in their immigration process.
  • Filling out electronic forms with client information, following ICCRC regulations.
  • Proactively participate in paralegal training.
  • High responsibility in following up with clients after consultations with the objective of closing contracts.
  • Be willing to participate in social media videos promoting Immiland Canada's team of consultants.

  Requirements
  • Advanced level of Spanish and English. (Speaking French will be a plus)
  • 1-5 years of experience in the field
  • High level of organization
  • Ability to handle different projects at the same time.
  • Ability to solve problems independently with high analytical thinking that adapts to the parameters of the company's values and objectives.
  • Good communication and professionalism between co-workers and clients.
  • Flexible and autonomous.
  • Willing to participate in youtube videos to attract clients and demonstrate confidence in the company.
  • Good computer skills. Use of software and technological programs for handling client documents and open to learn how to use new programs and systems.
  • Open to feedback and personal improvement.
  • Have a valid ICCRC / IRCC license

  Why work at Immiland Canada?

  - We are a young and growing company, open to work hand in hand with its employees to walk together to the global growth of all of us as a company.
  - We understand the needs of our employees and we adapt to them, offering a friendly and trusting environment.
  - Compensation is a direct reflection of the employee's contribution and growth in the company.
  - Immiland has immigration consultants with extensive knowledge and work experience in various areas of Canadian immigration.
  - Leverage Immiland Canada's exponential growth and massive audience, where you can access consistent clients.
  - Exposure to a myriad of complex immigration cases and scenarios, increasing the consultant's knowledge and experience in different areas of Canadian immigration as Immiland works with all types of immigration applications.
  - Access to company benefits such as private medical insurance, ICCRC credential payment (conditions apply), summer schedule, vacation and sick days paid, annual bonus, etc.
