text: |
  Integration Specialist
  Ottawa, Ontario / Network Operations - IT / Full Time Hire - (FTE with Benefits)

  Telesat (Nasdaq and TSX: TSAT) is a leading global satellite operator, providing reliable and secure satellite-delivered communications solutions worldwide to broadcast, telecommunications, corporate and government customers for over 55 years.  Backed by a legacy of engineering excellence, reliability and industry-leading customer service, Telesat has grown to be one of the largest and most successful global satellite operators.
  Telesat Lightspeed, our revolutionary Low Earth Orbit (LEO) satellite network, scheduled to begin service in 2027, will revolutionize global broadband connectivity for enterprise and Government users by delivering a combination of high capacity, security, resiliency and affordability with ultra-low latency and fiber-like speeds. Telesat is headquartered in Ottawa, Canada, and has offices and facilities around the world.

  The company’s state-of-the-art Satellite fleet consists of 12 GEO satellites, the Canadian payload on ViaSat-1 and one LEO 3 demonstration satellite.  For more information, follow Telesat on X and LinkedIn or visit www.telesat.com


  We are seeking a Senior hands-On Integration Engineer with 5+ years of experience designing, building, and managing complex enterprise-level integrations. This is a technical, code-heavy role where you will spend a significant portion of your time actively developing and implementing cloud-native integration solutions. You will leverage your deep expertise inAzure integration services alongside Python and/or Java to drive the interoperability of real-time and legacy systems.

  The ideal candidate will bring a deep understanding ofAPI integration, Secure Messaging, Event-Driven architecture, and Data Streaming across cloud platforms.

  Responsibilities
  •

  Hands-On Development: Design, code, test, and deploy integration solutions using Azure APIM, Logic Apps, Functions, and Service Bus.

  •

  Event-Driven & Streaming Build: Implement real-time data pipelines and event-driven architectures using Kafka.

  •

  API & Security Implementation: Build and secure robust APIs (REST) and enforce security standards (OAuth 2.0, JWT, API key management).

  •

  Architecture & Patterns: Apply Enterprise Integration Patterns (EIPs) for routing, transformation, and orchestration, ensuring high scalability and performance.

  •

  Collaboration & Troubleshooting: Partner with cross-functional teams to perform root-cause analysis, resolve production issues, and optimize system performance.

  Requirements
  • Bachelor’s or Master’s degree in Computer Science or a related technical field.
  •

  5+ years of total experience in enterprise application integration and related roles.

  •

  Core Azure Integration Expertise: Proven, hands-on configuration and development experience with Azure APIM, Logic Apps, Azure Functions, and Service Bus.

  • Mandatory Hands-On Coding: Strong programming background with production-level coding experience in Python and/or Java.
  •

  Event Streaming: Practical experience building event-driven systems with Kafka.

  •

  API & Security: Deep understanding of API design, gateways, and security mechanisms (OAuth 2.0, JWT).

  •

  Databases & Nice-to-Haves: Solid knowledge of relational/NoSQL databases (PostgreSQL, SQL Server, Redis, MongoDB). Hands-on experience with Databricks is a strong nice-to-have.

  #LI-RP1


  At Telesat, we take pride in being an equal opportunity employer that values equality in the workplace.  We are committed to providing the best candidate experience possible including any required accommodations at every stage of our interview process.   All qualified applicants that have been selected for an interview that require accommodations, are advised to inform the Telesat Talent team accordingly.  We will work with you to meet your needs.   All accommodation information provided will be treated as confidential.
