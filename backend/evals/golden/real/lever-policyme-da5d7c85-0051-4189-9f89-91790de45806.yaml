  Bilingual Licensed Insurance Advisor (Remote)
  Remote in Toronto / Full-time

  Overview of the role
  We’re on a mission to modernize insurance, making it simpler, more accessible, and customer-first. The insurance industry is a $1T market that has remained largely untouched by the digital revolution, and PolicyMe is here to change that. As a remote-first, Toronto-based startup with big ambitions, we’re looking for a Bilingual Licensed Insurance Advisor to help us build the future of insurance in Canada and beyond.

  On a typical day, you’ll be educating our customers on their insurance needs by answering challenging questions, dealing with advanced customer cases, and guiding them through our different products. You will be on the front lines of PolicyMe, managing all inbound leads through their policy applications, and ensuring they get the coverage they need (and feel good about the process) via phone, SMS and email.

  How it is different from a typical insurance advisor role:
  This is an opportunity to be part of a dynamic and rapidly growing startup, with opportunity for upward mobility. You’ll never have to prospect. All leads are inbound, qualified, and supported by a top-performing marketing and growth team. You'll be involved in discussions across the organization on how to streamline operations, improve the customer experience and help build innovative insurance products. Ride a wave of industry disruption, instead of fighting against it.

  Reports To: Customer Success Manager

  What you'll be doing:
  • Help prospective clients navigate life, critical illness, and health & dental insurance options using PolicyMe’s digital platform and your product knowledge
  • Speak with customers in both French & English to answer questions and guide them through the buying process
  • Manage a high-volume pipeline of 300–350 inbound leads each month
  • Use HubSpot to track conversations, follow-ups, and application stages
  • Recommend the right coverage based on customer needs, using a clear and honest consultative approach
  • Maintain high-quality service across phone, email, and SMS channels
  • Address customer questions related to their needs, product details, or how the insurance process works
  • Collaborate with teammates and team leads to help improve workflows and elevate the customer experience
  • Ensure every prospective customer receives the same honest, helpful, and human service PolicyMe is known for
  • Other duties as required

  Team alignment:
  • This role may fall under either the Sales or Retention team, depending on hiring priorities. Sales-focused advisors will help convert inbound leads into new customers, while Retention-aligned advisors will focus on renewals and supporting existing policyholders. Both tracks offer opportunities for impact and advancement.

  Why join us:
  • Bilingual in French and English, with strong written and verbal communication in both
  • Open to obtaining licensing in Quebec if not already licensed there
  • A licensed Life and Accident & Sickness insurance agent with a valid LLQP
  • 1 - 4 years of experience in insurance or a related industry
  • Experience managing a high-volume pipeline with strong organizational skills
  • A proven track record of exceeding sales targets in a consultative sales environment
  • Ability to manage objections and explain complex concepts clearly
  • A natural conversationalist who builds rapport easily and makes clients feel heard
  • High empathy and discretion, especially when speaking about personal or financial topics
  • Coachable and a strong desire to learn and improve
  • A growth mindset with the ability to adapt to change and contribute to continuous improvement
  • Ownership over your work and your pipeline
  • Alignment with PolicyMe’s values and commitment to putting the customer’s best interest first

  Please note: As a standard procedure for audit compliance, this position is subject to credit checks, background checks, and reference checks.

  Why join us:
  • Generous PTO - 20 vacation days
  • A comprehensive benefits plan with premiums paid in full by PolicyMe
  • Investment in your professional development, including an L&D budget, AI tooling budget, performance reviews twice a year and ongoing feedback to ensure you reach your highest potential
  • An extremely high performing, low-ego, remote-first team that is truly disrupting an old industry
  • Option to work from home or our Toronto-based office (bonus: we cover the costs to bring all our employees in-person twice a year for experiential socials!)
  • Access to stock options based on performance
  • Compensation: The total target cash compensation for this role (including OTE) is $88,000 with earnings potential up to $120,000 CAD. We’ll walk through the details together during the interview.

  About PolicyMe
  At PolicyMe, we are Canada’s leading digital insurance solution, offering straightforward and affordable financial protection for families from coast to coast. Our product suite includes Life Insurance, Critical Illness Insurance, and Health & Dental Insurance, all tailored to Canadians' evolving needs. We also offer B2B2C solutions, partnering with organizations to provide seamless digital insurance options. Founded by a team of insurance experts and technology entrepreneurs, PolicyMe is committed to making insurance simpler and more accessible. Since our launch in 2018, we have grown exponentially, selling over $10 billion in insurance coverage to Canadians.

  We are proud of the team we’ve built and are excited for those that are yet to join us. We operate with a remote-first culture, attracting top talent from across Canada. If you’re looking for a fast-paced, collaborative environment, working alongside incredibly ambitious yet humble humans, we may be the right place for you! To learn more, visit www.policyme.com.

  Additional Notes
  - Job Vacancy: This role reflects growth in our team and expanded operational scope. We’re hiring to support increasing demand and continue delivering an exceptional customer experience.
  - Commitment to Equal Opportunity: PolicyMe is an equal opportunity employer. We welcome applicants of all backgrounds and provide fair consideration regardless of race, colour, religion, sex, sexual orientation, gender identity, national origin, or disability.
  - Accessibility Statement: We are committed to providing an accessible hiring experience. If you require accommodations during the application process, please indicate this in the “Additional Information” section of your application.

  We thank all applicants for their interest, however, only those selected for an interview will be contacted.
