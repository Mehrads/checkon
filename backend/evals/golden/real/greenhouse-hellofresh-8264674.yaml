  Associate Strategy Manager, Produce Execution
  Toronto, Ontario, Canada

  We are seeking an experienced procurement professional to join our Procurement team as an Associate Strategy Manager, Produce Execution. In this role, you will be responsible for facilitating smooth collaboration between our Procurement Strategy and Operations teams specific to our Factor business. As a liaison for both the strategy and operations teams, you will be supporting external strategic partnerships while strengthening our operational excellence. Your key responsibilities will be partnering with our Strategy Managers and Buyers to execute inventory strategies, managing the SKU retirement process, owning inventory outlook and risk analyses, and troubleshooting supply chain issues with our operations teams. You will partner closely with key cross-functional teams including Procurement Operations, Menu Planning, Product Validation, and Finance.

  You will...

  • Communicate effectively between Buying and Strategy teams to meet business goals and solve for day-to-day operational issues, reporting on supply chain progress and procedural efficiency
  • Develop and execute an overarching inventory strategy by region and SKU working closely with Strategy team and Buyers to ensure strict adherence to threshold model, par levels, and JIT manufacturing requirements
  • Collaborate with cross-functional teams to ensure prompt and accurate onboarding of new ingredient SKUs
  • Manage communications and relationships with suppliers, ensuring alignment on needs, expectations, and day-to-day performance
  • Monitor weekly stock levels and allocation plans to ensure successful operational execution of strategy
  • Manage SKU retirement process
  • Work with both internal and external stakeholders to monitor and manage aging inventory

  You are…

  • A problem solver - A creative problem solver with a process improvement mindset
  • Data-driven - You can organize, explore, and synthesize unstructured data into actionable insights to better inform operational decision-making
  • Detail-oriented – You possess strong organizational skills and consistently demonstrate a methodical approach to all your work
  • A project manager - You have exceptional project and people management skill
  • A self-starter – You are highly motivated and passionate; you’re eager to take on new projects without knowing exactly what you will uncover
  • A team player- You have experience working effectively in teams and prioritize collective goals over personal accolades
  • Agile – You thrive in fast-paced and dynamic environments and are willing to get deep into the weeds where needed
  • A strong communicator - who can easily communicate complex solutions cross functionally and to upper management

  You have...

  • 3+ years of experience in procurement/sourcing/ supply chain operation, with relevant experience in Food, or CPG Industry experience
  • Undergraduate degree in Business, Supply Chain, Finance, or other relevant area of study
  • Fluent in Microsoft Office and Google Suite applications (especially Google Sheets)
  • Tableau and Project Management experience is a plus

  You’ll get…

  • Competitive salary, 401k with company match that vests immediately upon participation
  • Generous PTO, including sabbatical, and parental leave of up to 16 weeks
  • Comprehensive health and wellness benefits with options at $0 monthly, effective first day of employment
  • Tuition reimbursement for continuing education (upon 2 years of service)
  • Up to 85% discount on subscriptions to HelloFresh meal plans (HelloFresh, Green Chef, Everyplate, and Factor_)
  • Access to Employee Resource Groups that are open to all employees, including those pertaining to BIPOC, women, veterans, parents, and LGBTQ+
  • Inclusive, collaborative, and dynamic work environment within a fast-paced, mission-driven company that is disrupting the traditional food supply chain

  This job description is intended to provide a general overview of the responsibilities. However, the Company reserves the right to adjust, modify, or reassign work tasks and responsibilities as needed to meet changing business needs, operational requirements, or other factors.

  You'll get...

  • Box Discount - Amazing discounts on 1 box per week! 75% discount on weekly HelloFresh and Chefs Plate meal kits AND 50% off weekly Factor meal box.
  • Health & Wellness - Health & Dental benefits from day 1, a Health Spending Account, unlimited access to the Headspace app to meet your self-care needs, and 25% discount on GoodLife fitness memberships!
  • Vacation & PTO - Time off is also an important part of self-care! We offer generous vacation and PTO to help you create a good work-life balance.
  • Family Benefits - A parental leave top-up program for expectant parents.
  • Growth & Development - We support your career progression, provide development opportunities, and invest in your continued learning through our organization wide L&D fund.
  • Work Hard & Have Fun - From team socials to engaging company days, you’ll have plenty of opportunity to experience the fun!
  • Diversity & Inclusion Initiatives - With impactful ERG’s like FreshPride, Women Empowered and LIMES, we are committed to our diversity, equity & inclusion efforts.
  • Food Puns - this one is kind of a big dill if you haven’t already noticed. We even have some punny meeting room names!

  Flexible Hybrid Approach

  At HelloFresh, we know that flexible work arrangements are essential in enabling you to do your best work, while balancing your personal and life needs. Offering remote work flexibility, along with the opportunity to interact and collaborate in the office are all a part of creating a great employee experience.

  To meet these needs, we are pleased to provide Flexible Hybrid work. Flexible Hybrid is a people-first approach that is based on choice, trust, personalization, and empowers teams to choose when and how often they work from the office and work from home, in addition to team days and company days. This means a minimum of 2 days in office per week, with most teams in office between 2-3 days a week.

  #LI-HYBRID

  Working Conditions

  It’s no surprise that as a food company, we use many ingredients that may be considered common allergens (i.e. peanuts, tree nuts, milk, etc.). Whether this role is based out of our headquarters or one of our distribution centers, it is possible that you may be exposed to such allergens in this role. If you have any concerns with being exposed to any particular food ingredients, including meat, please disclose this during the hiring process.

  Interested in joining the HelloFresh team? Don’t be chai, apply! Submit your application in PDF format today.

  Toronto, ON Pay Range

  $71,000—$81,000 CAD

