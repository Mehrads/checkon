  Frontend Developer, Intermediate (Remote Canada)
  Toronto, Ontario / HDP / Full Time

  Working for a company like Smile Digital Health means supporting our mandate for #BetterGlobalHealth. We strive towards this goal every day, and the results can be seen in the impact of our innovative health data platform and data management solutions, which are used in over 20 countries.  We were #19 on Deloitte's Technology Fast 50 Ranking for 2024!

  Smile Digital Health makes it easy for healthcare stakeholders to collect and exchange data with our leading FHIR-based data liberation platform.

  At its heart, the Smile platform enables people and organizations to better manage healthcare data.  We help generate and liberate structured healthcare data to ensure effective delivery across care teams and health systems bringing  #BetterGlobalHealth to patients everyday!

  Apply today and find plenty of reasons to SMILE!


  The Intermediate Front End Developer is a technical role that supports building and maintaining the user-facing aspects of Smile Digital Health’s Clinical Intelligence platform. This role enables a seamless user experience by translating design concepts into functional technical roadmaps and developing a functional, interactive and intuitive user interface. This role will collaborate closely with cross-functional teams to gather requirements, design and implement applications and test components of the system.

  Responsibilities:
  • Support in shaping the approach, scope, milestones, and solution design of a responsive, performant and scalable user interface for assigned modules and features.
  • Work closely with the development team(s) to implement solutions by writing code, creating components and modules that meet development requirements.
  • Write comprehensive and manageable code and unit tests as well as develop and maintain relevant documentation for front-end components. Participate in rigorous testing cycles and defect resolution.
  • Develop and maintain a deep understanding of the functionality being developed to provide support to the team.
  • Lead architectural design discussions with regards to Angular front-end designs and help mentor/coach other developers in learning these best practices.
  • Contribute and adhere to team/department coding standards to ensure consistency.
  • Attend and participate in client meetings, as required.
  • Lead and engage in detailed and in-person code reviews, pair-programming and collaborative problem analysis with teammates.
  • Participate in monthly Technology meetings to help guide corporate technical processes, architecture, and strategy.

  Requirements:
  • 5+ years of software development experience with Angular, JavaScript/Typescript, HTML, CSS and Git.
  • Experience in the healthcare and/or technology industry preferred.
  • Bachelor’s degree in computer science, engineering, or equivalent and/or equivalent work experience.
  • Demonstrated experience with building apps using Angular and having an in-depth understanding of core concepts including, but not limited to, state management/ observables/interceptors/routing, etc.
  • Familiar with agile and scrum processes.
  • Excellent written and verbal communication that ensures effective collaboration and clear documentation.
  • Experience with Slack, Google technologies, Figma, Jira, GitLab, Postman, Microsoft Azure, Jasmine/Karma, Cordova/Ionic, REST APIs, Bootstrap, preferred.
  • Experience with CI/CD pipelines, Docker containers and networking, preferred.
  • Knowledge or experience in healthcare, HL7/ FHIR is an asset but not required.

  Smile discloses that artificial intelligence (AI) may be used in portions of the recruitment and selection process, such as resume screening or application assessment. All hiring decisions are ultimately made by qualified human decision-makers, and AI tools are used to support — not replace — fair and equitable hiring practices.
  This position is a replacement role, created to support Smile’s continued growth and commitment to operational excellence.


  Some of the benefits we offer:
  * Remote Work Environment
  * Flexible Time Away From Work Policy including PTO, Personal and Sick Days
  * Competitive Salary and Health/Medical Benefits
  * RRSP/TFSA/401K Employee Contribution
  * Life and Disability
  * Employee Assistance Program
  * FHIR Study Program and Skillsoft Learning
  * Super HAPI Fun Club

  Smile's core values include respect, inclusion, embracing our differences, and celebrating shared values because our people are the foundation of our success. We are big on creating a sense of belonging and empowering each other to bring our authentic selves to work.  We are dedicated to fostering a workplace that values diversity, equity, and inclusion.

  We welcome and encourage candidates of all backgrounds to apply. Candidates are encouraged to inform us if they wish to discuss or require accommodations during interviews or while working at Smile.

  $90,000 - $100,000 CAD per year
