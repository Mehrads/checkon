text: |
  Early Childhood Educator
  Ontario / External / Full Time

  Are you passionate about early childhood education and looking to make a meaningful impact in young learners’ lives? A recognized Childcare Centre in Port Elgin, Ontario, is currently seeking a dedicated and enthusiastic Early Childhood Educator (ECE) to join their growing team.

  If you love creating engaging, nurturing environments for children—this opportunity is for you!

  Requirements :
  • Registered Early Childhood Educator (RECE) with the College of Early Childhood Educators (Ontario) – mandatory
  • Valid CPR and First Aid certification
  • Up-to-date immunizations and two-step TB test
  • Vulnerable Sector Police Check
  • Proficiency in English (required)
  • French is not required
  • Secondary school diploma (preferred)
  • Previous experience in childcare or early education settings
  • Excellent verbal and written communication skills
  • Organizational and time-management abilities
  • Tech-savvy for basic administrative tasks
  • Adaptable teaching strategies based on individual learning needs

  Responsibilities :
  • Create a warm, inclusive, and stimulating environment for young children
  • Develop and implement age-appropriate lesson plans aligned with curriculum goals
  • Promote emotional, social, cognitive, and physical development
  • Provide individualized support based on each child’s needs
  • Build positive and professional relationships with children, parents, and staff
  • Monitor and assess each child's development and communicate progress to families
  • Collaborate with fellow educators to foster a cohesive learning experience
  • Maintain records, attendance, and reports using computer software

  If you're passionate about making a difference in early childhood education, we'd love to hear from you.
  Please submit your resume and only shortlisted candidates will be contacted.
