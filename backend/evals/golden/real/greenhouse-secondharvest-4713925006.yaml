text: |
  Human Resources Business Partner
  Etobicoke

  Elevate Your Career and Impact at Second Harvest

  Location: Etobicoke, ON

  Date: September 2026

  Department: Human Resources

  Reports to: Director, Human Resources

  Status: Full-Time (Existing vacancy)

  Salary: $75,000-$85,000 Per Annum Plus Benefits

  Work Type: Hybrid

  Time Required on Site: [60%] (approximate)

  The Opportunity Awaits—Where Passion Meets Impact!

  Second Harvest is Canada’s largest food rescue organization and the expert in perishable food recovery. We rescue surplus, unsold food from across the supply chain and redistribute it to non-profits across the country to feed communities. Demonstrating our values of Innovation, Impact and Integrity, we strive for No Waste. No Hunger.

  If you are ready to bring your expertise and innovation to a mission-driven organization, this is your moment.

  Enter Second Harvest…

  Think we're just about redirecting food surplus? Think bigger.

  Here's why Second Harvest is your next career leap:

  • Pioneers in food rescue, we are a renowned leader in perishable food redistribution across Canada.
  • With a mission fueled by a no-waste, no-hunger ethos, we're not just changing the game—we're rewriting the rules.
  • Our strategic approach aligns with the United Nations’ Sustainable Development Goals (SDGs), making every day a step towards global change.

  The Role:

  The HR Business Partner serves as Second Harvest's primary advisor to managers and leaders on people-related matters, while leading employee relations, performance management, policy and compliance, manager coaching, compensation support, talent initiatives, and strategic HR projects that enhance organizational effectiveness and employee experience.

  Your Impact:

  • Partner with senior managers and managers to align people strategies, workforce plans, and talent priorities with departmental and organizational objectives.
  • Provide coaching and guidance to leaders on performance management, employee engagement, leadership effectiveness, conflict resolution, and people decision-making.
  • Lead employee relations matters, including investigations, workplace conflict, performance concerns, corrective action, accommodations, disability management, and return-to-work programs.
  • Deliver the annual performance management cycle, including goal setting, calibration support, manager training, and completion tracking.
  • Support talent reviews, succession planning, workforce planning, and internal mobility initiatives.
  • Manage recruitment activities, partnering with hiring managers on recruitment strategies, candidate selection, workforce planning, and hiring decisions while ensuring a positive candidate experience.
  • Lead employee engagement initiatives and feedback programs, including employee, candidate, and hiring manager surveys, and develop action plans based on results.
  • Develop, implement, and maintain HR policies, programs, and procedures, ensuring compliance with employment legislation and organizational standards.
  • Support the review and maintenance of employment offers, employment documentation, and termination templates across Canadian jurisdictions.
  • Conduct compensation analysis, market benchmarking, salary structure reviews, and support compensation cycles, pay equity initiatives, and total rewards programs.
  • Provide HR analytics and workforce insights to support decision-making, identify trends, and drive continuous improvement.

  Who You Are:

  • HR Professional: You possess broad knowledge of core HR disciplines, including employee relations, compensation, performance management, health and safety, and DEI. You provide sound HR guidance and consistently model Second Harvest's values and culture.
  • CHRP or CHRL designation, or the ability to obtain certification within one year of employment.
  • People-Focused: You build strong relationships and create positive employee and leader experiences through effective communication and partnership.
  • Collaborative: You work effectively across teams, balancing competing priorities with professionalism, diplomacy, and a solutions-oriented approach.
  • Agile: You adapt quickly to changing priorities and are comfortable working in a fast-paced, evolving environment.
  • Service-Oriented: You deliver responsive, practical support and communicate effectively with employees and leaders at all levels.
  • Demonstrated experience managing employee relations matters, including investigations, performance issues, and workplace conflict.
  • Strong knowledge of employment legislation, HR policies, and compliance requirements, with the ability to interpret and apply them effectively.
  • Strong understanding of organizational structures, workforce planning, compensation practices, and people programs.
  • Proven ability to lead or support HR projects, process improvements, and organizational change initiatives.
  • Excellent verbal and written communication, interpersonal, coaching, and facilitation skills.
  • Strong analytical, problem-solving, and decision-making capabilities, with the ability to leverage data and insights to inform recommendations.
  • Highly organized with strong time-management skills and the ability to manage multiple priorities and meet deadlines.
  • Maintains the highest level of professionalism, discretion, and confidentiality when handling sensitive information.
  • Proficient in Microsoft Office Suite, HRIS platforms, reporting tools, and other HR technologies, with strong digital literacy.

  A Robust Compensation Package

  • A competitive salary paired with a robust benefits package.
  • Comprehensive group insurance (health, dental, life, AD&D and Long-Term disability)
  • Employer match contributions (3%) to a Defined Benefit Pension Plan.
  • Employer match contributions (up to 4%) to a Group Retirement Savings Plan.
  • Access to parental leave top-up.
  • 4 weeks of annual vacation & 1 additional day per year of service (max 30).
  • 10 paid sick days & 3 personal days.
  • Summer Half-Days to further extend long weekends & Winter holiday closure.
  • Access to an Employee and Family Assistance Program.
  • Professional growth in a role that makes a real difference.
  • Flexible work hours and a commitment to work-life balance.

  Apply For This Role:

  Ready to lead at the forefront of food security and sustainability? Join us at Second Harvest and be part of a team that's not just meeting the standard but setting it. Apply today and be the change you want to see in the world.

  Second Harvest uses AI tools to assist with application screening. We monitor these tools to reduce bias and ensure fair evaluation based on skills and qualifications.

  Commitment to Equity, Diversity, and Inclusion:

  Second Harvest is committed to fostering a diverse and inclusive work environment. We strongly encourage applications from all qualified individuals, especially those from equity-deserving groups, including racialized persons/persons of color, Indigenous peoples, women, persons with disabilities, and members of the LGBTQ2S+ community.

  Accessibility & Accommodations:

  If you require any accommodations at any stage, please contact us via [email] and we will work with you to meet your needs.
