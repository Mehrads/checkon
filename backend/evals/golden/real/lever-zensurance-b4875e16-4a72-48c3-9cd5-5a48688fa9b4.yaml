text: |
  Senior Business Operations Manager
  Toronto, ON / Strategy and Operations / Full-time

  About Us:

  Zensurance is redefining commercial insurance for Canadian businesses.

  As a leading InsurTech, we make getting the right coverage simple, fast, and accessible through a digital-first experience. Our platform combines advanced technology with deep industry expertise to deliver tailored insurance solutions that help businesses thrive.

  Zensurance has been recognized for its rapid growth and industry impact:

  ✅ Deloitte’s Technology Fast 50 (2023, 2024, 2025)
  ✅ Deloitte’s Technology Fast 500 (2024, 2025)
  ✅ Top Insurance Employers (2022)


  At Zensurance, we value ownership, collaboration, and innovation. Our team thrives on solving complex challenges, challenging the status quo, and making a real impact in an industry ready for change.

  If you're looking to build something meaningful in a fast-growing, customer-focused company, we’d love to hear from you!


  As a Senior Business Operations Manager, you'll be a key player in shaping our strategy and driving our growth. We're driven by data, passionate about our users, and always pushing boundaries.

  In this role, you’ll collaborate with executives and colleagues across departments to execute high-impact projects, own critical reporting (including company-wide dashboards and sales performance tracking), and tackle complex challenges through insightful analysis.

  Reporting to the Business Operations Lead, you'll work closely with leadership to connect our business model and forecasts, ensuring we're on track to achieve ambitious goals. Your analytical skills will be essential in measuring our success and optimizing our execution.

  This senior, collaborative role requires a strategic mindset, deep operational excellence experience, and a heavy focus on using data and partnership to continuously improve sales outcomes.

  Please note: This is a remote-first role, meaning you can primarily work from home, but should expect to join us in the office (Located in the GTA) occasionally for high impact meetings and team events. Our BizOps team really values that in-person collaboration!

  What Success Looks Like:
  • Drive Company Performance: Contribute directly to achieving key company targets.
  • Deliver Impact: Lead large-scale projects with measurable outcomes.
  • Master Analytics: Provide insightful data-driven recommendations.
  • Ensure Operational Excellence: Own key operational and reporting processes.
  • Be a Go-To Resource: Provide strategic support and guidance to colleagues.
  • Build Strong Relationships: Foster collaborative partnerships across the organization.

  Responsibilities:
  • Lead Key Projects: Own end-to-end projects across multiple departments, from identifying problems and developing work plans to managing stakeholders and driving successful implementation. Projects include Sales Excellence initiatives, NPS launch, new feature rollouts.
  • Influence and Collaborate: Partner closely with sales teams to create and implement strategies that elevate overall team effectiveness and efficiency.
  • Manage Change: Effectively drive adoption of new processes and initiatives across the organization.
  • Conduct Strategic Analyses: Utilize data from Excel, Looker, and Salesforce, combined with qualitative insights (interviews, workshops) to inform strategic decisions.
  • Coach and Mentor: Guide and develop colleagues, fostering their analytical and problem-solving skills.
  • Own Operational Processes: Manage critical operational tasks and contribute to long-term solutions.
  • Become a Technical Expert: Develop a deep understanding of our data, systems, and technical infrastructure.

  Qualifications:
  • University degree in an analytical field (Business, Engineering, Finance).
  • 7+ years of experience in strategic consulting, corporate strategy, or similar roles.
  • Proven ability to solve problems, think critically, and deliver impact.
  • Experience with change management and solution implementation.
  • Comfortable working in ambiguous environments and taking ownership of complex challenges.
  • Excellent communication and stakeholder management skills.
  • Strong judgment, maturity, and ability to execute independently.
  • Growth mindset and a passion for continuous learning.

  Benefits & Perks at Zensurance:

  At Zensurance, we know that when our people thrive, so does our business. That’s why we offer a flexible, people-first work environment designed to support your well-being, growth, and success.

  💻 Work Your Way

  • Remote-first setup for added flexibility
  • Home office allowance to create a comfortable workspace
  • Top-tier tech: "Office in a box" with all necessary tech equipment
  • Half days before public holidays: Enjoy half days before long weekends

  ❤️ Your Health, Your Way

  • Flexible health and dental plans for families, including mental health support
  • Health & personal spending accounts to invest in wellness your way
  • Parental leave top-up, because family comes first

  🚀 Investing in Your Growth

  • Education assistance reimbursement for courses, conferences, books, and memberships
  • Opportunities to learn from industry experts and grow your career

  🤝 Staying Connected

  • Weekly Friday huddles to share updates and connect across teams
  • Virtual & in-person team-building events to strengthen our culture

  We’re building something special. Come be a part of it!

  AI Tools and Your Interview:

  We know AI is a valuable tool, and you're welcome to use it to prepare for your interview. However, please don't use AI assistants during the live interview itself. We want to have an authentic conversation with you, and using AI during the interview could affect our evaluation of your suitability for the role.

  Just so you know, we use an AI scribe to help us take notes and review interviews, ensuring a fair and clear process.

  Diversity & Inclusion:

  Zensurance celebrates diversity and is committed to creating an inclusive environment. We welcome applications from all backgrounds and provide accommodations throughout the hiring process. If you need support, let us know, we’re here to help.

  $115,000 - $135,000 CAD per year

  The salary range for this role is $115,000 to $135,000, not including the annual discretionary bonus and any additional performance-based incentives.

  The annual base salary range provided for this position is a nationwide market range and represents a broad range of salaries for this role across the country. The actual salary for this position will be determined by a number of factors, including the scope, complexity and location of the role; the skills, education, training, credentials and experience of the candidate; and other conditions of employment. As part of our comprehensive compensation and benefits program, employees may also be eligible for performance-based case incentive awards.
