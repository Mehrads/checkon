text: |
  Account Executive
  Toronto

  About Owner

  Owner is the AI-native system local business owners use to succeed, starting with restaurants.

  We’re building the system that replaces the many tools owners use to run their business.

  It powers everything from the restaurant’s website, online ordering, CRM, POS, and more.



  Product philosophy

  Most small business software makes owners do the work to get what they want: sales growth and profit growth. Owner does the work for them agentically.

  Our system drives demand, converts it, and helps operators run their business day to day. As it improves, the business improves with it.

  Using Owner should feel like having a team of great operators, engineers, and marketers working for you.



  Our vision



  We’re starting by helping independent restaurants succeed online.



  But it’s not just restaurants that need our help. Most local businesses are struggling with these same problems. Huge technology corporations are taking their customers, bleeding their profits, and making it hard for them to survive.



  Once we nail the solution for restaurants – we’ll scale it into every other local business type.



  In the future we envision, tens of millions of local business owners will use our technology to succeed in the digital age.



  Our traction



  Since 2020, we've generated tens of millions in revenue and processed over a billion dollars of online orders. 1 in 5 Americans have used an Owner.com http://Owner.com website.



  More importantly, we’ve helped over 20,000 restaurant owners, and saved them nearly $200 million in fees.



  Our team



  Our team is now in the low hundreds. We’ve got top talent from the most successful companies in SMB software, including: Shopify, HubSpot, DoorDash, ServiceTitan, Rappi, Faire and Stripe.



  We’ll be scaling even faster in 2026 to keep pace with our customer growth.



  Where we work



  Owner is a remote-first, global company headquartered in San Francisco, with a sales hub in Toronto. For a few of our roles we prioritize in-person collaboration at one of our office locations. Most of our teammates are distributed throughout the globe. Please review the role description and discuss with your recruiter for more details on location!





  Why we're looking for you



  We are looking for an Account Executive to join our growing sales team. This role is best suited for people who are passionate about helping small businesses grow, have a track record of sales excellence and are committed to building trusting relationships with restaurant owners.



  At Owner.com http://Owner.com, we believe in collaboration and connectivity. That’s why we take a hybrid approach, our Account Executives work out of our Toronto office 3 days per week on our core anchor days (M,W,F). This balance allows our team to build strong in-person connections while maintaining flexibility and focus.



  Note: We serve a significant Spanish-speaking customer base. Professional fluency in Spanish is strongly preferred and will be prioritized in our selection process.



  The impact you'll have



   - Become an expert in our product and the industry so that you can advise restaurant owners in a high-trust manner.

   - Collaborate with restaurant owners to align their goals and objectives with our product capabilities.

   - Sell on value and return on investment (ROI) vs. technical functionality

   - Build and maintain a strong sales pipeline alongside the XDR team.

   - Collaborate closely with our onboarding team to deliver a seamless launch of product to our clients.

   - Educate yourself daily by reading, listening to podcasts, and learning from your teammates and peers.

   - Go above and beyond delivering and exceeding your quota to help your teammates and the company succeed.



   What we’re looking for



   - 1-2 years of experience in software sales, preferably high-volume SMB SaaS sales - with closing experience

   - Consultative, customer-first sales approach

   - History of personal and professional excellence

   - Lifelong learner mindset and commitment to professional growth and development

   - You thrive while working in a fast-paced environment where change is common.

   - You have strong sales acumen, effective time management and organization skills.

   - Experience with restaurants (selling to or working in!) is a huge plus.



  Interview Process



   1. Recruiter Screen — 30-minute phone call to align on your background, what you're looking for, and answer any early questions

   2. Hiring Manager Screen — 45-minute video interview with the hiring manager to go deeper on your experience and how you work

   3. Technical Case Study — 75 min video interview with sales leadership to assess your sales chops

   4. Final Round — 45-minute video conversation with a C-suite executive



   Compensation and benefits



   - The salary for this role is CAD $150,000k on-Target Earnings (50/50 base + commission with uncapped commission), plus a generous equity pre-IPO equity package.

   - Other benefits include comprehensive health coverage, unlimited/flexible PTO - plus extra fun perks!





  Notice - Employment Scams

  Communication from our team regarding job opportunities will only be made by an Owner team member with an @owner.com email address.



  We do not conduct interviews over email or chat platforms, and we will never ask you to provide personal or financial information such as your mailing address, social security number, credit card numbers or banking information. If you believe you are being contacted by a scammer, please mark the communication as "phishing" or “spam” and do not respond.



