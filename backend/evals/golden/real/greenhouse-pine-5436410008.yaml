text: |
  Senior Financial Analyst
  Toronto, Ontario, Canada

  About Pine

  At Pine, we're all about transforming the outdated and complicated home financing process, and creating a simpler, faster, and better experience for Canadians. How? With innovative technology and talented, understanding people.

  We strive to have a culture where everyone shares ideas and gives input, takes ownership, feels valued and takes pride in their work. We work hard and play hard!

  We have strong financial backing from some of North America’s most sought after VC’s and we’re ready to disrupt the Canadian Mortgage Market in a HUGE way!

  What you’ll do:

  Accounting Support

  • Lead the month-end close processes, including reconciliations, bookkeeping review, adjusting entries, and financial statement preparation
  • Maintain and reconcile general ledger accounts, including weekly reconciliation of funding remittance and clearing accounts
  • Own the accuracy, completeness, and reliability of financial data across multiple subsidiaries
  • Ensure compliance with applicable accounting standards and financial reporting requirements
  • Research and recommend appropriate accounting treatment for complex or non-routine transactions

  Financial Analysis

  • Apply a strong understanding of accounting principles to analyze financial statements, identify trends, and generate actionable insights
  • Gather and synthesize financial and operational data from multiple sources to track and monitor key performance indicators
  • Conduct routine and ad hoc scenario analyses to quantify potential outcomes and assess the financial and revenue implications of business decisions
  • Develop clear reporting and analysis that helps management understand business performance, key drivers, and emerging trends

  Strategic Business Support

  • Partner with management to develop budgets, forecasts, and variance analyses that support strategic decision-making
  • Identify and implement opportunities to improve processes, controls, and efficiency across the accounting and finance function
  • Own routine and ad hoc reporting for external stakeholders
  • Support the Head of Finance with strategic initiatives, financial analysis, and other ad hoc projects

  What you’ll bring:

  • 5+ years of relevant experience in financial analysis, accounting, corporate finance, or a similar role
  • Financial reporting expertise. Strong knowledge of accounting principles and financial reporting standards, with the ability to assess and recommend accounting treatment for complex transactions
  • Management reporting. Strong experience with variance analysis, KPI reporting, and developing dashboards or reporting packages that clearly communicate business performance and insights
  • Advanced Excel skills. Experience building and managing complex financial models and spreadsheets using advanced formulas, data tools, and/or automation to streamline recurring work
  • Critical thinking. Ability to evaluate information objectively, challenge assumptions, and develop data-informed recommendations. Demonstrates strong analytical rigor and attention to detail, including thorough self-review of data, assumptions, and outputs
  • Communication skills. Ability to clearly communicate complex financial information and recommendations to both financial and non-financial stakeholders
  • Ownership and adaptability. A proactive, ambitious mindset with the ability to take ownership, solve problems, learn new skills as needed, and work effectively both independently and cross-functionally
  • Data visualization. Familiarity with analytical tools beyond Excel and the ability to present financial and business data in a clear and intuitive way

  Our Commitment to Diversity and Inclusion

  We’re committed to growing and empowering a more inclusive community within our company. That’s why we hire and cultivate diverse teams of people from all backgrounds, experiences, and perspectives. We believe that true innovation happens when everyone has room at the table.

  If you need any accommodations, please inform Human Resources upon initial connection.
