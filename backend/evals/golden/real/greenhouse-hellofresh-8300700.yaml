  Senior Demand Planner
  Toronto, Ontario, Canada

  Location: 110 Spadina Ave

  Schedule: Monday to Friday, 9am - 5pm

  S'more about the team

  Factor Canada is looking for a Senior Demand Planner for the Factor Brand. You will play a critical role in forecasting customer demand to ensure that our meals are delivered accurately and efficiently, building scenarios to support business decisions. You will collaborate with various departments including marketing, sales, operations, and supply chain to optimize inventory levels and enhance customer satisfaction. This is a key role with significant impact on all areas of the business.

  Lettuce share what this role will be responsible for:

  • Forecast topline long-term as well as medium-term scenarios to support business decisions, taking into consideration the marketing initiatives, product pipeline and market conditions.
  • Develop, monitor, and adjust demand forecasts (including New product and SKU forecasting, box/recipe forecasting) using historical data and market trends.
  • Analyze forecast accuracy and leverages root cause analysis, pareto analysis, and other tools to deep dive forecast misses. Implement improvements to minimize future forecast errors.
  • Utilize statistical and analytical tools (exponential smoothing models, bottom-up/top-down forecasting, moving averages) to predict future demand patterns.
  • Work closely with the marketing and product teams to understand promotional plans, new product launches, and market trends.
  • Support upcoming business-to-business forecasting and order management initiatives, develop processes and tools to ensure smooth B2B launch and execution for downstreams.
  • Drive relevant tech implementation to drive a more modern and efficient demand planning domain.
  • Coordinate with supply planning to ensure SKU-level forecasts are aligned with demand forecasts.
  • Communicate demand plans and adjustments to relevant stakeholders effectively.
  • Develop and present on weekly and monthly Demand Planning KPIs - key performance indicators (including but not limited to forecast accuracy KPIs).
  • Identify opportunities for process improvement within the demand planning function.
  • Maintain resource/reference files and update existing tools on a weekly basis.
  • All other duties, as assigned

  Sound a-peeling? Here's what we're looking for:

  • Must haves:

  • 3 - 5 years of relevant supply chain experience in demand planning, supply planning or similar roles.
  • Bachelor’s degree in Engineering, Supply Chain Management, Business, Economics, Statistics, or a related field.
  • Proficiency in demand planning software and tools (Google Sheets, Excel, SQL, Python, Tableau) complemented with exceptional analytical and problem solving skills
  • Excellent communication and interpersonal skills to collaborate effectively with cross-functional teams.
  • High energy, enthusiasm, and a can-do attitude. You’re used to working in a high pressure, fast paced, and constantly changing environment
  • Driven and self-motivated - you will be making a meaningful difference in our business and the lives of our employees and customers
  • Ability to handle multiple projects and assignments, while being able to prioritize, achieve objectives, and meet deadlines

  • Nice to haves:

  • Proficiency with Python and Tableau.
  • Experience in a startup or high-growth environment.
  • Detail-oriented with strong organizational skills.
  • Knowledge of the meal kit and/or ready-to-heat industry is a plus.
  • Completed or currently pursuing a supply chain or demand planning certification.

  Let’s cut to the cheese, this is why you'll love it here:

  • Box Discount - Amazing discounts on 1 box per week! 75% discount on weekly HelloFresh and Chefs Plate meal kits AND 50% off weekly Factor meal box.
  • Health & Wellness - Health & Dental benefits from day 1, a Health Spending Account, unlimited access to the Headspace app to meet your self-care needs, and 25% discount on GoodLife fitness memberships!
  • RRSP Matching - Competitive RRSP matching program offered
  • Vacation & PTO - Time off is also an important part of self-care! We offer generous vacation and PTO to help you create a good work-life balance.
  • Family Benefits - A parental leave top-up program for expectant parents.
  • Growth & Development - We support your career progression, provide development opportunities, and invest in your continued learning through our organization wide L&D fund.
  • Work Hard & Have Fun - From team socials to engaging company days, you’ll have plenty of opportunity to experience the fun!
  • Diversity & Inclusion Initiatives - With impactful ERG’s like FreshPride, Women Empowered and LIMES, we are committed to our diversity, equity & inclusion efforts.
  • Food Puns - this one is kind of a big dill if you haven’t already noticed. We even have some punny meeting room names!

  Working Conditions:

  It’s no surprise that as a food company, we use many ingredients that may be considered common allergens (i.e. peanuts, tree nuts, milk, etc.). Whether this role is based out of our headquarters or one of our distribution centers, it is possible that you may be exposed to such allergens in this role. If you have any concerns with being exposed to any particular food ingredients, including meat, please disclose this during the hiring process.

  If this sounds like you, please click the "Apply Now" button. If this role doesn't quite match what you're looking for, but you'd like to know more about joining the HelloFresh team, please visit our Jobs page to view our other vacancies. We'd love to hear from you!

  HelloFresh Canada uses AI-integrated technology to help us process and evaluate applications more efficiently. This includes tools that screen and assess candidate qualifications based on the requirements for this role. While these tools assist our workflow, all final selection decisions are made by our hiring team.

  This is a posting for an existing vacancy. We are actively seeking to fill this position.

