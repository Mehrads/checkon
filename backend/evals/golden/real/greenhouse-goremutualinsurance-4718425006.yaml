text: |
  Senior Actuarial Analyst
  Cambridge, Ontario, Canada; Toronto, Ontario, Canada

  At Gore Mutual, we’ve always set ourselves apart as a modern mutual that does good. Now, we’re proudly building on that legacy to transform our company—and our industry—for the better.

  Effective January 1, 2026, Gore has joined Beneva—the country’s largest mutual insurance company—as part of its Property & Casualty operations in Ontario and Western Canada. During 2026, Gore will combine its operations with Unica Insurance, Beneva’s Ontario-based subsidiary specializing in niche commercial and personal insurance, creating a stronger, more diversified mutual insurer with greater scale and long-term stability.

  Every decision and investment remains anchored in long-term benefits to customers, members, and communities. Come join us.

  Are you energized by finding the story in the data and turning analysis into action? Join a growing Canadian P&C insurer where technology, enterprise analytics, and bold investments in AI are creating new possibilities for actuarial work.

  As a Senior Actuarial Analyst, you will help shape the next generation of actuarial models and predictive analytics solutions. You will take ownership of meaningful analytical work, deepen your understanding of the bigger picture, and collaborate with colleagues across Actuarial, Claims, and Underwriting. This is a hands-on opportunity to build your expertise, contribute from day one, and grow alongside a team invested in your success.

  What You’ll Make Happen:

  • Turn data into insight: Own the journey from raw data to business-ready analysis.
  • Build smarter actuarial solutions: Develop and implement actuarial models and perform key calculations as you support less experienced colleagues.
  • Explore the bigger picture: Conduct project-specific research, investigate emerging actuarial approaches, and connect your analysis to the decisions that matter.
  • Communicate technical findings: Present technical solutions to stakeholders and look for ways to make results better.
  • Grow your career: Expand your technical and business skills through meaningful projects, cross-functional collaboration, and support for your actuarial development.

  What You Bring:

  • A strong academic foundation: An undergraduate degree in Actuarial Science, Mathematics, Statistics, or a related quantitative field.
  • Progress toward your actuarial designation: Five to seven CAS exams completed and a commitment to continued exam progress.
  • Relevant experience: Three to five years of experience of relevant experience.
  • Technical curiosity: A solid programming foundation, exposure to modern actuarial modelling techniques, and the ability to build models from the ground up.
  • An analytical mindset: Strong quantitative, critical-thinking, and problem-solving skills, with the ability to work carefully through detailed data and deliver practical solutions.
  • A collaborative approach: Curiosity, initiative, clear communication, and enthusiasm for learning from others while contributing your own ideas.

  Why This Role Stands Out

  Your work will contribute directly to financial strength, regulatory confidence, and better business decisions. You’ll gain exposure beyond traditional actuarial analysis by partnering with stakeholders across the organization as part of a supportive team that values fresh thinking, continuous learning, and practical innovation.

  Ready to turn numbers into impact? Bring your curiosity, ideas, and analytical talent. Help us build what’s next.

  #LI-Hybrid

  The expected base salary range for this position is $79,500 - $129,500. Depending on your relevant experience, skills, qualifications, market conditions and business needs, base compensation may vary. You have the potential to earn more through Gore Mutual’s discretionary bonus program which gives you an opportunity to increase your total compensation, provided the business meets its performance targets and you meet your individual goals.

  Please note: This range reflects the expected base salary for this role but may not represent the full compensation range for all experience and skill levels. During the recruitment process, we will discuss and consider how your unique qualifications align with the broader range for this position.

  Gore Mutual is proud to offer a comprehensive total rewards package which includes extended health and dental benefits, disability insurance, retirement plan matching, paid time off, recognition and perk programs.

  This posting pertains to an existing vacancy that is actively being filled.

  Accessibility for applicants

  Gore Mutual Insurance Company is committed to providing accommodations for people with disabilities during all phases of the recruiting process, including the application process.

  If you require accommodation because of a disability, we will work with you to meet your needs. Contact us and a human resources representative will consult with you to determine an appropriate accommodation.

  Should you request an accommodation during the interview process, please notify your Talent Acquisition Consultant.
