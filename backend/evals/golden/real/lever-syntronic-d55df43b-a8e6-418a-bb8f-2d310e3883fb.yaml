  Power Amplifier Designer
  Kanata, ON / Hardware / Permanent

  Join Syntronic: Where Your Innovation Shapes the Future
  At Syntronic, we don't just follow industry trends—we set them! Join us in partnering with visionary companies and the brightest minds to turn ground-breaking ideas into reality. Imagine working on cutting-edge telecom advancements, pioneering automotive tech, life-saving healthcare innovations, and next-gen industrial automation. Our projects are diverse, impactful, and at the forefront of technological innovation. Be a part of something extraordinary!

  Who are we?:
  Syntronic is a global leader in design and development, specializing in electronics, electro-mechanics, and software. We’re not just a company; we’re a community of innovators. Our teams work on projects that define the future—from creating state-of-the-art communication systems and autonomous vehicles to advancing IoT solutions that revolutionize everyday life. At Syntronic, your work will make a real difference.

  What we're looking for:
  We are seeking individuals who want to:
  ·        Collaborate with top-tier clients on transformative, cutting-edge projects.
  ·        Engage with and learn from industry leaders
  ·        Innovate from concept to completion, ensuring high standards.
  ·        Gain international experience on global projects.
  ·        Thrive in an entrepreneurial environment that supports new ideas.
  ·        Explore multiple sectors like telecommunications, automotive, healthcare, and industrial automation.


  We are looking for an experienced Power Amplifier Designer to support the development of high-performance RF power amplifier solutions for advanced wireless products. This role will focus on the design, simulation, optimization, and validation of board-level PA circuitry, with an emphasis on efficiency, linearity, output power, and overall RF performance. The ideal candidate has strong hands-on experience with RF power amplifier design, simulation, component selection, and lab validation, and is comfortable working closely with hardware, systems, test, and integration teams throughout the development lifecycle.

  What you'll do
  • Design and develop high-power RF amplifier solutions, including Doherty power amplifier architectures and related RF circuitry.
  • Perform schematic-level design, simulation, and optimization of PA circuits to meet output power, efficiency, linearity, gain, and spectral performance requirements.
  • Select, evaluate, and characterize RF components, transistors, matching networks, bias networks, and supporting circuitry.
  • Support PCB layout activities and review RF layout, grounding, impedance control, and thermal considerations that impact amplifier performance.
  • Perform hands-on lab testing, tuning, characterization, and debugging using RF test equipment.
  • Analyze amplifier performance and troubleshoot issues related to efficiency, distortion, stability, thermal behaviour, or system integration.
  • Collaborate with RF, hardware, systems, software, and verification teams to support product integration and performance optimization.
  • Prepare design documentation, test results, technical reports, and participate in design reviews throughout the development cycle.
  • Support continuous improvement activities and provide technical guidance to more junior team members when required.

  What you'll need to get the job done
  • Master’s or PHD in Electrical Engineering, Electronics, RF/Microwave Engineering, or a related technical discipline.
  • 5+ years of experience in power amplifier design for wireless or telecommunications products.
  • Strong hands-on experience designing and optimizing RF power amplifiers, preferably including Doherty architectures.
  • Solid understanding of RF and microwave circuit design, matching networks, biasing, stability, linearity, efficiency, and thermal considerations.
  • Experience with RF simulation and analysis tools such as ADS, MATLAB, or similar environments.
  • Strong knowledge of RF lab equipment including spectrum analyzers, network analyzers, signal generators, power meters, and oscilloscopes.
  • Experience with component selection, characterization, schematic capture, and board-level RF design.
  • Strong troubleshooting and analytical skills with the ability to work effectively in a multidisciplinary development environment.

  What will make us REALLY love you
  • Experience developing RF hardware for 4G/5G base stations, radio units, or other high-power wireless infrastructure products.
  • Familiarity with 3GPP radio performance requirements and wireless standards such as LTE and 5G NR.
  • Experience with digital predistortion (DPD), envelope tracking, or other PA efficiency and linearization techniques.
  • Knowledge of GaN, LDMOS, or other RF power transistor technologies.
  • Experience with load-pull analysis, impedance matching, or large-signal RF simulation.
  • Experience supporting products through integration, verification, qualification, and production release.

  $100,00 - 140,000
  This position is for an active vacancy.


