  Shop Technician
  Concord, Ontario L4K 1A3 / DJ Industrial / Technician, Warehouse, Driver & Branch Roles

  DJ Industrial, a SunSource company, was founded in 1969 and has grown from a small hose and fitting outlet to a leading designer and manufacturer of Pneumatic, Hydraulic and Precision machined components and systems.  DJ Industrial is a SunSource company.
  www.djindustrial.com


  The Shop Technician position is responsible for the repair of machinery and equipment,
  component assemblies, and parts in the shop, including testing, diagnosing, evaluating, troubleshooting,
  parts ordering, technical report writing, warranty reporting, maintaining care of company assets, and
  proper communication with others.

  The below is intended to describe the general content of and requirements for the performance of this job.  It is not to be construed as an exhaustive statement of duties, responsibilities or physical requirements.  Nothing in this job description restricts management’s right to assign or reassign duties and responsibilities to this job at any time.

  Essential Functions
  • Repairs equipment and components, including Development of a repair plan and sequence,
  • determining necessary parts, materials, tooling, etc. and performing repairs properly and safely,
  • with proper quality assurance testing of repair component or system and machine in a timely
  • and efficient manner.
  • Generates, maintains, and completes all necessary reports legibly and in a timely fashion for
  • parts ordering, special tooling usage, daily service reports, and work order closure.
  • Use and understand proper test equipment to troubleshoot repairs, blueprints, technical data,
  • and service manuals.
  • Retrieves and returns parts and/or materials through Company’s parts ordering system.
  • Uses Company’s computer systems to manage work processes.
  • Retrieves and returns special tools as needed. Maintains proper care and use of special tools
  • including major shop equipment, such as but not limited to, air compressor, cleaning tanks,
  • forklift, lathe, mill, crimping machine etc.
  • Projects positive behaviors by interacting with co-workers, customers, vendors, suppliers, and
  • visitors through constructive working relationships.
  • Operate a lathe or mill to fabricate metal or plastic parts.
  • Perform disassembly, cleaning, inspection, measuring, reassembly and testing of valves at DJI
  • facilities.
  • Fabricate hose assemblies per supplier’s specification, including set-up and calibration of
  • equipment, cleaning, inspection, measuring and testing.
  • Adhere to all site safety and performance requirements.
  • Communicate timely updates to management and co-workers to ensure timely and successful
  • completion of job responsibilities.
  • Works closely with co-workers, management, and safety coordinator to ensure compliance with
  • OSHA and other safety regulations.

  Experience, Education and Skills
  • Highschool / Secondary School diploma
  • Training or certification in related technical area is preferred
  • Previous experience in working with power/hand tools, saws, machine equipment, tube benders and calipers.
  • Must have excellent communication skills and customer relationship traits.
  • Computer proficiency
  • Ability to lift 50lbs.

