text: |
  Maintenance Technician - Detroit, MI Plant
  Ambassador Precision Castings

  Ambassador Precision Castings makes aluminum castings for the auto industry, with our head office and two plants
  in Windsor, Ontario and a third plant in Detroit, Michigan, just across the bridge.

  We're hiring a maintenance technician for our Detroit plant (afternoon shift).

  Responsibilities
  - Repair and maintain die casting machines, trim presses and robots
  - Troubleshoot hydraulic, pneumatic and electrical systems
  - Complete preventive maintenance and keep records in our CMMS

  Requirements
  - 3+ years of industrial maintenance experience
  - Journeyman card or equivalent trade experience
  - Must be authorized to work in the United States

  Pay: US$32.00 - US$38.00 per hour, plus shift premium.
  All work is performed at our Detroit, MI facility.
