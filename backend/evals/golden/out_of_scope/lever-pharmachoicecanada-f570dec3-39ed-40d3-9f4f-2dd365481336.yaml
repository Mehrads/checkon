text: |
  Pharmacist - FT or PT - Roblin, MB
  Canada / Pharmacy / Full-time or Part-time

  We are an independently owned pharmacy and it has been in the family since 1907. We have a full dispensary with about 3500 sq feet of front store. We currently have 1 full-time pharmacist on staff plus the owner who is also a Pharmacist. Our hours are Mon-Fri 9:00am-5:30pm and Saturday 9:00am-2:00pm closed Sundays and Holidays. We're passionate about delivering exceptional patient care while creating an environment where our team members are valued, supported and empowered to make a difference.

  Duties and Responsibilities
  • Fill, check, dispense and council medication.
  • Administer injections
  • Independent thinking, decision making, and problem-solving abilities.
  • Exceptional customer service and professionalism.
  • Proficiency with computers; knowledge of pharmacy systems.
  • Able to build and maintain strong relationships with patients, physicians, and healthcare partners.
  • Completion of all mandatory training and participation in continuing education as required.
  • Proficient with Kroll is an asset.

  Benefits
  • Signing bonus
  • Extended medical/Dental benefit package.
  • Professional licensing, association membership & Malpractice insurance fully reimbursed
  • 4 weeks vacation
  • 1 hour lunch break
  • Relation and housing allowance
  • Worklife balance with no evenings, Sundays or Stat holidays
  • Future opportunity to purchases the business
  • Collaborative team environment with strong Pharmacy support.

  At PharmaChoice, we see the pharmacist’s role as that of a recognized community leader, whose commitment to their patients makes them an important member of their patient’s health care team. At the core of PharmaChoice is our belief that local business is the foundation of a strong community. Today, this commitment is stronger than ever. We exist to celebrate the independence of more than 1,100 locations across Canada. Each location is unique and tailored to the community it serves.

  $70 - $75 CAD per hour
