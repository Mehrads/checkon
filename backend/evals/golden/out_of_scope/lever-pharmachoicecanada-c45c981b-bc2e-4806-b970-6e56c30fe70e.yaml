  Pharmacy Technician - Killarney, MB
  Killarney, MB / Pharmacy / Contract

  The Pharmacy Technician is responsible for providing superior pharmacy patient care in a friendly and professional manner. The successful candidate is able to work efficiently in a team environment. The position is a full-time 18-month termwith the potential to become full-time permanent.

  Responsibilities
  • Accurate prescription preparation
  • Data entry using Kroll pharmacy software
  • Compliance packaging
  • Inventory management
  • Compounding
  • Adhere to all confidentiality and privacy requirements
  • Maintaining a clean and safe work environment

  Requirements
  • Superior customer service skills
  • Previous work history as a pharmacy technician or assistant an asset
  • Ability to work independently in a fast environment
  • Enthusiastic learner
  • Strong work ethic and collaborative manner in a team setting
  • Strong problem-solving skills
  • Above average oral and written communication skills
  • Strong organizational skills and attention to detail
  • Comfortable working on computers

  Killarney Pharmacy is located in Killarney Place Mall in Killarney, Manitoba. Hours are Monday to Saturday 9am to 5:30pm. We have a large retail space and usually operate with two pharmacists and three assistants in the dispensary. We offer prescription services, compliance packaging and injection services to the residents of Killarney-Turtle Mountain and surrounding area.
