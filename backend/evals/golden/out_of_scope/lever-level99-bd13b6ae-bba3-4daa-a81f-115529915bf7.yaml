  Line Cook
  Lake Buena Vista, FL 32830 / Venue Teams / Full-time

  WHO WE ARE
  Level99 is a sprawling playground designed for adults with over 50 life-sized mini-games where Players dodge axes, crack puzzles, and outsmart real-world challenges. Each game lasts about 1–4 minutes and is built for 2–6 people to play together. One ticket to Level99 unlocks access to all of our games including Challenge Rooms, Player-vs-Player duels, and an art scavenger hunt. We save your progress each time you play so you can earn rewards and climb our coveted leaderboard.
  Alongside the games, Level99 offers a full-service bar and award-winning restaurant – featuring scratch-cooking, local craft beers, handmade cocktails, and a variety of event spaces. Level99 has locations in Natick, MA, Providence, RI, Tysons, VA, Disney Springs, FL, and is opening in West Hartford, CT, Paramus, NJ, King of Prussia, PA, and Raleigh, NC. Level99 is backed by Act III Holdings, led by Panera founder Ron Shaich, and we have a talented team that has worked on successful entertainment projects ranging from 5 Wits to Walt Disney Imagineering. Visit www.level99.com for more details.


  OVERVIEW
  Line Cooks support the Restaurant by preparing food, adhering to recipes, accommodating guest requests, and maintaining a clean, organized kitchen. Line Cooks will execute at high standards, keeping to proper ticket times, and presentation. A successful Line Cook will display honesty and personal integrity that is above reproach, choosing humility over the need to “be right,” and in all things acts as though they are the Owner and Operator of their venue.

  RESPONSIBILITIES
  • Bring a positive, warm, approachable attitude to your work everyday Uphold all standards set in the kitchen - from delivery to being served to a guest
  • Follow all recipes, preparation procedures, and par levels as determined by Culinary Leadership
  • Work service with urgency, striving to meet or exceed expectations for food delivery times
  • Communicate ordering needs accurately and effectively to Culinary Leadership
  • Maintain a clean and organized space regardless of business level and adhere to the highest standards of sanitation and hygiene
  • Ability to work a flexible schedule based on business needs which will include days, nights, weekends and holidays
  • Able to work 10 hour-plus shifts, plus ability to stand, sit, squat or walk for extended periods of time, walk up and down stairs
  • Able to grasp, reach overhead, push, lift and carry up to 50 pounds
  • Ability to remain composed and effective in a fast-paced and dynamic environment
  • Other duties, as assigned

  POSITION REQUIREMENTS
  • High school diploma or equivalent 1-2 years as a line cook or prep cook in a high-volume F&B business
  • Capacity to work efficiently under pressure in a constantly evolving setting
  • Demonstrates strong organizational skills and meticulous attention to detail
  • Maintains a positive, respectful, and courteous attitude towards all team members
  • Leads by example with a positive, joyful, upbeat, and energetic demeanor
  • Effective verbal and written communication skills
  • Knowledge of health and sanitation code and policies
  • Highly organized with strong attention to detail

  OTHER DESIRABLE SKILLS & EXPERIENCE
  • Multilingual
  • Relevant Education in Hospitality Management, Culinary, or other related degree

  While we don’t expect a candidate to have deep experience in all of the above, we’re looking for someone with the passion and capability to learn quickly in the areas that are new!

  YOU MIGHT BE A FIT ON THE LEVEL99 TEAM IF YOU…
  Like to laugh, would be described as a "low maintenance, low drama" person, have a tendency to have a bit of fun while you work
  Have a high tolerance for ambiguity, like to go fast, and are excited to learn on the job
  Are just a little bit obsessive about getting the details right the first time
  Have a high energy personality, the kind of person who is typically smiling, and likes to "get it done now"

  Level99 is an E-Verify employer.
