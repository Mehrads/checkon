  Crane Operator/Driver
  Calgary, AB / Flynn Group of Companies / Shop Full-time

  At Flynn, it's not just a job, it's a career


  Crane Operator/Driver
  Building Envelope, Construction
  Calgary, AB

  Our Flynn Canada Ltd Calgary location is looking for an experienced Crane Operator/Driver to join our team!

  A Day in the Life:
  - Operate a 28 tonne stinger on a daily basis
  - Loading/Unloading material
  - Heavy Lifting required
  - Perform pre-operational inspection, calculate crane capacities and weight
  - Complete Field Level Hazard Assessments prior to all lifts
  - Strictly follow safety procedures and guidelines
  - Efficiently load and unload material without damage
  - Communicate with Foreman, Superintendents and Managers on day-to-day operations

  What We Offer:
  - Competitive wages and benefits
  - RRSP matching
  - Great environment where our motto is “Flynn Family Winning Together”!
  - Training and Development opportunities.


  What We Are Looking For:
  - Journeyman Operator ticket is an asset.
  - Experience with physically demanding work
  - Class 1 driver’s license
  - Dependable and willing to work various hours as required
  - Must have a high-level attention to detail
  - Good oral and written communication skills
  - Minimum of 2 years of operating a crane.
  - Must be safety oriented
  - Strong problem solving and time management skills

  #LI-NS1

  Flynn Group of Companies is the leading trade contractor in North America that works on virtually every aspect of a building’s outer layer, including Roofing, Glazing, Waterproofing, and Architectural Metals. The foundation of our award winning success is having the right people on our team.
  Disclosure: We use an AI-powered system to initially screen resumes.  However,  all applications/resumes are also reviewed by our team of Human Resources and Talent Acquisition Professionals to ensure a fair and thorough evaluation in determining a candidate’s potential fit for a role they applied to.
  This posting is for an existing vacancy within the organization.
