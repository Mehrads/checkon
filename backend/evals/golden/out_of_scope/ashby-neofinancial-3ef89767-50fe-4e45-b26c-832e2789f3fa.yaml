text: |
  Chef d'équipe - CF Fairview Pointe Claire
  Pointe-Claire

  Join us to build a more rewarding financial future for all Canadians


  At Neo, we’re on a mission to build a more rewarding financial future for all Canadians. Life at a rapidly scaling tech startup isn’t for everyone. It’s complex, fast-paced, high-pressure, but also incredibly fulfilling. Since its founding in 2019, Neo has gained incredible traction and is one of the fastest-growing fintech companies in Canada.

   - #1 on Deloitte’s Technology Fast 50 for 2023, 2024, and 2025 https://www.newswire.ca/news-releases/neo-financial-achieves-first-ever-three-peat-win-as-number-one-on-deloitte-s-technology-fast-50-list-889692540.html — the first company ever to achieve a three-peat at the top!

   - #1 Fastest Growing Company in Canada for 2024 by Globe & Mail https://www.businesswire.com/news/home/20240927952651/en/Neo-Financial-Ranks-No.-1-on-The-Globe-and-Mail%E2%80%99s-2024-List-of-Canada%E2%80%99s-Top-Growing-Companies

   - Top-ranked mobile apps and credit cards

   - Team of 500+ people

   - 1M+ customers

   - 10K+ retail partners



  Le rôle

  Nous recherchons un chef d’équipe des ventes dynamique pour diriger et mobiliser une équipe de représentants des ventes. Vous jouerez un rôle clé dans l’acquisition de nouveaux clients en assurant l’encadrement de votre équipe pour atteindre les objectifs d’inscription à Neo Credit, Neo Money et aux autres solutions de l’entreprise.
  Vos responsabilités :

   - Encadrer et perfectionner : Former, encadrer et offrir un suivi continu aux représentants commerciaux afin de perfectionner leurs compétences de vente et leur connaissance des produits.

   - Gérer les opérations : Créer et optimiser les horaires de l’équipe pour assurer une couverture maximale lors des événements, et superviser le montage et le démontage des kiosques d’activation de la marque.

   - Soutenir la performance : Suivre les objectifs de vente individuels et collectifs, ajuster les stratégies et générer des rapports de performance réguliers pour la direction.

   - Donner l’exemple : Offrir un soutien pratique sur le terrain lors des événements, résoudre les problèmes et vendre activement les produits Neo pour atteindre les objectifs de revenus.

  Ce que nous recherchons :

   - Expérience démontrée dans l’atteinte ou le dépassement des objectifs dans un rôle de vente.

   - Expérience en leadership, en supervision ou en encadrement d’une équipe (idéalement dans le domaine des ventes).

   - Excellentes compétences en communication, en relations interpersonnelles et en organisation.

   - Disponibilité et flexibilité pour travailler en soirée et les fins de semaine afin de s’adapter aux horaires des événements.

  Rémunération globale
  Alors que Neo continue de croître, nous avons à cœur d’offrir un programme de rémunération concurrentiel et parmi les meilleurs du marché, qui reconnaît l’impact de chaque membre de notre équipe.

  Salaire

  Nous offrons un salaire de base compétitif, aligné sur le marché. La rémunération finale est basée sur vos compétences, votre expérience et l'envergure de vos responsabilités. Pour les talents exceptionnels, nous sommes prêts à offrir une rémunération qui reflète pleinement leur valeur.

  À quoi ressemble la vie en tant que membre propriétaire chez Neo ?

   - 🇨🇦 Vous contribuerez à transformer le secteur financier aux côtés des meilleurs talents au Canada, en aidant les Canadiens à atteindre leurs objectifs financiers tout en évoluant rapidement dans un environnement stimulant.

   - 📈Pour les postes admissibles, une structure d'actionnariat qui vous permet de prendre part à notre réussite.

   - 👥Collaborer avec les esprits les plus brillants pour bâtir quelque chose de significatif, unis par un engagement commun envers l’innovation, la curiosité et l’excellence.

   - ❤️‍🩹 Des avantages sociaux flexibles en matière de soins de santé ainsi qu’une assurance vie.

   - 🌴 21 jours de congés payés + jours fériés et congés personnels.

   - 💪 Comptes de dépenses de santé et de bien-être personnel.

   - 🤑 Une grande variété de rabais grâce à notre réseau de partenaires.

   - 🏠 Accès privilégié aux nouveaux produits ainsi qu’à des rabais sur les prêts hypothécaires Neo à durée fixe.

   - 👶 Prestations complémentaires parentales et acquisition d’actions pendant les congés de longue durée.

   - 🎉 Soirées et événements Neo.

   - 🧠 Réunions d'équipe à l'échelle de l'entreprise (huddles) et formation continue.




  WORKING AT NEO:

  The people who thrive at Neo are resourceful, growth-oriented, and driven to win. We hold ourselves to high standards because we’re on a mission that matters: to build a more rewarding financial future for all Canadians. As individuals and as a team, we constantly challenge ourselves and each other to raise the bar and deliver exceptional experiences for our customers. Our commitment to customer success drives everything we do, from building world-class products to providing exceptional support at every step of their journey. If this resonates with you, keep reading.



  We trust, respect, and support each other. This means honest conversations, constructive input, and empowering each other to move fast and think big. You’ll be surrounded by people who push you to be your best. We primarily collaborate in person across our Calgary, Winnipeg, and Toronto offices, where ideas move quickly and teams build momentum together. As we continue to scale and evolve, we’re looking for builders, innovators, and problem solvers who thrive on challenge–people who would rather blaze a trail through uncertainty than follow a well-paved path.



  At Neo, ownership is part of how we think and operate. For select roles, equity participation reinforces that mindset by giving employees a direct stake in the company’s long-term success. Regardless of role, every team member is expected to think like an owner and make decisions that move the business forward.




  APPLY WITH US:

  We believe in equal opportunity and are committed to creating an inclusive climate where everyone can thrive. Customers trust us with their finances, so successful candidates for this position will be required to undergo a security screening, including a criminal records check and a credit check.



  By continuing with your application, you agree to the Candidate Privacy Notice https://www.neofinancial.com/candidate-privacy-policy.pdf, which guides how we process your personal information for the purpose of your application.



  Neo Financial leverages artificial intelligence (AI) to reinforce our candidate evaluation process, including the initial assessment of applications and screening of candidates. These tools support our recruitment team; however, all final hiring decisions are made by humans and are not based exclusively on automated processing. If you require further information regarding our data processing practices, please contact us.



  We are hiring for an open, vacant position.

  Compensation
  CA$45,760 • Offers Commission
