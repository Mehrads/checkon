text: |
  Pharmacist - FT or PT - Cochrane, AB
  Cochrane, AB / Pharmacy / Full-time or Part-time

  We are a clinical pharmacy with a focus on the community in which we live. All staff live in the community and strive to know the people that live among us. We provide a full range of pharmacy services, with a focus on managing chronic conditions and being a first access point for community members to be assessed

  Responsibilities
  • Patient Care & Clinical Services: Conduct clinical assessments, manage chronic and acute medication therapy, and provide comprehensive patient counseling.
  • Clinical Interventions: Administer injections and vaccines, adapt and renew prescriptions, and manage drug therapies to optimize patient health outcomes.
  • Dispensing & Quality Assurance: Oversee the accurate preparation, packaging, labeling, and dispensing of medications, ensuring strict adherence to safety and regulatory standards.
  • Interdisciplinary Collaboration: Work closely with local physicians, clinics, and multidisciplinary healthcare teams to coordinate seamless transitions of care.
  • Healthcare Education: Serve as a trusted drug information resource for patients, caregivers, and fellow healthcare professionals

  At PharmaChoice, we see the pharmacist’s role as that of a recognized community leader, whose commitment to their patients makes them an important member of their patient’s health care team. At the core of PharmaChoice is our belief that local business is the foundation of a strong community. Today, this commitment is stronger than ever. We exist to celebrate the independence of more than 1,100 locations across Canada. Each location is unique and tailored to the community it serves.
