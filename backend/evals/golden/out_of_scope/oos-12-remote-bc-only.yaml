text: |
  Claims Specialist, Auto (Remote - British Columbia)
  Lakeview General Insurance

  Lakeview General is a national property and casualty insurer headquartered in Toronto. We're growing our Western
  claims team and hiring a claims specialist to handle auto claims for our British Columbia customers.

  Location: remote. You must live and work in British Columbia. Occasional travel within B.C. for complex losses.

  Responsibilities
  - Investigate and settle auto physical damage and accident benefit claims
  - Work with repair shops, appraisers and customers by phone and video
  - Keep clear file notes and meet service standards

  Qualifications
  - 2+ years of auto claims experience
  - CIP designation, completed or in progress
  - A valid driver's licence

  Salary: $62,000 to $74,000 a year. This posting is for an existing vacancy.
