  Pharmacist - Lewisporte, NL
  Lewisporte, NL / Pharmacy / Full-time

  Lewisporte PharmaChoice is the only locally owned & operated pharmacy in Lewisporte, NL which is located in the heart of the scenic Notre Dame Bay. This area is a hub of tourist activity throughout the year but particularly during iceberg season. Although considered a rural area, we are conveniently just a 45 minute drive to the nearby town of Gander & its well known international airport.

  Compensation
  We offer a Family or Single health & dental group plan where employer pays 50% & we would waive the customary probation period. Accommodation/housing could also be provided . To support work/life balance we are closed evenings & reduced weekend hours ( Saturday 9am-12pm & 2pm-5pm) 1 in 3 weekend rotation. 4 weeks of Paid Vacation annually, all licensing fees, and insurance & education fees paid.

  Responsibilities
  • Patient Care & Clinical Services: Conduct clinical assessments, manage chronic and acute medication therapy, and provide comprehensive patient counseling.
  • Clinical Interventions: Administer injections and vaccines, adapt and renew prescriptions, and manage drug therapies to optimize patient health outcomes.
  • Dispensing & Quality Assurance: Oversee the accurate preparation, packaging, labeling, and dispensing of medications, ensuring strict adherence to safety and regulatory standards.
  • Interdisciplinary Collaboration: Work closely with local physicians, clinics, and multidisciplinary healthcare teams to coordinate seamless transitions of care.
  • Healthcare Education: Serve as a trusted drug information resource for patients, caregivers, and fellow healthcare professionals

  Our pharmacy offers a welcoming environment that has 3 other experienced pharmacists on staff as well as many other assistants that will make adapting to a new workplace a seamless transition. Here you will benefit from the comforting scenery of a rural lifestyle while being close enough to amenities of nearby towns. Opportunity to work in nearby New World Island Pharmacy is an option as well & earn premium wages
