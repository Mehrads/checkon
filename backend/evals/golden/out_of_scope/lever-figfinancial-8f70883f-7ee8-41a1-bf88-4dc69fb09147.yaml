  Candidature spontanée | General application
  Montreal, Québec / Toronto, Ontario / Full Time

  À propos de Fig | About Fig

  Fig est une start-up fintech qui révolutionne le secteur du crédit au Canada. Nommée « Prêteur à la consommation de l'année » en 2024, Fig s'engage à simplifier le processus d'emprunt afin de le rendre plus efficace et plus accessible pour les Canadiens.

  Soutenue par la Banque Fairstone et le Régime de retraite des enseignants de l'Ontario, Fig occupe une position unique qui lui permet de combiner les avantages d'une vaste expérience en matière de prêt avec le dynamisme d'une start-up. Cette combinaison nous permet de répondre efficacement aux besoins de crédit des Canadiens issus de divers milieux financiers.

  ________________________________

  Fig is a Fintech start-up revolutionizing the lending industry in Canada. Named Consumer Lender of the Year in 2024, Fig is dedicated to simplifying the borrowing process to make it more efficient and accessible for Canadians.

  Supported by Fairstone Bank and Ontario Teachers Pension Plan, Fig is in a unique position to blend the benefits of extensive lending experience with the agility of a start-up. This combination allows the company to effectively meet the credit needs of Canadians from various financial backgrounds.


  Candidature spontanée | General application

  Le poste que vous cherchez n'est pas disponible actuellement? Envoyez-nous votre candidature spontanée, nous serons ravis de découvrir votre talent!

  Looking for a position that is currently not available? Please submit a general application. We're always looking for talented individuals to join the Fig team.

  Pourquoi Fig ? | Why Fig?
  • Une occasion unique de faire partie d’une entreprise en phase de démarrage.
  • Rémunération concurrentielle.
  • Régime d’épargne-retraite; l’employeur verse des cotisations de contrepartie.
  • Assurance collective complète pour les soins médicaux, dentaires et oculaires, ainsi qu’allocations de dépenses pour la santé et le bien-être.
  • Congés généreux pour vous aider à refaire le plein.
  • Prestation complémentaire pour congé parental pour soutenir votre famille.
  • Montant additionnel pour la formation continue afin d’appuyer votre perfectionnement professionnel.

  ________________________________

  • Unique opportunity to join a company in its early stages and make an impact
  • Competitive compensation
  • Retirement savings program with employer matching
  • Comprehensive medical, dental, and vision group insurance, as well as health and wellness spending accounts
  • Generous time off to help you recharge
  • Parental top-up to support your growing family
  • Continuing education stipend to support your professional development

  Énoncé sur la diversité | Our commitment to diversity, equity and inclusion

  Fig est un employeur qui se soucie de l’égalité des chances et de la diversité au sein de son entreprise. Nous ne faisons aucune discrimination fondée sur la race, la religion, la culture, l’orientation sexuelle, l’identité de genre et les capacités physiques.

  Nous considérons que la diversité des parcours, des perspectives et des expériences est essentielle à notre entreprise. C’est pourquoi nous croyons qu’il est important de favoriser un environnement où les membres de notre équipe peuvent se sentir à l’aise dans leur milieu de travail en étant eux-mêmes tous les jours. Nous voulons ainsi nous assurer que tous les membres du personnel travaillent dans un milieu où ils se sentent valorisés, écoutés et soutenus tout en poursuivant leur carrière et en soutenant leur développement personnel et professionnel.

  ________________________________


  We are an equal opportunity employer and are committed to diversity at our company. We do not discriminate on the basis of race, religion, culture, sexual orientation, gender identity and physical ability.

  Diversity of backgrounds, perspectives, and experience is fundamental to our business. We believe in fostering an environment where team members of all backgrounds can feel comfortable bringing their whole selves to work every day. We aim to ensure all of our employees work in an environment that makes them feel valued, heard, and supported while they strive towards career pursuits and their personal and professional growth.
