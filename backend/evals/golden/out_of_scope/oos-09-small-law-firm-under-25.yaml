notes: >-
  The firm has 11 people. Part III.1 doesn't apply, so the Canadian experience requirement isn't an ESA breach,
  although it may still raise a Human Rights Code question that CheckON doesn't check. Lawyer: should CheckON show
  a note on such wording even when the rules don't apply?
